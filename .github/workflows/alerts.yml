name: Intraday alerts

on:
  schedule:
    # каждый час 07:05–15:05 UTC = 10:05–18:05 МСК, по будням
    - cron: "5 7-15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check moves
        run: python alerts.py
      - name: Save state
        if: always()
        run: |
          git config user.name "market-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alerts_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Состояние алертов"
          git pull --rebase --autostash
          git push
