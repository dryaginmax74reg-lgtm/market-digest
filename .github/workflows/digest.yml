name: Market digest

on:
  schedule:
    # 04:40 UTC = 07:40 МСК, по будням (GitHub может запустить на 5–30 мин позже)
    - cron: "40 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      SEND_CHARTS: ${{ vars.SEND_CHARTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matplotlib
        run: pip install --quiet matplotlib
      - name: Send digest (card + text + dashboard data)
        run: python digest.py
      - name: Save dashboard data
        if: always()
        run: |
          git config user.name "market-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Данные дашборда $(date -u +%F)"
          git pull --rebase --autostash
          git push
