name: Market digest

on:
  schedule:
    # 04:40 UTC = 07:40 МСК, по будням (GitHub может запустить на 5–30 мин позже)
    - cron: "40 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      SEND_CHARTS: ${{ vars.SEND_CHARTS }}
      WATCHLIST: ${{ secrets.WATCHLIST }}
      BONDS_WEEK: ${{ vars.BONDS_WEEK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matplotlib
        run: pip install --quiet matplotlib
      - name: Bond ratings, issuers, turnover (for bonds page and Monday block)
        continue-on-error: true
        timeout-minutes: 6
        run: python bonds_meta.py
      - name: Build digest (card, dashboard data, digest.json)
        run: python digest.py --build
      - name: Publish dashboard data
        if: always()
        run: |
          git config user.name "market-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in docs/data.json docs/digest.json docs/bonds_meta.json bonds_state.json; do if [ -f "$f" ]; then git add "$f"; fi; done   # по одному: если файла нет, остальные всё равно публикуются
          git diff --cached --quiet && exit 0
          git commit -m "Данные дашборда $(date -u +%F)"
          git pull --rebase --autostash
          git push
      - name: Wait for the site to update (up to 4 min)
        if: ${{ vars.DASHBOARD_URL != '' }}
        continue-on-error: true
        run: |
          want=$(python -c "import json;print(json.load(open('docs/digest.json'))['updated'])" 2>/dev/null || echo "")
          [ -z "$want" ] && exit 0
          url="${DASHBOARD_URL%/}/digest.json"
          for i in $(seq 1 24); do
            got=$(curl -fsSL "$url?nocache=$RANDOM$i" 2>/dev/null | python -c "import json,sys;print(json.load(sys.stdin)['updated'])" 2>/dev/null || echo "")
            [ "$got" = "$want" ] && echo "сайт обновлён" && exit 0
            sleep 10
          done
          echo "сайт не успел обновиться — отправляю всё равно (страница покажет «обновите через минуту»)"
      - name: Send digest (card + buttons)
        run: python digest.py --send
