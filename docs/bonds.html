<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Облигации · подбор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="bondmath.js"></script>
<script src="bondscore.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#eef1f6; --card:#ffffff; --line:#e6eaf1; --soft:#f4f6fa;
  --ink:#101828; --ink2:#667085; --ink3:#98a2b3;
  --acc:#5b5bf7; --acc2:#8b5cf6; --up:#12b76a; --down:#f04438; --warn:#f79009;
  --s1:#5b5bf7; --s2:#f79009; --s3:#12b76a; --s4:#ee46bc;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0c111d; --card:#161b26; --line:#232a38; --soft:#1d2433;
    --ink:#f5f7fa; --ink2:#a0aabb; --ink3:#6b7587;
    --acc:#7a7aff; --acc2:#a07bff; --up:#32d583; --down:#f97066; --warn:#fdb022;
    --s1:#7a7aff; --s2:#fdb022; --s3:#32d583; --s4:#f670c7; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c111d; --card:#161b26; --line:#232a38; --soft:#1d2433;
  --ink:#f5f7fa; --ink2:#a0aabb; --ink3:#6b7587;
  --acc:#7a7aff; --acc2:#a07bff; --up:#32d583; --down:#f97066; --warn:#fdb022;
  --s1:#7a7aff; --s2:#fdb022; --s3:#32d583; --s4:#f670c7; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.4;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 90px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:26px;font-weight:800;margin:2px 0 0;letter-spacing:-.01em}
.hello{color:var(--ink2);font-size:13px;font-weight:600}
.hello a{color:var(--acc);text-decoration:none}
.upd{color:var(--ink2);font-size:12.5px;font-weight:600;text-align:right}
.icon-btn{border:0;background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);cursor:pointer;font-size:16px}
.top-right{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:8px;margin:4px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:14px;background:var(--card);color:var(--ink2);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.tab.on{background:var(--ink);color:var(--card)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--acc);color:#fff;font-size:12px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;min-width:0;margin-bottom:14px}
h2{font-size:16.5px;font-weight:800;margin:0}
.sub{font-size:12.5px;color:var(--ink2);font-weight:500;margin:2px 0 12px}
.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 12px;align-items:end}
.fld label{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:11px;padding:9px 10px;font:inherit;font-weight:700;font-size:14px}
.fld.big input{font-size:20px;font-weight:800;padding:10px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:0;background:var(--soft);color:var(--ink2);font:inherit;font-weight:700;font-size:13px;padding:8px 11px;border-radius:10px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--card)}
.btn{border:0;background:var(--ink);color:var(--card);font:inherit;font-weight:800;font-size:14px;padding:10px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}
.btn.acc{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tblwrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;color:var(--ink2);font-size:11.5px;text-align:right;padding:7px 7px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th[data-s]{cursor:pointer}
th:first-child,td:first-child{text-align:left}
th.sorted::after{content:" ↓"}th.sorted.asc::after{content:" ↑"}
td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:600}
td.nm{font-weight:700;white-space:normal;min-width:150px}
td.nm small{display:block;color:var(--ink3);font-weight:600;font-size:11px}
tbody tr:hover td{background:var(--soft)}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--ink2);margin-left:4px;vertical-align:1px}
.tag.w{background:rgba(247,144,9,.15);color:var(--warn)}
.tag.d{background:rgba(240,68,56,.12);color:var(--down)}
.tag.g{background:rgba(18,183,106,.12);color:var(--up)}
.rt{display:inline-block;min-width:38px;text-align:center;font-weight:800;font-size:12px;padding:2px 6px;border-radius:7px}
.rt.r0{background:rgba(91,91,247,.14);color:var(--acc)}
.rt.r1{background:rgba(18,183,106,.14);color:var(--up)}
.rt.r2{background:rgba(247,144,9,.16);color:var(--warn)}
.rt.r3{background:rgba(240,68,56,.14);color:var(--down)}
.rt.rn{background:var(--soft);color:var(--ink3)}
.add{border:0;background:var(--soft);color:var(--acc);font:inherit;font-weight:800;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:16px}
.add.on{background:var(--acc);color:#fff}
.qty{width:84px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:5px 7px;font:inherit;font-weight:700;text-align:right}
.del{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.kpi.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:600}
.kpi.hero .l,.kpi.hero .c{color:rgba(255,255,255,.9)}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
.kpi .c{font-size:12px;color:var(--ink2);font-weight:600;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.grid3{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.cv{height:260px;position:relative}
.note{font-size:12px;color:var(--ink3);line-height:1.55}
.warns{margin:0 0 12px;padding:0;list-style:none}
.warns li{background:rgba(247,144,9,.12);color:var(--ink);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:13px;font-weight:600}
.warns li.bad{background:rgba(240,68,56,.12)}
.prof{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.prof button{border:2px solid transparent;background:var(--soft);color:var(--ink);font:inherit;text-align:left;padding:12px;border-radius:14px;cursor:pointer}
.prof button b{display:block;font-size:14px}
.prof button span{display:block;font-size:11.5px;color:var(--ink2);font-weight:600;margin-top:3px;line-height:1.35}
.prof button.on{border-color:var(--acc);background:var(--card)}
details.params{margin-top:10px}
details.params summary{cursor:pointer;font-weight:700;color:var(--acc);font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.filters.pfil{grid-template-columns:1.4fr 1fr 1fr 1fr 1fr}
.filters.p1{grid-template-columns:1.2fr 2fr 1fr}
.fld{min-width:0}
.cur{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.muted{color:var(--ink3)}
.up{color:var(--up)}.down{color:var(--down)}
.empty{padding:34px;text-align:center;color:var(--ink2)}
.loading{padding:40px;text-align:center;color:var(--ink2);font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc)}
#report{display:none}
@media (max-width:980px){.filters{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.prof{grid-template-columns:1fr 1fr}.pgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:980px){.filters.pfil,.filters.p1{grid-template-columns:1fr 1fr}.filters.pfil .big,.filters.p1 .big{grid-column:1/-1}.filters.p1 .fld:nth-child(2){grid-column:1/-1}}
@media (max-width:600px){td.nm{min-width:110px}.wrap{padding:16px 12px 80px}.filters{grid-template-columns:1fr 1fr}.cur{grid-template-columns:1fr 1fr}.pgrid{grid-template-columns:1fr 1fr}h1{font-size:22px}.hide-m{display:none}}
/* печать: только отчёт */
@media print{
  @page{size:A4;margin:10mm 10mm}
  body{background:#fff;color:#000;font-size:11px}
  .wrap>*:not(#report){display:none!important}
  #report{display:block!important;zoom:var(--rz,1)}
  .card,.kpi{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .kpi.hero{background:#fff;color:#000}.kpi.hero .l,.kpi.hero .c{color:#444}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td,th{padding:3px 5px}
  a{color:#000;text-decoration:none}
  .rep .card{padding:10px 12px;margin-bottom:8px}
  .rep .hero{padding:12px 16px;margin-bottom:8px}.rep .hero .big{font-size:18px}.rep .hero .sm{font-size:11px}
  .rep .hero .row3>div{padding:6px 10px}.rep .hero .v{font-size:15px}.rep .hero .l{font-size:10px}
  .rep h2{font-size:13px;margin:0 0 4px}.rep .two{gap:8px}
  .rep table{font-size:10.5px}.rep .note{font-size:10px}
}
.rep h1{font-size:22px}.rep h2{margin-top:6px}
.rep .meta{color:var(--ink2);font-weight:600;margin:4px 0 14px}
.rep table{font-size:11.5px}
.sign{margin-top:18px;font-weight:700}

/* шаги портфеля */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.steps button{border:0;background:var(--card);color:var(--ink2);font:inherit;font-weight:700;font-size:13px;padding:9px 13px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
.steps button b{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:var(--soft);color:var(--ink2);text-align:center;font-size:12px;margin-right:6px}
.steps button.on{background:var(--ink);color:var(--card)}.steps button.on b{background:var(--acc);color:#fff}
.steps button.done b{background:var(--up);color:#fff}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:22px;padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.hero .sm{font-size:14px;font-weight:600;opacity:.92;margin-top:6px}
.hero .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.hero .row3>div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.hero .row3 .l{font-size:12px;opacity:.9;font-weight:600}.hero .row3 .v{font-size:20px;font-weight:800;margin-top:2px}
.hero .vs{display:inline-flex;gap:6px;align-items:center;margin-top:10px;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.shield{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.shield .shn{width:74px;height:84px;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;
  background:linear-gradient(160deg,var(--up),#0e9f6e);clip-path:path('M37 0 L74 12 L74 44 C74 66 56 79 37 84 C18 79 0 66 0 44 L0 12 Z')}
.shield.weak .shn{background:linear-gradient(160deg,#f59e0b,#d97706)}
.shield.none .shn{background:linear-gradient(160deg,#94a3b8,#64748b);font-size:22px}
.shield h2{margin:0 0 4px}.shield .sub{margin:0}
.shbars{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.shbars span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.shbars span.ref{background:transparent;border:1px dashed var(--ink3,#94a3b8)}.shbars span.ok{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}.shbars span.no{background:color-mix(in srgb,var(--down) 12%,transparent);color:var(--down)}
@media(max-width:640px){.shield{gap:12px;align-items:start}.shield .shn{width:52px;height:59px;font-size:22px;clip-path:path('M26 0 L52 8 L52 31 C52 46 39 55 26 59 C13 55 0 46 0 31 L0 8 Z')}.shield.none .shn{font-size:15px}}
.termbtns{display:flex;gap:6px;flex-wrap:wrap}
.termbtns button{border:0;background:var(--soft);color:var(--ink2);font:inherit;font-weight:800;font-size:14px;padding:10px 14px;border-radius:11px;cursor:pointer}
.termbtns button.on{background:var(--ink);color:var(--card)}
.maplegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink2);margin:8px 0 4px}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.cv.map{height:320px}@media(max-width:640px){.cv.map{height:260px}}
.quick{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.quick .termbtns button{padding:7px 11px;font-size:13px;background:var(--card);box-shadow:var(--shadow)}
.quick .termbtns button.on{background:var(--ink);color:var(--card)}
.wqty{width:64px}
.fitbox{border-radius:14px;padding:10px 14px;font-weight:700;font-size:13.5px;margin-bottom:12px}
.fitbox.ok{background:rgba(18,183,106,.12)}.fitbox.no{background:rgba(247,144,9,.14)}
.fitbox ul{margin:6px 0 0 18px;padding:0;font-weight:600}
.sumline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 4px 0;font-weight:700}
input[type=range]{width:100%;accent-color:var(--acc)}
.explain{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:12px}
.star{color:#f5b301;font-weight:800}
.sign-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
@media (max-width:760px){.hero .row3{grid-template-columns:repeat(3,1fr);gap:6px}.hero .row3>div{padding:8px 9px}.hero .row3 .l{font-size:10.5px;line-height:1.2}.hero .row3 .v{font-size:15px}.hero{padding:18px 16px}.hero .big{font-size:22px}.hero .vs{font-size:12.5px}.sign-grid{grid-template-columns:1fr 1fr}}
/* состав: добавление и ± доли */
.addbar{background:var(--soft);border-radius:14px;padding:12px;margin-bottom:12px}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chipadd{border:0;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:12.5px;padding:7px 10px;border-radius:10px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.chipadd span{color:var(--ink2);font-weight:600}
.wbox{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.wb{border:0;background:var(--soft);width:26px;height:30px;border-radius:8px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
/* отчёт на одну страницу */
.rep{font-size:12px}.rep .hero{padding:16px 18px}.rep .hero .big{font-size:22px}
.rep table{font-size:11px}.rep td,.rep th{padding:4px 6px}
.rep .card{padding:12px 14px;margin-bottom:10px}
.rep .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="hello"><a href="./">← Дашборд</a></div>
      <h1>Облигации: подбор и портфель</h1>
    </div>
    <div class="top-right">
      <div class="upd" id="upd">загрузка…</div>
      <button class="icon-btn" id="themeBtn" title="Тема">◐</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="app"><div class="card loading">Загружаю котировки Мосбиржи…</div></main>
  <section id="report"></section>
</div>
<script>
(() => {
  'use strict';
  const BM = window.BondMath, BS = window.BondScore;
  const $ = id => document.getElementById(id);
  const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const jget = (k,d) => { try{ return JSON.parse(store.get(k,'')) ?? d; }catch(e){ return d; } };
  const num = v => { const x=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.')); return isFinite(x)?x:null; };   // «0,5» → 0.5
  const nf = (v,d=2) => v==null||!isFinite(v) ? '—' : (v+(v>=0?1e-9:-1e-9)).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
  const pc = (v,d=2) => v==null||!isFinite(v) ? '—' : nf(v*100,d)+'%';
  const sg = (v,d=2,s='%') => v==null||!isFinite(v) ? '—' : (v>0?'+':v<0?'−':'')+nf(Math.abs(v),d)+s;
  const money = v => v==null||!isFinite(v) ? '—' : Math.round(v).toLocaleString('ru-RU')+' ₽';
  // короткое имя эмитента: «ПАО "Газпром нефть"» → «Газпром нефть»
  const emShort = n => { if(!n) return ''; const q=n.match(/[«"„“](.+)[»"”“]/); if(q) return q[1].replace(/[«»"„“”]/g,'').trim();
    return n.replace(/(публичное|непубличное|открытое|закрытое)?\s*(акционерное общество|общество с ограниченной ответственностью)|^(ПАО|АО|ООО|ОАО|ЗАО|НАО)\s+/gi,'').trim() || n; };
  const mshort = v => v==null||!isFinite(v) ? '—' : Math.abs(v)>=1e6 ? nf(v/1e6, Math.abs(v)>=1e9?0:2)+' млн ₽' : Math.abs(v)>=1e4 ? nf(v/1e3,0)+' тыс. ₽' : money(v);
  const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtD = s => s ? s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(2,4) : '—';
  const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const FONT = 'Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  if (window.Chart) Chart.defaults.font.family = FONT;
  const t0 = store.get('theme',''); if(t0) document.documentElement.dataset.theme=t0;
  const ISS = new URLSearchParams(location.search).get('iss') || 'https://iss.moex.com/iss/';

  // ---------------- рейтинги и профили
  const RAT = ['AAA','AA+','AA','AA-','A+','A','A-','BBB+','BBB','BBB-','BB+','BB','BB-','B+','B','B-','CCC','CC','C','D'];
  const rScore = r => r==='ГОС' ? 0 : (RAT.indexOf(r)+1 || 99);
  const rBand = r => r==='ГОС' ? 'ГОС' : (r||'').replace(/[+-]$/,'') || '—';
  const rCls = r => { const s=rScore(r); return s===0?'r0':s<=4?'r1':s<=10?'r2':s<99?'r3':'rn'; };

  let U = [], BYID = {}, META = null, DATA = null, FX = {RUB:1}, SETTLE = null, RF = null;

  const F_DEF = {cur:'RUB', kind:'all', minR:'A-', yMin:'', yMax:'', mMin:'', mMax:'', ctype:'all', liq:'1', q:'', sort:'cs', asc:false, offer:'any', risk:'show', seg:'plain', one:'1'};

  // ---------------- загрузка данных Мосбиржи
  const obj = t => t.data.map(r=>Object.fromEntries(t.columns.map((k,i)=>[k,r[i]])));
  const SCOLS='SECID,BOARDID,SHORTNAME,SECNAME,PREVWAPRICE,PREVPRICE,ACCRUEDINT,COUPONVALUE,COUPONPERCENT,COUPONPERIOD,NEXTCOUPON,LOTSIZE,FACEVALUE,MATDATE,OFFERDATE,PUTOPTIONDATE,CALLOPTIONDATE,BUYBACKDATE,BUYBACKPRICE,FACEUNIT,ISIN,LISTLEVEL,BONDTYPE,BONDSUBTYPE,SETTLEDATE';
  const MCOLS='SECID,OFFER,BID,LAST,WAPRICE,VALTODAY,UPDATETIME,TRADINGSTATUS';
  const YCOLS='SECID,PRICE,EFFECTIVEYIELD,DURATION,YIELDDATE,YIELDDATETYPE,GSPREADBP';
  async function board(b, only='securities,marketdata,marketdata_yields'){
    const u=`${ISS}engines/stock/markets/bonds/boards/${b}/securities.json?iss.meta=off&iss.only=${only}`+
      `&securities.columns=${SCOLS}&marketdata.columns=${MCOLS}&marketdata_yields.columns=${YCOLS}`;
    const j=await fetch(u).then(r=>{ if(!r.ok) throw new Error('ISS '+r.status); return r.json(); });
    const S=obj(j.securities), M=j.marketdata?Object.fromEntries(obj(j.marketdata).map(x=>[x.SECID,x])):{}, Y=j.marketdata_yields?Object.fromEntries(obj(j.marketdata_yields).map(x=>[x.SECID,x])):{};
    return S.map(s=>({s,m:M[s.SECID]||{},y:Y[s.SECID]||{}}));

  const valid = d => d && /^\d{4}-\d\d-\d\d$/.test(d) && !d.startsWith('0000');
  function kindOf(s){
    const t=s.BONDTYPE||'';

    if(/Структур/i.test(t)) return 'struct';
    if(/Конверт/i.test(t)) return 'conv';

  function buildRow(x, fxai, cnyBoard){
    const s=x.s, m=x.m, y=x.y, sec=s.SECID;

    const today = SETTLE || s.SETTLEDATE;
    let off = null;
    if(y.YIELDDATETYPE==='OFFER' && valid(y.YIELDDATE)) off=y.YIELDDATE;
    else for(const d of [s.OFFERDATE,s.PUTOPTIONDATE,s.BUYBACKDATE]) if(valid(d) && d>today && (!off||d<off)) off=d;
    if(off && valid(s.MATDATE) && off>=s.MATDATE) off=null;
    const end = off || (valid(s.MATDATE)?s.MATDATE:null);
    const days = end ? BM.days(today,end) : null, years = days!=null ? days/365 : null;
    let ytm = y.EFFECTIVEYIELD!=null ? y.EFFECTIVEYIELD/100 : null, est=false;
    const face = s.FACEVALUE||1000;
    // НКД валютной бумаги: рублёвый НКД из TQCB / курс ЦБ (на TQOD НКД евробумаг — в долларах, не в евро);
    // запасной вариант — НКД режима в валюте самой бумаги (TQOY — юани, TQOD — доллары)
    const ai = cur==='RUB' ? (s.ACCRUEDINT||0) : (FX[cur] && s.ACCRUEDINT!=null ? s.ACCRUEDINT/FX[cur] : (fxai[sec] && fxai[sec].cur===cur ? fxai[sec].v : null));
    if(kind==='disc' && price && years>0) ytm = Math.pow(100/price, 1/years)-1;
    // биржа считает доходность по цене последней сделки, а купить можно по цене предложения (её и показываем):
    // пересчёт через модифицированную дюрацию, чтобы доходность соответствовала цене покупки
    else if(ytm!=null && kind!=='float' && y.PRICE>0 && price && Math.abs(price-y.PRICE)>1e-9 && y.DURATION>0){
      const D=y.DURATION/365/(1+ytm); ytm -= (price-y.PRICE)/(y.PRICE+(ai>0?ai/face*100:0))/D; }
    let cpn = s.COUPONPERCENT;
    // «фиксированный» купон без ставки, а биржа показывает доходность около нуля — купон ещё не объявлен (по сути плавающий)
    if(kind!=='float' && kind!=='disc' && cpn==null && ytm!=null && ytm<0.01 && price>50 && years>0){
      if(s.COUPONVALUE>0 && s.COUPONPERIOD>0){ const per=s.COUPONPERIOD/365, g=s.COUPONVALUE/face; ytm=Math.pow(1+g/(price/100),1/per)-1+(100/price-1)/Math.max(years,0.25); }
      else ytm = meta[4]>0 ? meta[4]/100 : null;
      est=true; }
    if(kind==='float' && price && years>0){
      let c = cpn;
      if(c==null && s.COUPONVALUE && s.COUPONPERIOD) c = s.COUPONVALUE/face*365/s.COUPONPERIOD*100;
      if(c!=null && c>0){ const per=(s.COUPONPERIOD||91)/365, g=c/100*per;
        ytm = Math.pow(1+g/(price/100), 1/per)-1 + (100/price-1)/Math.max(years,0.25); est=true; }
      else if(ofz && y.EFFECTIVEYIELD>1){ ytm=y.EFFECTIVEYIELD/100; est=true; }      // ОФЗ-ПК: оценка биржи (сверена)
      else if(meta[4]>0){ ytm=meta[4]/100; est=true; }                               // оценка smart-lab
      else ytm=null;
    }

    const freq = per ? Math.max(1, Math.round(365/per)) : (kind==='disc'?0:null);
    const dur = kind==='float' ? Math.min(years||0, (per||91)/365) : (y.DURATION ? y.DURATION/365 : null);
    const tvAvg = meta[2]||0, tvToday = m.VALTODAY||0;

      tv: Math.max(tvAvg, tvToday), tvAvg, tvToday,                  // оборот: средний за 10 дней или сегодняшний, что больше
      price, ai, face, lot:s.LOTSIZE||1, mat:valid(s.MATDATE)?s.MATDATE:null, off, end, days, years, ytm, est, dur,
      call: valid(s.CALLOPTIONDATE)&&s.CALLOPTIONDATE>today ? s.CALLOPTIONDATE : null,
      cpn, cpnVal:s.COUPONVALUE, couponPeriod: per, freq,
      mbs: y.YIELDDATETYPE==='MBS' || /СФО|Секью|Ипотечн|(^|[\s«"])ИА\s/i.test((s.SECNAME||'')+' '+(s.SHORTNAME||'')),

  async function load(){

  // ---------------- подбор
  function passBase(r){ return !['linker','struct','conv'].includes(r.kind) && r.ytm!=null && r.years>0.02 && r.price>0; }
  function screen(){
    const minS = F.minR==='any' ? 999 : rScore(F.minR);

      view=list.filter(r=>best[r.ofz?r.id:r.em]===r); }                 // по одному лучшему выпуску на эмитента

      const k={y:'ytm',dur:'dur',yrs:'days',tv:'tv',r:'rating',price:'price',score:'score',cpn:'cpn',cs:'cs'}[F.sort]||'ytm';

    });
  }
