        <div class="fld"><label>Сегмент</label>${sel('seg',[['plain','без суборд. и СФО'],['all','все']])}</div>
        <div class="fld"><label>Выпуски эмитента</label>${sel('one',[['1','лучший по оценке'],['all','все']])}</div>
        <div class="fld"><label>Метка «риск»</label>${sel('risk',[['show','показывать внизу'],['hide','скрыть']])}</div>
        <div class="fld"><label>&nbsp;</label><button class="btn ghost" data-act="reset">Сбросить</button></div>
      </div></div>
      <div class="card"><h2>Карта рынка</h2><div class="sub">каждая точка — выпуск из списка ниже: срок до погашения/оферты × доходность, цвет — рейтинг. Выше своей «стаи» — платят больше за тот же риск. Нажмите на точку — бумага добавится в портфель (◯ — уже в портфеле)</div>
        <div class="maplegend">${MAPB.map(([k,n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')}</div>
        <div class="cv map"><canvas id="mapChart"></canvas></div></div>
      <div class="card"><div class="sub" style="margin-top:0">найдено ${list.length}${list.length>250?', показаны первые 250':''} · сверху — лучшие по сумме показателей; <span class="tag d">риск</span> — переплата к норме подозрительно большая, такие внизу и в автосборку не попадают</div>
      <div class="tblwrap"><table><thead><tr>${th('name','Выпуск')}${th('cs','Оценка')}${th('r','Рейтинг')}${th('y','Доходн.')}${th('score','Премия, п.п.')}<th class="hide-m" title="доходность после НДФЛ 13%">После НДФЛ</th>${th('cpn','Купон')}${th('price','Цена, %')}${th('dur','Дюр., лет','hide-m')}${th('yrs','Погаш./оферта')}${th('tv','Оборот, млн ₽','hide-m')}<th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="12" class="empty">ничего не найдено — ослабьте фильтры</td></tr>'}</tbody></table></div>
      <div class="note" style="margin-top:10px">Как ранжируется. «Оценка» 0–100 — по сумме показателей среди отобранных бумаг: доходность 35% (флоатеры сравниваются с флоатерами, фикс. купон — с фикс.; доходность флоатера — оценка при неизменной ставке), переплата к норме своего рейтинга 25%, надёжность (рейтинг) 25%, ликвидность 15%; наведите на число — видно, из чего сложилась. «Норма» — типичная доходность бумаг той же валюты, типа купона и сегмента и того же рейтинга с близким сроком. Премия = доходность − норма; сверху — бумаги с переплатой за свой риск (с поправкой на ликвидность). Доходность — к цене предложения (по ней покупаете). Переплата больше 3 п.п. или цена ниже 60% — метка «риск»: рынок видит риск, которого нет в рейтинге. «Оборот» — средний за 10 дней, а пока его нет — сегодняшний. «После НДФЛ» — при 13%: купоны облагаются сразу, дисконт — при погашении; у флоатеров и бумаг с амортизацией — приближённо (≈).</div></div>`;
  }

  // ---------------- портфель: общие расчёты
  const addMonths = (iso, m) => { const d=new Date(iso+'T00:00:00Z'); const day=d.getUTCDate(); d.setUTCMonth(d.getUTCMonth()+m); if(d.getUTCDate()<day) d.setUTCDate(0); return d.toISOString().slice(0,10); };
  const addDays = (iso, n) => BM.iso(BM.toMs(iso)+n*864e5);
  const horizonISO = () => addMonths(SETTLE, P.term);
  const termName = () => (TERMS.find(t=>t[0]===P.term)||[0,P.term+' мес'])[1];
  const dirtyRub = r => (r.price/100*r.face + (r.ai||0)) * (FX[r.cur]||NaN);
  const qtyFor = (r, w, base=P.amount) => { const u=dirtyRub(r)*r.lot; return u>0 ? Math.floor(w/100*base/u)*r.lot : 0; };
  // окно сроков под срок клиента: бумага гасится (или оферта) не раньше 40% срока и не позже конца срока + месяц
  function inWindow(r){ const H=horizonISO(); const lo=addDays(SETTLE, Math.max(30, Math.round(P.term*30.4*0.4))); return r.end && r.end>=lo && r.end<=addDays(H,31); }
  function liqOk(r, need, pp){ if(r.ofz) return true; const v=r.tv; return v>0 && v*pp.liq>=need; }

  // ---------------- автосборка (доли в %)
  let EXCL=new Set();
  function eligible(r, pp, cur){
    if(!passBase(r) || r.cur!==cur || r.mbs || r.sub || r.flag) return false;
    if(EXCL.has(r.id) || EXCL.has('em:'+r.em)) return false;
    if(r.kind==='float' && (r.ofz || !(pp.floaterMax>0))) return false;     // ОФЗ — только с фикс. купоном
    if(rScore(r.rating)>rScore(pp.minRating)) return false;
    if(r.dur==null || r.dur>pp.durMax) return false;
    if(r.price<70 && !r.ofz) return false;
    return inWindow(r);
  }
  function autoBuild(){
    const pp=P.params, A=P.amount, warns=[];
    const curShare = Object.fromEntries(CURS.map(([c])=>[c, Math.max(0,num(P.cur[c])||0)]));
    if(!Object.values(curShare).some(v=>v>0)){ curShare.RUB=100; warns.push('доли валют не указаны — портфель собран в рублях'); }
    const tot = Object.values(curShare).reduce((a,b)=>a+b,0);
    const pos=[], used=new Set(), bandW={}, emW={}; let floatW=0;
    const sc = r => (r.cs ?? 0) + (P.monthly && r.freq>=12 ? 100 : 0);   // сводная оценка; ежемесячные — вперёд, если цель «выплаты»
    for(const [c] of CURS){
      const share = curShare[c]/tot; if(share<=0) continue;
      if(c!=='RUB' && !FX[c]){ warns.push(`нет курса ${c} — валютная часть пропущена`); continue; }
      const pool = BS.composite(U.filter(r=>eligible(r,pp,c)));
      const ofzShare = c==='RUB' ? share*Math.min(100,pp.ofzMin)/100 : 0;
      const pick = (list, w, n, isOfz) => {
        const best={}; for(const r of list){ if(used.has(r.id)) continue; const k=isOfz?r.id:r.em; if(!best[k]||sc(r)>sc(best[k])) best[k]=r; }
        const cand=Object.values(best).sort((a,b)=>sc(b)-sc(a));
        const out=[], per=w/n;
        for(const r of cand){
          if(out.length>=n) break;
          if(pp.liq>0 && !liqOk(r, per*A, pp)) continue;
          const band=rBand(r.rating);
          if(pp.bandCap[band]!=null && ((bandW[band]||0)+per)*100 > pp.bandCap[band]+1e-9) continue;
          if(r.kind==='float' && (floatW+per)*100 > pp.floaterMax+1e-9) continue;
          if(!isOfz && ((emW[r.em]||0)+per)*100 > pp.issuerMax+1e-9) continue;
          out.push(r); used.add(r.id); bandW[band]=(bandW[band]||0)+per; emW[r.em]=(emW[r.em]||0)+per; if(r.kind==='float') floatW+=per;
        }
        return out;
      };
      if(ofzShare>0){
        const ofzPool=pool.filter(r=>r.ofz);
        const n=Math.max(1,Math.min(3,Math.round(ofzShare*A/5e6)||1));
        const got=pick(ofzPool, ofzShare, n, true);
        if(!got.length) warns.push(`не нашлось ОФЗ с фиксированным купоном под срок ${termName()} — доля ОФЗ не вложена`);
        got.forEach(r=>pos.push({id:r.id, w:ofzShare/got.length*100}));
      }
      const corpShare = share-ofzShare;
      if(corpShare>0){
        const corpPool=pool.filter(r=>!r.ofz || c!=='RUB');
        const n=Math.max(c==='RUB'?pp.minIssuers:Math.min(pp.minIssuers,4), Math.ceil(corpShare*100/pp.issuerMax-1e-9));
        const got=pick(corpPool, corpShare, n, false);
        if(!got.length) warns.push(`${c}: нет бумаг под ограничения профиля и срок ${termName()}`);
        else {
          const w=Math.min(corpShare/got.length, pp.issuerMax/100);
          // если нашлось меньше бумаг, чем нужно, доля каждой растёт — снова проверяем лимиты групп рейтинга и флоатеров
          const ws=new Map(got.map(r=>[r, w]));
          const capGroup=(f, cap, prev)=>{ const g=got.filter(f); const sum=g.reduce((a,r)=>a+ws.get(r),0)+prev;
            if(g.length && sum*100>cap+1e-9){ const k=Math.max(0,(cap/100-prev))/(sum-prev); g.forEach(r=>ws.set(r, ws.get(r)*k)); } };
          for(const [b,cap] of Object.entries(pp.bandCap||{})) if(cap!=null) capGroup(r=>rBand(r.rating)===b, cap, (bandW[b]||0)-got.filter(r=>rBand(r.rating)===b).length*(corpShare/n));
          capGroup(r=>r.kind==='float', pp.floaterMax, floatW-got.filter(r=>r.kind==='float').length*(corpShare/n));
          got.forEach(r=>pos.push({id:r.id, w:ws.get(r)*100}));
          const left=corpShare-[...ws.values()].reduce((a,b)=>a+b,0);
          if(left>0.001) warns.push(`${c}: подошло эмитентов — ${got.length} из ${n}, ${nf(left*100,1)}% не распределено (лимиты профиля: до ${pp.issuerMax}% на эмитента${Object.keys(pp.bandCap||{}).length?', по группам рейтинга':''}${pp.floaterMax>0&&pp.floaterMax<100?', по флоатерам':''}). Добавьте бумаги на шаге 2 («Добавить бумагу») или ослабьте ограничения.`);
        }
      }
    }
    pos.forEach(p=>p.w=Math.floor(p.w*10+1e-6)/10);          // вниз до 0,1 п.п. — сумма долей не превышает 100%
    P.pos=pos; P.warns=warns;
  }
  async function autoBuildChecked(){
    EXCL=new Set(); const dropped=[];
    for(let i=0;i<4;i++){
      autoBuild();
      await Promise.all(P.pos.map(p=>bondization(p.id).catch(()=>null)));
      const bad=P.pos.map(p=>[p.id,BZ[p.id]]).filter(([id,b])=>b && (b.def||(!P.qual&&b.qual)));       // техдефолт в истории — не исключаем, только отмечаем
      if(!bad.length) break;
      for(const [id,b] of bad){ const r=BYID[id]; if(b.def) EXCL.add('em:'+r.em); else EXCL.add(id);
        dropped.push(`${r.name} (${b.def?'дефолт':'только для квалов'})`); }
    }
    if(dropped.length) P.warns=[...(P.warns||[]), 'исключены при сборке: '+dropped.join(', ')];
    EXCL=new Set(); savePort();
  }

  // ---------------- точный разбор
  const BZ = {};
  async function bondization(id){
    if(BZ[id]) return BZ[id];
    const j=await fetch(`${ISS}securities/${id}/bondization.json?iss.meta=off&limit=unlimited`).then(r=>r.json());
    const am=obj(j.amortizations);
    const res={coupons:obj(j.coupons).map(c=>({date:c.coupondate,start:c.startdate,value:c.value,pct:c.valueprc})),
      amorts:am.map(a=>({date:a.amortdate,value:a.value})), initialFace:(am[0]||{}).initialfacevalue, offers:obj(j.offers||{columns:[],data:[]})};
    try{ const dj=await fetch(`${ISS}securities/${id}.json?iss.meta=off&iss.only=description`).then(r=>r.json());
      const desc=Object.fromEntries(dj.description.data.map(r=>[r[0],r[2]]));
      res.qual = desc.ISQUALIFIEDINVESTORS==='1'; res.def = desc.HASDEFAULT==='1'; res.tdef = desc.HASTECHNICALDEFAULT==='1'; }catch(e){}
    return BZ[id]=res;
  }
  // ставка для неизвестных будущих купонов: известная ставка, иначе — по НКД текущего купона (новые флоатеры), иначе — оценка smart-lab
  function estCpn(r, bz){
    if(r.cpn!=null && r.cpn>0) return r.cpn;
    const cur=(bz.coupons||[]).find(c=>c.start && c.start<SETTLE && c.date>=SETTLE);
    if(cur && r.ai>0){ const d=BM.days(cur.start, SETTLE); if(d>=7) return r.ai/r.face*365/d*100; }
    return r.slY || null;
  }
  const bondObj = (r, bz) => ({face:r.face, initialFace:bz.initialFace||r.face, couponPct:estCpn(r,bz), matdate:r.mat, offerdate:r.off, offerPrice:100, coupons:bz.coupons, amorts:bz.amorts});
  async function makeRows(list, base, lev){
    const items = list.map(p=>({p, r:BYID[p.id]})).filter(x=>x.r && x.p.w>0);
    await Promise.all(items.map(async x=>{ x.bz = await bondization(x.r.id); }));
    const rows=[], positions=[];
    for(const {p,r,bz} of items){
      const qty = qtyFor(r, p.w, base);
      let b = bondObj(r,bz), a = BM.analyze(b, SETTLE, r.price, r.ai);
      // колл-опцион эмитента при цене выше номинала: считаем к худшей дате (доходность к колл-опциону, если она ниже)
      if(r.call && r.price>100 && a.ytm!=null){ const b2={...b, offerdate:r.call}, a2=BM.analyze(b2, SETTLE, r.price, r.ai);
        if(a2.ytm!=null && a2.ytm<a.ytm){ b=b2; a={...a2, toCall:true}; } }
      const fx = FX[r.cur]||NaN;
      const cost = (r.price/100*r.face + (a.accrued??r.ai??0))*qty*fx;
      rows.push({p,r,bz,a,fx,qty,cost});
      if(a.ytm!=null && qty>0) positions.push({id:r.id, qty, bond:b, flows:a.flows, clean:r.price, accrued:a.accrued, fx, ytm:a.ytm, floater:r.kind==='float', lev:!!lev});
    }
    // в расчёт идут только бумаги с рассчитанной доходностью; остальные показываются с пометкой «нет данных»
    const total = rows.filter(x=>x.a.ytm!=null && x.qty>0).reduce((s,x)=>s+x.cost,0);
    return {rows, positions, total, skipped: rows.filter(x=>x.a.ytm==null).map(x=>x.r.name)};
  }

  // ---------------- соответствие профилю
  function profileCheck(rows, total0, pp, riskOnly){
    const v=[]; if(!total0) return v;
    const total=Math.max(total0, P.amount);            // доли — от суммы клиента
    const share=f=>rows.filter(f).reduce((s,x)=>s+x.cost,0)/total*100;
    const ofz=share(x=>x.r.ofz && x.r.cur==='RUB');
    const rubShare=share(x=>x.r.cur==='RUB');
    if(pp.ofzMin>0 && ofz+0.5 < pp.ofzMin*rubShare/100) v.push(`ОФЗ ${nf(ofz,0)}% — нужно от ${nf(pp.ofzMin*rubShare/100,0)}%`);
    const low=rows.filter(x=>!x.r.ofz && rScore(x.r.rating)>rScore(pp.minRating));
    if(low.length) v.push(`рейтинг ниже ${pp.minRating}: ${low.map(x=>x.r.name).join(', ')}`);
    const em={}; rows.forEach(x=>{ if(!x.r.ofz) em[x.r.emName||x.r.em]=(em[x.r.emName||x.r.em]||0)+x.cost/total*100; });
    if(!riskOnly) for(const [k,s] of Object.entries(em)) if(s>pp.issuerMax+0.5) v.push(`${k}: ${nf(s,1)}% — больше ${pp.issuerMax}% на эмитента`);
    const fl=share(x=>x.r.kind==='float'); if(fl>pp.floaterMax+0.5) v.push(`флоатеры ${nf(fl,0)}% — лимит ${pp.floaterMax}%`);
    const long=rows.filter(x=>x.r.kind!=='float' && (x.a.macaulay||0)>pp.durMax+0.05);
    if(long.length) v.push(`дюрация больше ${pp.durMax} лет: ${long.map(x=>x.r.name).join(', ')}`);
    for(const [b,cap] of Object.entries(pp.bandCap||{})){ const s=share(x=>rBand(x.r.rating)===b); if(cap!=null && s>cap+0.5) v.push(`группа ${b} ${nf(s,0)}% — лимит ${cap}%`); }
    const nIss=Object.keys(em).length; const corpW=share(x=>!x.r.ofz);
    if(!riskOnly && corpW>0 && nIss<Math.min(pp.minIssuers, Math.ceil(corpW/pp.issuerMax))) v.push(`эмитентов ${nIss} — для профиля нужно от ${Math.min(pp.minIssuers, Math.ceil(corpW/pp.issuerMax))}`);
    return v;
  }
  // уровень риска портфеля: самый консервативный профиль, чьи требования к надёжности выполнены (ОФЗ, рейтинг, флоатеры, дюрация);
  // диверсификация (доля на эмитента, число эмитентов) проверяется отдельно и показывается списком
  function fitProfile(rows, total){
    for(const k of ['cons','mod','inc','agg']) if(!profileCheck(rows,total,PROFILES[k],true).length) return k;
    return null;
  }

  // ---------------- сравнение
  const lastS = k => { const s=DATA&&DATA.series&&DATA.series[k]; return s&&s.data.length ? s.data[s.data.length-1][1] : null; };
  function maxKeyOn1st(y){
    const s=DATA&&DATA.series&&DATA.series.KEY; if(!s) return null; let mx=null;
    for(let m=1;m<=12;m++){ const iso=`${y}-${String(m).padStart(2,'0')}-01`; let v=null; for(const [d,x] of s.data){ if(d<=iso) v=x; else break; }
      if(iso>s.data[s.data.length-1][0]) break; if(v!=null) mx=Math.max(mx??v,v); }
    return mx;
  }
  function curveAt(years){
    const c=DATA&&DATA.curves&&DATA.curves['сегодня']; if(!c) return lastS('RGBI_Y');
    const p=c.points.slice().sort((a,b)=>a[0]-b[0]);
    if(years<=p[0][0]) return p[0][1]; if(years>=p[p.length-1][0]) return p[p.length-1][1];
    for(let i=1;i<p.length;i++) if(years<=p[i][0]){ const [x0,y0]=p[i-1],[x1,y1]=p[i]; return y0+(y1-y0)*(years-x0)/(x1-x0); }
  }
  // ---------------- займ в юанях: RUSFAR CNY + надбавка по объёму счёта; лимит = 80% ОФЗ и валютных облигаций (дисконт 20%)
  const carrySpread = () => P.amount>=800e6 ? 2 : P.amount>=200e6 ? 3 : 4;
  const carryTier = () => P.amount>=800e6 ? 'счёт от 800 млн' : P.amount>=200e6 ? 'счёт 200–800 млн' : 'счёт до 200 млн';
  const loanRateSimple = () => RF ? RF.v + carrySpread() : null;
  const effOf = x => Math.pow(1+x/100/365,365)-1;
  function collateralRub(){ return P.pos.reduce((s,p)=>{ const r=BYID[p.id]; return r && (r.ofz||r.cur!=='RUB') ? s+dirtyRub(r)*qtyFor(r,p.w) : s; },0); }
  const loanLimit = () => 0.8*collateralRub();
  const loanAmount = () => loanLimit()*Math.min(100,Math.max(0,P.carry.ltv))/100;
  const cnyPool = () => U.filter(r=>r.cur==='CNY' && passBase(r) && !r.mbs).sort((a,b)=>(b.cnyBoard-a.cnyBoard)||((b.score??-99)-(a.score??-99)));
  async function carryBuild(){
    const pp=P.params, L=loanAmount(), warns=[], excl=new Set(), dropped=[];
    P.carry.pos=[];
    if(!(L>0)){ P.carry.warns=['в портфеле нет ОФЗ и валютных облигаций — займ взять не под что']; savePort(); return; }
    const lrEff = loanRateSimple()!=null ? effOf(loanRateSimple()) : 0;
    for(let it=0; it<4; it++){
      const pool=cnyPool().filter(r=>!r.sub && !r.flag && r.kind!=='float' && !excl.has(r.id) && !excl.has('em:'+r.em)
        && rScore(r.rating)<=rScore(pp.minRating) && r.dur!=null && r.price>=70 && inWindow(r) && r.ytm>lrEff);
      BS.composite(pool);
      const sc=r=>(r.cnyBoard?100:0)+(r.cs??0);      // сначала — с режимом торгов за юани, дальше по сводной оценке
      const best={}; for(const r of pool){ const k=r.ofz?r.id:r.em; if(!best[k]||sc(r)>sc(best[k])) best[k]=r; }
      const cand=Object.values(best).sort((a,b)=>sc(b)-sc(a));
      const n=Math.min(cand.length, Math.max(3, Math.ceil(L/((pp.issuerMax/100)*(P.amount+L))-1e-9)));
      P.carry.pos=cand.slice(0,n).map(r=>({id:r.id, w:Math.floor(1000/n)/10}));
      await Promise.all(P.carry.pos.map(p=>bondization(p.id).catch(()=>null)));
      const bad=P.carry.pos.filter(p=>{ const b=BZ[p.id]; return b && (b.def||(P.qual===false&&b.qual)); });
      if(!bad.length) break;
      for(const p of bad){ const b=BZ[p.id], r=BYID[p.id]; if(b.def) excl.add('em:'+r.em); else excl.add(p.id); dropped.push(r.name); }
    }
    if(!P.carry.pos.length) warns.push(`не нашлось юаневых облигаций под срок ${termName()} с доходностью выше ставки займа — добавьте вручную`);
    if(dropped.length) warns.push('исключены: '+dropped.join(', '));
    P.carry.warns=warns; savePort();
  }

  // ---------------- полный расчёт
  async function analyze(){
    if(!P.pos.length){ ANALYSIS=null; return; }
    const H=horizonISO(), settle=SETTLE;
    const {rows, positions, total, skipped} = await makeRows(P.pos, P.amount, false);
    if(!positions.length){ ANALYSIS={empty:true, rows, total}; return; }
    const py = BM.portfolioYield(positions, settle);
    const reinv = py ? Math.max(0, py.ytm) : 0.15;              // реинвестиция не ниже 0%
    const acc = P.account==='iis3'?'iis3':'std';
    // цель «ежемесячные выплаты»: купоны выводятся клиенту, погашения реинвестируются под доходность портфеля
    const opt = extra => Object.assign({settle, horizon:H, reinvest:reinv, withdraw:!!P.monthly, reform:P.reform}, extra||{});
    const main = BM.simulate(positions, opt({account:acc}));
    // ежемесячно на руки (если купоны выводятся): купоны за первые 12 мес. (или срок), после НДФЛ
    const mN=Math.min(12,P.term), cut=addMonths(settle,mN);
    const cps=main.calendar.filter(c=>c.date<=cut).reduce((s,c)=>s+c.coupon,0);
    const nkd=positions.reduce((s,p)=>s+p.accrued*p.qty*p.fx,0);
    const monthly=(acc==='std'? (cps-0.13*Math.max(0,cps-nkd)) : cps)/mN;
    // вклад: ставка топ-10 без капитализации, проценты раз в год, переоформление по ставке, которую закладывает кривая ОФЗ
    const depRate = (P.depRate!=null ? P.depRate : (lastS('DEP')||12))/100;
    const curve = DATA&&DATA.curves&&DATA.curves['сегодня'] ? DATA.curves['сегодня'].points : null;
    const depPath = BM.depositPath(depRate, curve, P.term/12);
    const nowY = new Date(BM.toMs(settle)).getUTCFullYear(), keyNow = lastS('KEY')||0;
    const exempt = y => { const ky = P.reform && y>=BM.REFORM_YEAR ? y-1 : y; const k=(ky<=nowY?maxKeyOn1st(ky):null) ?? keyNow; return k/100*1e6; };
    const depR = BM.depositNet(total, {settle, horizon:H, rates:depPath, payout:P.monthly?'monthly':'end', reform:P.reform, exempt});
    const dep = depR.profit;
    const ofzY = (curve && BM.parYield(curve, P.term/12, 2)) || (curveAt(P.term/12)||13)/100;   // ОФЗ по номиналу на срок клиента
    const ofzR = BM.parBondNet(total, ofzY, 2, settle, H, acc, !P.monthly, P.reform), ofz = ofzR.profit;
    // запас прочности: сколько крупнейших корпоративных эмитентов могут не заплатить (возврат 25% вложенного, без процентов),
    // чтобы портфель всё ещё обгонял вклад. Отказ — сразу после покупки (худший случай), убыток налог не уменьшает.
    const REC=0.25, credit=rows.filter(x=>!x.r.ofz && x.a.ytm!=null && x.qty>0);
    const emCost={}; credit.forEach(x=>{ const k=x.r.em; emCost[k]=(emCost[k]||{cost:0,ids:[],name:x.r.emName||x.r.name}); emCost[k].cost+=x.cost; emCost[k].ids.push(x.r.id); });
    const ems=Object.values(emCost).sort((a,b)=>b.cost-a.cost);
    const stressRun=k=>{ const drop=new Set(ems.slice(0,k).flatMap(e=>e.ids)); const rest=positions.filter(p=>!drop.has(p.id));
      const lost=ems.slice(0,k).reduce((s,e)=>s+e.cost,0); const fin=rest.length?BM.simulate(rest, opt({account:acc})).final:0; return fin+REC*lost-total; };
    const stress={rec:REC, n:ems.length, ems:ems.slice(0,3).map(e=>({name:e.name, share:e.cost/total})), runs:[]};
    for(let k=1;k<=Math.min(ems.length,20);k++){ const pr=stressRun(k); stress.runs.push({k, profit:pr}); if(pr<0) break; }
    stress.safe=stress.runs.filter(x=>x.profit>=dep).length;       // сколько дефолтов выдерживает, обгоняя вклад
    stress.plus=stress.runs.filter(x=>x.profit>=0).length;         // … оставаясь в плюсе (больше вложенного)
    const shifts=[-0.02,-0.01,0.01,0.02].map(dy=>{
      let v0=0, v1=0;
      for(const ps of positions){ const w=ps.qty*ps.fx, P0=BM.pv(ps.flows, ps.ytm)*w;
        const P1 = ps.floater ? P0*Math.pow((1+ps.ytm)/(1+ps.ytm+dy), (ps.flows.find(f=>f.kind==='c')||{t:0.25}).t) : BM.pv(ps.flows, ps.ytm+dy)*w;
        v0+=P0; v1+=P1; }
      return {dy, nowRub:v1-v0, now:v1/v0-1, end:BM.simulate(positions, opt({account:acc, shift:dy}))};
    });
    let mac=0, mod=0;
    for(const x of rows){ if(x.a.ytm==null||!x.cost) continue; const w=x.cost/total;
      if(x.r.kind==='float'){ const nx=x.a.flows.find(f=>f.kind==='c'); const t=nx?nx.t:0.25; mac+=w*t; mod+=w*t/(1+x.a.ytm); }
      else { mac+=w*x.a.macaulay; mod+=w*x.a.modified; } }
    const by = f => { const o={}; rows.forEach(x=>{ const k=f(x); o[k]=(o[k]||0)+x.cost; }); return o; };
    const struct = { cur: by(x=>x.r.cur), band: by(x=>rBand(x.r.rating)), kind: by(x=>x.r.ofz?'ОФЗ':(x.r.kind==='float'?'Флоатеры':'Корп. фикс.')) };
    const avgR = rows.reduce((s,x)=>s+x.cost*Math.min(20,rScore(x.r.rating)),0)/(total||1);
    // займ в юанях
    let carry=null;
    if(P.carry.on && P.carry.pos.length && FX.CNY){
      const L=loanAmount();
      const c = await makeRows(P.carry.pos, L, true);
      const lr=loanRateSimple();
      carry={...c, L, lr, eff: lr!=null?effOf(lr):null, spread:carrySpread(), limit:loanLimit(), collateral:collateralRub(), py:BM.portfolioYield(c.positions, settle)};
      if(carry.eff!=null && c.positions.length){
        const simL=extra=>BM.simulate([...positions,...c.positions], opt(Object.assign({account:acc, loanRate:carry.eff}, extra)));
        carry.res=simL(); carry.scen=[0.01,0.02,0.03].map(d=>({d, res:simL({loanShift:d})}));
        const gap=x=>simL({loanRate:effOf(x)}).annual - main.annual; let lo=0, hi=60;
        if(gap(lo)<=0) carry.be=null; else if(gap(hi)>0) carry.be=hi; else { for(let i=0;i<50;i++){ const m=(lo+hi)/2; if(gap(m)>0) lo=m; else hi=m; } carry.be=(lo+hi)/2; }
      }
    }
    ANALYSIS = {rows, positions, total, skipped, py, main, monthly, dep, depR, depPath, depRate, ofz, ofzR, ofzY, shifts, stress, mac, mod, struct, avgR, settle, H, carry,
                left: 100 - P.pos.reduce((s,p)=>s+(p.w||0),0), cash: P.amount-total};
  }

  // ---------------- разметка портфеля
  const STEPS=[[1,'Клиент'],[2,'Состав'],[3,'Результат'],[4,'Займ в юанях'],[5,'Отчёт']];
  function stepsHtml(){ return `<div class="steps">${STEPS.map(([n,t])=>`<button data-step="${n}" class="${P.step===n?'on':''}"><b>${n}</b>${t}</button>`).join('')}</div>`; }
  const nextBar = (back, next, nextLabel) => `<div class="nextbar">${back?`<button class="btn ghost" data-step="${back}">← Назад</button>`:'<span></span>'}${next?`<button class="btn acc" data-step="${next}">${nextLabel||'Далее →'}</button>`:''}</div>`;

  function step1(){
    const pp=P.params;
    const fld=(k,n)=>`<div class="fld"><label>${n}</label><input data-pp="${k}" value="${esc(pp[k])}" inputmode="decimal"></div>`;
    const curSum = c => { const v=P.amount*(num(P.cur[c])||0)/Object.values(P.cur).reduce((a,b)=>a+(num(b)||0),0); return c==='RUB'||!FX[c] ? mshort(v) : `${mshort(v)} ≈ ${CUR_SIGN[c]}${nf(v/FX[c]/1e6,2)} млн`; };
    return `<div class="card"><h2>Клиент</h2><div class="sub">сумма, срок и профиль риска — по ним собирается портфель</div>
      <div class="filters p1">
        <div class="fld big"><label>Сумма, ₽</label><input id="p_amount" value="${Math.round(P.amount).toLocaleString('ru-RU')}" inputmode="numeric"></div>
        <div class="fld"><label>Срок вложения</label><div class="termbtns">${TERMS.map(([m,n])=>`<button data-term="${m}" class="${P.term===m?'on':''}">${n}</button>`).join('')}</div></div>
        <div class="fld"><label>Счёт</label><select id="p_account"><option value="std" ${P.account==='std'?'selected':''}>Брокерский</option><option value="iis3" ${P.account==='iis3'?'selected':''}>ИИС-3</option></select></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:700;font-size:14px"><input type="checkbox" id="p_monthly" ${P.monthly?'checked':''}> Клиенту важны ежемесячные выплаты — купоны выводятся, считаю «≈ сколько в месяц на руки»</label>
      <div style="margin-top:14px" class="prof">${Object.entries(PROFILES).map(([k,v])=>`<button data-prof="${k}" class="${P.profile===k?'on':''}"><b>${v.name}</b><span>${v.d}</span></button>`).join('')}</div>
      <details class="params"><summary>Ограничения профиля (можно изменить)</summary>
        <div class="pgrid">
          ${fld('ofzMin','ОФЗ не меньше, %')}
          <div class="fld"><label>Рейтинг не ниже</label><select data-pp="minRating">${RAT.slice(0,13).map(r=>`<option ${pp.minRating===r?'selected':''}>${r}</option>`).join('')}</select></div>
          ${fld('issuerMax','На эмитента до, %')}${fld('durMax','Дюрация бумаги до, лет')}${fld('floaterMax','Флоатеры до, %')}
          ${fld('minIssuers','Эмитентов не меньше')}${fld('liq','Позиция ≤ дневного оборота ×')}
          <div class="fld"><label>Лимит группы A, %</label><input data-band="A" value="${pp.bandCap.A??''}" placeholder="нет"></div>
          <div class="fld"><label>Лимит группы BBB, %</label><input data-band="BBB" value="${pp.bandCap.BBB??''}" placeholder="нет"></div>
          <div class="fld"><label>Лимит группы BB, %</label><input data-band="BB" value="${pp.bandCap.BB??''}" placeholder="нет"></div>
        </div></details>
      <div style="margin-top:16px"><div class="fld"><label>Валюты — какую часть суммы вложить в облигации в этой валюте, %. Покупка за рубли по курсу ЦБ; курс в расчёте неизменный.</label></div>
        <div class="cur">${CURS.map(([c,n])=>`<div class="fld"><label>${n}${c!=='RUB'&&FX[c]?` · курс ${nf(FX[c],2)}`:''}</label><input data-cur="${c}" value="${P.cur[c]||0}" inputmode="decimal"><div class="note" style="margin-top:4px">${(num(P.cur[c])||0)>0?curSum(c):''}</div></div>`).join('')}</div></div>
      <details class="params"><summary>Доп. настройки</summary>
        <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:600;color:var(--ink2);font-size:13px"><input type="checkbox" id="p_reform" ${P.reform?'checked':''}> доход с 2027 года — по налоговой реформе 13–22% (законопроект № 617-9)</label>
        <label style="display:flex;gap:8px;align-items:center;margin-top:6px;font-weight:600;color:var(--ink2);font-size:13px"><input type="checkbox" id="p_qual" ${P.qual!==false?'checked':''}> клиент — квалифицированный инвестор</label>
      </details>
      <div class="row-actions" style="margin-top:16px"><button class="btn acc" data-act="build">Собрать портфель →</button>
        <select id="p_load" class="btn ghost" style="font-weight:700"><option value="">Открыть сохранённый…</option>${Object.keys(jget('b_saved2',{})).map(n=>`<option>${esc(n)}</option>`).join('')}</select></div></div>`;
  }

  // подсказки для добавления: пусто — лучшие по сводной оценке под профиль, валюты и срок клиента; иначе — поиск по всем бумагам
  function suggestions(q){
    const pp=P.params, curs=CURS.map(c=>c[0]).filter(c=>(num(P.cur[c])||0)>0);
    let list;
    if(q){ q=q.toLowerCase(); list=U.filter(r=>passBase(r) && (r.name+' '+r.id+' '+r.isin+' '+(r.emName||'')).toLowerCase().includes(q)); }
    else list=U.filter(r=>passBase(r) && curs.includes(r.cur) && !r.flag && !r.sub && !r.mbs && inWindow(r)
      && (r.ofz ? r.kind!=='float' : rScore(r.rating)<=rScore(pp.minRating)) && (r.kind!=='float' || pp.floaterMax>0) && liqOk(r, P.amount*0.05, pp));
    list=list.filter(r=>!inPort(r.id)); BS.composite(list);
    return list.sort((a,b)=>(b.cs-a.cs)).slice(0,8);
  }
  const suggHtml = q => suggestions(q).map(r=>`<button class="chipadd" data-addq="${r.id}">+ ${esc(r.name)} <span>${esc(r.rating||'н/р')} · ${pc(r.ytm,1)} · до ${fmtD(r.end)}${r.flag?' · риск':''} · оценка ${r.cs}</span></button>`).join('') || '<span class="muted">ничего не найдено</span>';
  function addToPort(id){
    if(inPort(id)) return;
    // доля новой бумаги — как у средней позиции (не больше лимита на эмитента); если места нет, остальные уменьшаются пропорционально
    const sum=P.pos.reduce((s,p)=>s+(p.w||0),0), left=100-sum;
    const avg=P.pos.length ? sum/P.pos.length : 10;
    const w=Math.round(Math.max(1, Math.min(P.params.issuerMax||10, avg))*10)/10;
    if(left < w-0.05 && sum>0){ const k=Math.max(0,100-w)/sum; P.pos.forEach(p=>p.w=Math.floor(p.w*k*10+1e-6)/10); }
    P.pos.push({id, w}); savePort();
  }

  function step2(){
    const A=ANALYSIS; let h='';
    if(P.warns&&P.warns.length) h+=`<ul class="warns">${P.warns.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`;
    if(!P.pos.length) return h+`<div class="card empty">Портфель пуст. Нажмите «Собрать портфель» на шаге 1 или добавьте бумаги в «Подборе».</div>`+nextBar(1,null);
    if(!A) return h+`<div class="card loading" id="anl">Считаю доходности по графикам выплат…</div>`;
    if(A.skipped&&A.skipped.length) h+=`<ul class="warns"><li class="bad">Нет графика выплат — бумага не участвует в расчёте: ${esc(A.skipped.join(', '))}. Замените её.</li></ul>`;
    const viol=profileCheck(A.rows,A.total,P.params), fit=fitProfile(A.rows,A.total);
    const chosen=PROFILES[P.profile]?PROFILES[P.profile].name:'свой';
    h+=`<div class="fitbox ${viol.length?'no':'ok'}">${fit?`По надёжности бумаг портфель — «${PROFILES[fit].name}»`:'По надёжности бумаг портфель рискованнее профиля «Агрессивный»'}${viol.length?` · для «${chosen}» не выполнено:<ul>${viol.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:` · выбран «${chosen}» — всё в рамках`}</div>`;
    const flags=x=>[x.r.cnyBoard?'<span class="star" title="есть режим торгов за юани">★</span>':'', x.r.flag?'<span class="tag d">риск</span>':'', x.r.sub?'<span class="tag w">суборд.</span>':'', x.bz.qual?'<span class="tag w">квал</span>':'', x.bz.def?'<span class="tag d">дефолт</span>':x.bz.tdef?'<span class="tag w" title="Мосбиржа отмечает, что у эмитента был технический дефолт (задержка выплаты, затем исполнена). Это не текущий дефолт — проверьте новости эмитента">техдефолт в истории</span>':'', x.a.est?'<span class="tag w" title="часть купонов неизвестна — по последней ставке">~</span>':''].join('');
    h+=`<div class="card"><h2>Состав</h2><div class="sub">доли — в % от суммы клиента ${mshort(P.amount)}; количество считается само (целые лоты); − / + меняют долю на 1 п.п.</div>
      <div class="addbar"><div class="fld"><label>Добавить бумагу — лучшие по оценке под профиль, валюты и срок, или найдите любую. Если места нет, остальные доли уменьшатся пропорционально</label><input id="add_q" placeholder="название, ISIN или эмитент"></div><div class="chips2" id="sugg">${suggHtml('')}</div></div>
      <div class="tblwrap"><table><thead><tr><th>Выпуск</th><th>Рейтинг</th><th>Доходн.</th><th>Купон</th><th>Погаш./оф.</th><th>Доля, %</th><th class="hide-m">Кол-во</th><th>Сумма</th><th></th></tr></thead><tbody>${A.rows.map(x=>`<tr>
        <td class="nm">${esc(x.r.name)} ${flags(x)}<small>${esc(x.r.isin)} · ${x.r.ofz?'ОФЗ':esc((x.r.emName||'').slice(0,38))}${x.r.cur!=='RUB'?' · '+x.r.cur:''}</small></td>
        <td>${rTag(x.r.rating)}</td><td class="num">${x.a.ytm!=null?pc(x.a.ytm):'<span class="down">нет данных</span>'}</td>
        <td class="num">${x.r.cpn!=null?nf(x.r.cpn,2)+'%':x.r.kind==='float'?'плав.':'—'}<small class="muted" style="display:block;font-size:11px">${freqName(x.r.freq)}</small></td>
        <td class="num">${fmtD(x.a.end||x.r.end)}${x.a.toCall?' <span class="tag" title="цена выше номинала, у эмитента колл-опцион — доходность к дате колл">колл</span>':x.a.toOffer?' <span class="tag">оф.</span>':''}</td>
        <td><div class="wbox"><button class="wb" data-wd="${x.r.id}" data-d="-1">−</button><input class="qty wqty" data-w="${x.r.id}" value="${nf(x.p.w,1)}" inputmode="decimal"><button class="wb" data-wd="${x.r.id}" data-d="1">+</button></div></td>
        <td class="num hide-m">${x.qty?x.qty.toLocaleString('ru-RU'):'<span class="tag w" title="на эту долю не хватает даже на один лот — увеличьте долю">меньше лота</span>'}</td><td class="num">${mshort(x.cost)}</td>
        <td><button class="del" data-del="${x.r.id}" title="убрать">✕</button></td></tr>`).join('')}</tbody></table></div>
      <div class="sumline"><span>Распределено ${nf(100-A.left,1)}% · вложено ${mshort(A.total)}${A.cash>1?` · свободно ${mshort(A.cash)}`:''}</span>
        ${A.left>=0.5?`<button class="btn ghost" data-act="spread">Распределить остаток ${nf(A.left,1)}% поровну</button>`:A.left<-0.05?`<span class="down">перебор ${nf(-A.left,1)}% — уменьшите доли</span>`:''}</div>
      <div class="row-actions" style="margin-top:12px"><button class="btn ghost" data-tab="screen">+ Добавить из подбора</button><button class="btn ghost" data-act="equal">Уравнять доли</button><button class="btn ghost" data-act="save">Сохранить как…</button><button class="btn ghost" data-act="clear">Очистить</button></div></div>`;
    return h+nextBar(1,3);
  }

  function heroHtml(A, compact){
    const R=A.main, T=A.total, fin=T+R.profit;
    const line = P.monthly
      ? `Вложили ${mshort(T)} → ≈ ${mshort(A.monthly)} в месяц на руки, через ${termName()} вернётся ≈ ${mshort(fin-(R.paidOut||0))}`
      : `Вложили ${mshort(T)} → через ${termName()} получите ${mshort(fin)}`;
    const vs=R.profit-A.dep;
    const chip=`<div class="vs">${vs>=0?'▲ на '+mshort(vs)+' больше, чем во вкладе':'▼ на '+mshort(-vs)+' меньше, чем во вкладе'}</div>`;
    return `<div class="hero"><div class="big">${line}</div>${chip}<div class="sm">после НДФЛ${P.account==='iis3'?(R.iisTax>0?` (ИИС-3: без налога до 30 млн ₽ дохода, с превышения — ${mshort(R.iisTax)})`:' (ИИС-3 — без налога при соблюдении срока, до 30 млн ₽ дохода)'):''} · до ${fmtD(A.H)} · ${P.reform?'с учётом налоговой реформы 2027':'по действующим ставкам НДФЛ'}</div>
      <div class="row3"><div><div class="l">Доход после налога</div><div class="v">${mshort(R.profit)}</div></div>
      <div><div class="l">Годовых после налога${P.monthly?" (простых)":""}</div><div class="v">${pc(R.annual)}</div></div>
      <div><div class="l">${P.monthly?'В месяц на руки':'Доходность до налога'}</div><div class="v">${P.monthly?mshort(A.monthly):pc(A.py&&A.py.ytm)}</div></div></div></div>`;
  }
  function compareHtml(A, compact){
    const T=A.total, yrs=A.main.years, ann=p=>P.monthly ? p/T/yrs : Math.pow(1+p/T,1/yrs)-1;   // при выводе купонов — простая годовая у всех вариантов
    const rows=[[P.account==='iis3'?'Портфель на ИИС-3':'Портфель облигаций', A.main.profit, true],
      [compact ? `Вклад ${nf(A.depRate*100,2)}%${P.monthly?', проценты ежемесячно':''}` : `Вклад (${nf(A.depRate*100,2)}% на год${P.monthly?', проценты ежемесячно':', проценты раз в год'}${A.depPath.length>1?'; дальше переоформление'+(A.depPath.slice(1).some(r=>r<A.depRate-1e-6)?' по ставке, которую ждёт рынок: '+A.depPath.slice(1).map(r=>nf(r*100,1)+'%').join(', '):' по той же ставке'):''})`, A.dep],
      [`ОФЗ на ${termName()} (кривая ${nf(A.ofzY*100,2)}%)`, A.ofz]];
    const best=Math.max(...rows.map(r=>r[1]));
    return `<div class="card"><h2>Сравнение на ${termName()}</h2><div class="sub">на руки после НДФЛ, сумма ${mshort(T)}</div>
      <div class="tblwrap"><table><thead><tr><th>Вариант</th><th>Получите</th><th>Доход</th><th>Годовых${P.monthly?' (простых)':''}</th></tr></thead><tbody>${rows.map(([n,p,me])=>
        `<tr><td class="nm">${me?'<b>'+n+'</b>':n}${p===best?' 🏆':''}</td><td class="num">${mshort(T+p)}</td><td class="num">${mshort(p)}</td><td class="num">${pc(ann(p))}</td></tr>`).join('')}</tbody></table></div>
      ${compact?'':(()=>{ const fx=Object.entries(A.struct.cur).filter(([c])=>c!=='RUB').reduce((a,[,v])=>a+v,0)/T; return fx>0.005 ? `<div class="note" style="margin-top:8px">Валютные облигации (${nf(fx*100,0)}% портфеля) приносят меньше рублёвых — это плата за защиту от ослабления рубля. В сравнении курс неизменный; если рубль ослабнет, валютная часть заработает больше.</div>` : ''; })()}
      ${compact?'':`<div class="fld" style="margin-top:10px;max-width:280px"><label>Ставка вклада, % (по умолчанию — макс. топ-10 банков ЦБ)</label><input id="p_dep" value="${P.depRate!=null?nf(P.depRate,2):''}" placeholder="${nf(lastS('DEP')||12,2)}" inputmode="decimal"></div>`}</div>`;
  }
  // «Запас прочности»: сколько крупнейших эмитентов могут не заплатить, а портфель всё равно обгонит вклад
  function shieldHtml(A, compact){
    const S=A.stress; if(!S) return '';
    const pct=nf(S.rec*100,0), dfl=k=>k===1?'дефолт':k%10>=2&&k%10<=4&&(k<10||k>20)?'дефолта':'дефолтов';
    if(!S.n) return `<div class="card shield"><div class="shn">ОФЗ</div><div><h2>Запас прочности</h2><div class="sub">Портфель из ОФЗ — риска неплатежа эмитентов нет. Остаётся только риск изменения ставок (см. «Если ставки изменятся»).</div></div></div>`;
    const all=S.plus>=S.n, cls=all||S.plus>=3?'':S.plus>=1?'weak':'none';
    const big=all?'все':S.plus;
    const head=all
      ? `Портфель останется в плюсе, даже если не заплатят все ${S.n} корпоративных эмитентов и вернётся лишь ${pct}% денег — опора на ОФЗ.`
      : S.plus===0
      ? `Если крупнейший эмитент (${esc(emShort(S.ems[0].name))}, ${nf(S.ems[0].share*100,0)}%) не заплатит, портфель уйдёт в минус — слишком большая доля на одного эмитента.`
      : `Портфель останется в плюсе, даже если ${S.plus===1?'крупнейший эмитент не заплатит':S.plus+' крупнейших эмитентов из '+S.n+' не заплатят'} и вернётся лишь ${pct}% денег.`;
    const vsDep=S.safe>0 ? ` Обгонит вклад — при ${S.safe} ${dfl(S.safe)}.` : (A.main.profit>=A.dep?` Портфель обгоняет вклад, пока платят все; один дефолт съедает преимущество.`:` Вклад уже сейчас выгоднее — повышенной доходности нет, кредитный риск не оплачен.`);
    const bars=compact?'':`<div class="shbars">${S.runs.map(r=>`<span class="${r.profit>=A.dep?'ok':r.profit>=0?'':'no'}" title="итог после налога, если не заплатят ${r.k} крупнейших эмитентов">${r.k} ${dfl(r.k)}: ${r.profit>=0?'+':'−'}${mshort(Math.abs(r.profit))}</span>`).join('')}<span class="ref" title="доход вклада после налога — планка для сравнения">вклад: +${mshort(A.dep)}</span></div>
      <div class="note" style="margin-top:6px">Худший случай: эмитент перестаёт платить сразу после покупки, по итогам банкротства возвращается ${pct}% (обычно 20–40%), убыток налог не уменьшает. Эмитенты — по убыванию доли.</div>`;
    return `<div class="card shield ${cls}"><div class="shn">${big}</div><div><h2>Запас прочности</h2><div class="sub">${head}${vsDep}</div>${bars}</div></div>`;
  }
  function ratesHtml(A){
    const name=dy=>dy<0?`ЦБ снижает, ставки −${nf(-dy*100,0)} п.п.`:`ЦБ повышает, ставки +${nf(dy*100,0)} п.п.`;
    return `<div class="card"><h2>Если ставки изменятся</h2><div class="sub">что будет с портфелем, если рыночные ставки резко сдвинутся сразу после покупки</div>
      <div class="tblwrap"><table><thead><tr><th>Сценарий</th><th>Стоимость портфеля сразу</th><th>Итог через ${termName()}</th></tr></thead><tbody>
      <tr><td class="nm">Ставки не меняются</td><td class="num">—</td><td class="num">${mshort(A.total+A.main.profit)}</td></tr>
      ${A.shifts.map(s=>`<tr><td class="nm">${name(s.dy)}</td><td class="num ${s.nowRub>=0?'up':'down'}">${s.nowRub>=0?'+':'−'}${mshort(Math.abs(s.nowRub))} (${sg(s.now*100,1)})</td><td class="num">${mshort(A.total+s.end.profit)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="note" style="margin-top:8px">Когда ставки падают, облигации с фиксированным купоном дорожают, когда растут — дешевеют; это видно в средней колонке. Если держать бумаги до погашения, это колебание исчезает — к погашению цена приходит к номиналу. Итог к концу срока меняется мало: в основном из-за того, под какую ставку вкладываются полученные купоны.</div></div>`;
  }
  const cashflowMonths = (A, n) => { const m={}; for(const ps of A.positions) for(const f of ps.flows){ if(f.date>A.H) continue; const k=f.date.slice(0,7); m[k]=m[k]||{c:0,p:0}; if(f.kind==='c') m[k].c+=f.amt*ps.qty*ps.fx; else m[k].p+=f.amt*ps.qty*ps.fx; } let ks=Object.keys(m).sort(); if(n) ks=ks.slice(0,n); return ks.map(k=>({k,...m[k]})); };
  function ladder(A){ const y={}; for(const ps of A.positions) for(const f of ps.flows) if(f.kind!=='c'){ const k=f.date.slice(0,4); y[k]=(y[k]||0)+f.amt*ps.qty*ps.fx; } return Object.entries(y).sort(); }
  function step3(){
    const A=ANALYSIS;
    if(!A) return `<div class="card loading" id="anl">Считаю…</div>`;
    if(A.empty) return `<div class="card empty">Нет бумаг с рассчитанной доходностью.</div>`+nextBar(2,null);
    const cf=cashflowMonths(A,60), sumC=cf.slice(0,12).reduce((s,x)=>s+x.c,0);
    const quick=`<div class="quick"><span>Срок:</span><div class="termbtns">${TERMS.map(([m,n])=>`<button data-term="${m}" class="${P.term===m?'on':''}">${n}</button>`).join('')}</div>
      <span>Счёт:</span><div class="termbtns"><button data-acct="std" class="${P.account!=='iis3'?'on':''}">Брокерский</button><button data-acct="iis3" class="${P.account==='iis3'?'on':''}">ИИС-3</button></div>
      <div class="termbtns"><button data-mon="1" class="${P.monthly?'on':''}" title="купоны выводятся клиенту каждый месяц">Выплаты на руки</button><button data-act="build" title="подобрать бумаги заново под выбранный срок и профиль">↻ Пересобрать под срок</button></div></div>`;
    return quick + heroHtml(A) + shieldHtml(A) + `<div class="grid2">${compareHtml(A)}${ratesHtml(A)}</div>
      <div class="grid3"><div class="card"><h2>Календарь выплат</h2><div class="sub">купоны и погашения по месяцам до конца срока, до налога · за 12 мес. купонов ${mshort(sumC)}</div><div class="cv"><canvas id="cfChart"></canvas></div></div>
      <div class="card"><h2>Лесенка погашений</h2><div class="sub">сколько денег вернётся клиенту в каждом году: погашения, оферты и частичные погашения (амортизация). Показывает, когда деньги придётся вкладывать заново.</div>
      <table><tbody>${ladder(A).map(([k,v])=>`<tr><td>${k}</td><td class="num">${mshort(v)}</td><td class="num">${nf(v/A.total*100,0)}%</td></tr>`).join('')}</tbody></table></div></div>`
      + `<div class="note" style="margin:0 4px 12px">Как считается: доходность — по графику выплат Мосбиржи и цене покупки с НКД; купоны ${P.monthly?'выводятся клиенту (годовые — простые, без процентов на проценты), погашения до конца срока реинвестируются под доходность портфеля':'и погашения до конца срока реинвестируются под доходность портфеля'}; бумаги, которые гасятся позже конца срока, продаются по рынку при неизменной доходности. Налог: 13% с купонов и дохода от погашения, в конце года — пересчёт по шкале${P.reform?' (с 2027 — 13–22%)':''}; другие доходы клиента не учитываются. Курс валют — неизменный. Расчёт — рабочий инструмент советника, не индивидуальная инвестиционная рекомендация.</div>`
      + nextBar(2,4);
  }

  function step4(){
    const A=ANALYSIS, c=A&&A.carry, lr=loanRateSimple(), col=collateralRub(), lim=0.8*col, L=loanAmount(), cny=FX.CNY;
    let h=`<div class="card"><h2>Займ в юанях (carry trade)</h2>
      <div class="explain">ОФЗ и валютные облигации в портфеле: <b>${mshort(col)}</b>. Брокер даёт под них займ с дисконтом 20% — можно занять до <b>${mshort(lim)}</b>${cny?` (¥${nf(lim/cny/1e6,2)} млн)`:''} в юанях.
        Займ вкладывается в юаневые облигации. Если их доходность выше ставки займа — клиент зарабатывает разницу.<br>
        Ставка займа: RUSFAR CNY ${RF?`<b>${nf(RF.v,2)}%</b> (${RF.src}, ${fmtD(RF.date)})`:'—'} + ${carrySpread()}% (${carryTier()}) = <b>${lr!=null?nf(lr,2)+'%':'—'}</b> годовых. Займ на весь срок — ${termName()}.</div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="c_on" ${P.carry.on?'checked':''}> рассчитать с займом</label>`;
    if(!P.carry.on) return h+`</div>`+nextBar(3,5);
    if(!(col>0)) return h+`<div class="note" style="margin-top:10px">В портфеле нет ОФЗ и валютных облигаций — добавьте их на шаге 2.</div></div>`+nextBar(3,5);
    h+=`<div class="fld" style="margin-top:12px"><label>Размер займа: <b>${mshort(L)}</b>${cny?` (¥${nf(L/cny/1e6,2)} млн)`:''} — ${P.carry.ltv}% от лимита</label><input type="range" id="c_ltv" min="0" max="100" step="5" value="${P.carry.ltv}"></div>`;
    if(P.carry.warns&&P.carry.warns.length) h+=`<ul class="warns" style="margin-top:10px">${P.carry.warns.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`;
    const opts=cnyPool().filter(r=>!P.carry.pos.some(p=>p.id===r.id)).slice(0,120).map(r=>`<option value="${r.id}">${r.cnyBoard?'★ ':''}${esc(r.name)} · ${r.rating||'н/р'} · ${pc(r.ytm)} · до ${fmtD(r.end)}</option>`).join('');
    if(c && c.rows.length){
      h+=`<div class="tblwrap" style="margin-top:8px"><table><thead><tr><th>Юаневые облигации на займ</th><th>Рейтинг</th><th>Доходн.</th><th>Погаш./оф.</th><th>Доля займа, %</th><th>Сумма</th><th></th></tr></thead><tbody>${c.rows.map(x=>`<tr>
        <td class="nm">${x.r.cnyBoard?'<span class="star">★</span> ':''}${esc(x.r.name)}${x.r.flag?'<span class="tag d">риск</span>':''}<small>${esc(x.r.isin)} · ${x.r.ofz?'ОФЗ':esc((x.r.emName||'').slice(0,38))}</small></td>
        <td>${rTag(x.r.rating)}</td><td class="num">${pc(x.a.ytm)}</td><td class="num">${fmtD(x.a.end)}</td>
        <td><input class="qty wqty" data-cw="${x.r.id}" value="${nf(x.p.w,1)}" inputmode="decimal"></td><td class="num">${mshort(x.cost)}</td><td><button class="del" data-cdel="${x.r.id}">✕</button></td></tr>`).join('')}</tbody></table></div>`;
    }
    h+=`<div class="row-actions" style="margin-top:10px"><button class="btn ghost" data-act="carrybuild">${P.carry.pos.length?'Подобрать заново':'Подобрать юаневые облигации'}</button>
      <select id="c_add" class="btn ghost" style="font-weight:700;max-width:100%"><option value="">+ Добавить / заменить на любой юаневый выпуск…</option>${opts}</select></div>
      <div class="note" style="margin-top:6px"><span class="star">★</span> — выпуск можно купить и продать за юани (есть режим торгов в юанях).</div>`;
    if(c && c.res){
      const base=A.main, T=A.total;
      const yC=c.py?c.py.ytm:null;
      h+=`<div class="explain" style="margin-top:12px">Юаневые облигации <b>${pc(yC)}</b> − займ <b>${pc(c.eff)}</b> = разница <b class="${yC-c.eff>0?'up':'down'}">${sg((yC-c.eff)*100,2,' п.п.')}</b> годовых до налога (проценты по займу налог не уменьшают).
        ${c.be!=null?`Займ выгоден, пока RUSFAR CNY ниже <b>${nf(c.be-c.spread,2)}%</b> (сейчас ${nf(RF.v,2)}%).`:'<span class="down">При текущих ставках займ не добавляет доходности.</span>'}</div>
        <div class="tblwrap"><table><thead><tr><th>На ${termName()}, свои ${mshort(T)}</th><th>Получите</th><th>Доход после налога</th><th>Годовых</th></tr></thead><tbody>
        <tr><td class="nm">Без займа</td><td class="num">${mshort(T+base.profit)}</td><td class="num">${mshort(base.profit)}</td><td class="num">${pc(base.annual)}</td></tr>
        <tr><td class="nm"><b>С займом</b></td><td class="num"><b>${mshort(T+c.res.profit)}</b></td><td class="num">${mshort(c.res.profit)}</td><td class="num"><b>${pc(c.res.annual)}</b></td></tr>
        <tr><td class="nm">Добавка от займа</td><td></td><td class="num ${c.res.profit>=base.profit?'up':'down'}">${c.res.profit>=base.profit?'+':'−'}${mshort(Math.abs(c.res.profit-base.profit))}</td><td class="num ${c.res.annual>=base.annual?'up':'down'}">${sg((c.res.annual-base.annual)*100,2,' п.п.')}</td></tr>
        ${c.scen.map(s=>`<tr><td class="nm">Если RUSFAR CNY +${nf(s.d*100,0)} п.п. (займ ${nf(c.lr+s.d*100,2)}%)</td><td class="num">${mshort(T+s.res.profit)}</td><td class="num">${mshort(s.res.profit)}</td><td class="num">${pc(s.res.annual)}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="note" style="margin-top:8px">Займ берётся сегодня на весь срок; проценты начисляются ежедневно по ставке RUSFAR CNY + надбавка (ставка плавающая, в расчёте — сегодняшняя, поэтому есть строки с ростом ставки). Купоны и погашения юаневых бумаг сначала гасят займ, остаток гасится в конце срока. Займ и бумаги в юанях — курс влияет только на заработанную разницу. Требования брокера к обеспечению (маржин-колл) не отражены.</div>`;
    } else if(P.carry.pos.length && !c) h+=`<div class="loading">считаю…</div>`;
    return h+`</div>`+nextBar(3,5);
  }

  function step5(){
    const A=ANALYSIS;
    if(!A||A.empty) return `<div class="card empty">Сначала соберите портфель.</div>`+nextBar(2,null);
    return `<div class="card"><h2>Отчёт для клиента</h2><div class="sub">одна страница: итог, состав, выплаты по месяцам, сравнение с вкладом. В окне печати выберите «Сохранить как PDF».</div>
      <div class="sign-grid"><div class="fld"><label>Ваше имя</label><input data-sign="name" value="${esc(SIGN.name)}"></div>
        <div class="fld"><label>Должность</label><input data-sign="title" value="${esc(SIGN.title)}" placeholder="инвестиционный советник"></div>
        <div class="fld"><label>Телефон</label><input data-sign="phone" value="${esc(SIGN.phone)}" inputmode="tel"></div>
        <div class="fld"><label>Имя клиента (не сохраняется)</label><input id="r_client" placeholder="необязательно"></div></div>
      <div class="row-actions" style="margin-top:14px"><button class="btn acc" data-act="print">Отчёт / PDF</button></div></div>`+nextBar(4,null);
  }
  function portHtml(){
    const body = ({1:step1,2:step2,3:step3,4:step4,5:step5})[P.step]();
    return stepsHtml()+body;
  }

  function reportHtml(){
    const A=ANALYSIS; if(!A) return '';
    const client=($('r_client')||{}).value||'';
    const today=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
    const cf=cashflowMonths(A,12);
    const c=A.carry;
    return `<div class="rep">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px"><div><div style="font-size:20px;font-weight:800">Портфель облигаций${client?' · '+esc(client):''}</div>
        <div class="meta" style="margin:2px 0 0">${today} · ${PROFILES[P.profile]?'профиль «'+PROFILES[P.profile].name+'»':''} · ${P.account==='iis3'?'ИИС-3':'брокерский счёт'} · срок ${termName()}</div></div></div>
      ${heroHtml(A,true)}
      <div class="card"><h2>Состав</h2><table><thead><tr><th>Выпуск</th><th>Рейтинг</th><th>Доходность</th><th>Купон</th><th>Погашение</th><th>Доля</th><th>Сумма</th></tr></thead><tbody>
      ${A.rows.map(x=>`<tr><td>${esc(x.r.name)}</td><td>${esc(x.r.rating||'н/р')}</td><td>${pc(x.a.ytm)}</td><td>${x.r.cpn!=null?nf(x.r.cpn,2)+'%, '+freqName(x.r.freq):x.r.kind==='float'?'плавающий, '+freqName(x.r.freq):'—'}</td><td>${fmtD(x.a.end)}${x.a.toCall?' (колл)':x.a.toOffer?' (оферта)':''}</td><td>${nf(x.cost/Math.max(A.total,P.amount)*100,1)}%</td><td>${money(x.cost)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="two"><div class="card"><h2>Выплаты на ближайший год</h2><table><thead><tr><th>Месяц</th><th>Купоны</th><th>Погашения</th></tr></thead><tbody>
        ${cf.map(x=>`<tr><td>${x.k.slice(5)}.${x.k.slice(0,4)}</td><td>${money(x.c)}</td><td>${x.p?money(x.p):'—'}</td></tr>`).join('')}</tbody></table><div class="note">до налога</div></div>
        ${compareHtml(A,true)}</div>
      ${shieldHtml(A,true)}
      ${c&&c.res?`<div class="card"><b>Вариант с займом в юанях:</b> займ ${mshort(c.total)} под ${nf(c.lr,2)}% → итог ${mshort(A.total+c.res.profit)}, ${pc(c.res.annual)} годовых после налога (без займа ${pc(A.main.annual)}). Займ выгоден, пока RUSFAR CNY ниже ${c.be!=null?nf(c.be-c.spread,2)+'%':'—'}.</div>`:''}
      <div class="note">Расчёт по ценам Мосбиржи на ${today}, после НДФЛ (13% с купонов и дохода; в конце года пересчёт по шкале${P.reform?', с 2027 — по законопроекту № 617-9':''}). Купоны ${P.monthly?'выплачиваются клиенту':'реинвестируются'}. Вклад — макс. ставка топ-10 банков (ЦБ) без капитализации, с необлагаемой суммой процентов. ${Object.keys(A.struct.cur).some(c=>c!=='RUB')?'Валютные облигации — по неизменному курсу; при ослаблении рубля заработают больше. ':''}Рейтинги — сводные данные агентств. Доходность не гарантирована; расчёт не является индивидуальной инвестиционной рекомендацией.</div>
      ${SIGN.name?`<div class="sign">${esc(SIGN.name)}${SIGN.title?', '+esc(SIGN.title):''}${SIGN.phone?' · '+esc(SIGN.phone):''}</div>`:''}
    </div>`;
  }

  // ---------------- отрисовка
  function kill(){ charts.forEach(c=>c.destroy()); charts=[]; }
  function drawCf(){
    const c=$('cfChart'); if(!c||!ANALYSIS||!window.Chart) return;
    const cf=cashflowMonths(ANALYSIS,60), ink2=tok('--ink2'), grid=tok('--line'), font={family:FONT,weight:'600',size:11};
    charts.push(new Chart(c,{type:'bar',data:{labels:cf.map(x=>x.k.slice(5)+'.'+x.k.slice(2,4)),datasets:[
      {label:'Купоны',data:cf.map(x=>x.c),backgroundColor:tok('--s1'),borderRadius:4,stack:'s'},
      {label:'Погашения',data:cf.map(x=>x.p),backgroundColor:tok('--s2'),borderRadius:4,stack:'s'}]},
      options:{responsive:true,maintainAspectRatio:false,animation:false,
        plugins:{legend:{position:'bottom',labels:{color:ink2,usePointStyle:true,boxWidth:7,font}},tooltip:{callbacks:{label:x=>' '+x.dataset.label+': '+mshort(x.parsed.y)}}},
        scales:{x:{stacked:true,grid:{display:false},ticks:{color:ink2,font,maxRotation:0,autoSkip:true,maxTicksLimit:12}},
                y:{stacked:true,position:'right',grid:{color:grid},border:{display:false},ticks:{color:ink2,font,callback:v=>v>=1e6?nf(v/1e6,1)+' млн':nf(v/1e3,0)+' тыс'}}}}}));
  }
  const MAPB=[['G','ОФЗ','#0ea5e9'],['AA','AAA–AA','#12b76a'],['A','A','#6366f1'],['B','BBB','#f79009'],['L','ниже / н.р.','#f04438']];
  const mapBand = r => r.rating==='ГОС' ? 'G' : (s=>s<=4?'AA':s<=7?'A':s<=10?'B':'L')(rScore(r.rating));
  function drawMap(){
    const c=$('mapChart'); if(!c||!window.Chart) return;
    const ink2=tok('--ink2'), grid=tok('--line'), ink=tok('--ink'), font={family:FONT,weight:'600',size:11};
    const pts=LASTLIST.filter(r=>r.ytm!=null && r.years!=null && r.ytm<0.6).slice(0,800);
    const ys=pts.map(r=>r.ytm*100).sort((a,b)=>a-b), yHi=ys.length?Math.min(ys[Math.floor(ys.length*0.98)]+2, 60):30;
    const ds=MAPB.map(([k,n,col])=>{ const d=pts.filter(r=>mapBand(r)===k);
      return {label:n, data:d.map(r=>({x:r.years, y:r.ytm*100, r})), backgroundColor:col+'cc', borderColor:d.map(r=>inPort(r.id)?ink:col), borderWidth:d.map(r=>inPort(r.id)?2.5:0),
        pointRadius:d.map(r=>inPort(r.id)?6:(r.flag?2.5:3.5)), pointHoverRadius:7}; });
    charts.push(new Chart(c,{type:'scatter',data:{datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>{ const r=x.raw.r; return ` ${r.name} · ${r.rating||'н/р'} · ${pc(r.ytm)} · до ${fmtD(r.end)} · оценка ${r.flag?'риск':r.cs}${inPort(r.id)?' · в портфеле':''}`; }}}},
      onClick:(e,els)=>{ if(!els.length) return; const r=ds[els[0].datasetIndex].data[els[0].index].r; if(inPort(r.id)) P.pos=P.pos.filter(p=>p.id!==r.id); else addToPort(r.id); ANALYSIS=null; savePort(); render(); },
      scales:{x:{type:'linear',min:0,title:{display:true,text:'лет до погашения / оферты',color:ink2,font},grid:{color:grid},ticks:{color:ink2,font}},
              y:{min:Math.max(0,Math.floor((ys[0]||0)-1)),max:Math.ceil(yHi),title:{display:true,text:'доходность, %',color:ink2,font},grid:{color:grid},border:{display:false},ticks:{color:ink2,font}}}}}));
  }
  const TABS=[['screen','Подбор'],['port','Портфель']];
  function render(){
    kill();
    $('tabs').innerHTML=TABS.map(([k,n])=>`<button class="tab ${TAB===k?'on':''}" data-tab="${k}">${n}${k==='port'&&P.pos.length?`<span class="cnt">${P.pos.length}</span>`:''}</button>`).join('');
    if(!U.length) return;
    $('app').innerHTML = TAB==='screen' ? screenHtml() : portHtml();
    if(TAB==='port' && P.step===3) drawCf();
    if(TAB==='screen') drawMap();
  }
  let anlToken=0;
  async function recompute(){
    ANALYSIS=null; render();
    if(!P.pos.length) return;
    const my=++anlToken;
    try{ await analyze(); }catch(e){ console.error(e); const el=$('anl'); if(el) el.textContent='Не удалось загрузить графики выплат: '+e.message; return; }
    if(my===anlToken) render();
  }

  // ---------------- события
  let tmr=null;
  document.addEventListener('input',ev=>{
    const t=ev.target;
    if(t.dataset.f){ F[t.dataset.f]=t.value; saveF(); clearTimeout(tmr); tmr=setTimeout(()=>{ const pos=t.selectionStart; render(); const el=document.querySelector(`[data-f="${t.dataset.f}"]`); if(el&&el.tagName==='INPUT'){ el.focus(); try{el.setSelectionRange(pos,pos)}catch(e){} } }, t.tagName==='SELECT'?0:350); }
    if(t.id==='c_ltv'){ const lab=t.previousElementSibling; P.carry.ltv=+t.value; if(lab){ const L=loanAmount(); lab.innerHTML=`Размер займа: <b>${mshort(L)}</b>${FX.CNY?` (¥${nf(L/FX.CNY/1e6,2)} млн)`:''} — ${P.carry.ltv}% от лимита`; } }
    if(t.dataset.sign){ SIGN[t.dataset.sign]=t.value; store.set('b_sign', JSON.stringify(SIGN)); }
    if(t.id==='add_q'){ clearTimeout(tmr); tmr=setTimeout(()=>{ const el=$('sugg'); if(el) el.innerHTML=suggHtml(t.value.trim()); }, 200); }
  });
  document.addEventListener('change',async ev=>{
    const t=ev.target;
    if(t.dataset.f && t.tagName==='SELECT'){ F[t.dataset.f]=t.value; saveF(); render(); return; }
    if(t.id==='p_amount'){ P.amount=Number(t.value.replace(/[^0-9]/g,''))||0; ANALYSIS=null; savePort(); render(); return; }
    if(t.id==='p_account'){ P.account=t.value; ANALYSIS=null; savePort(); return; }
    if(t.id==='p_monthly'){ P.monthly=t.checked; ANALYSIS=null; savePort(); return; }
    if(t.id==='p_reform'){ P.reform=t.checked; ANALYSIS=null; savePort(); return; }
    if(t.id==='p_qual'){ P.qual=t.checked; savePort(); return; }
    if(t.id==='p_dep'){ P.depRate=num(t.value); savePort(); await analyze(); render(); return; }
    if(t.id==='p_load' && t.value){ const s=jget('b_saved2',{})[t.value]; if(s){ Object.assign(P,JSON.parse(JSON.stringify(s))); P.step=2; savePort(); recompute(); } return; }
    if(t.dataset.pp){ const k=t.dataset.pp; P.params[k]= k==='minRating'? t.value : (num(t.value)||0); P.profile='custom'; savePort(); render(); return; }
    if(t.dataset.band){ const v=num(t.value); if(v==null) delete P.params.bandCap[t.dataset.band]; else P.params.bandCap[t.dataset.band]=v; P.profile='custom'; savePort(); render(); return; }
    if(t.dataset.cur){ P.cur[t.dataset.cur]=num(t.value)||0; savePort(); render(); return; }
    if(t.dataset.w){ const p=P.pos.find(x=>x.id===t.dataset.w); if(p){ p.w=Math.max(0,num(t.value)||0); savePort(); await analyze(); render(); } return; }
    if(t.dataset.cw){ const p=P.carry.pos.find(x=>x.id===t.dataset.cw); if(p){ p.w=Math.max(0,num(t.value)||0); savePort(); await analyze(); render(); } return; }
    if(t.id==='c_on'){ P.carry.on=t.checked; savePort(); if(P.carry.on && !P.carry.pos.length){ render(); await carryBuild(); } ANALYSIS=null; render(); await analyze(); render(); return; }
    if(t.id==='c_ltv'){ P.carry.ltv=+t.value; savePort(); await analyze(); render(); return; }
    if(t.id==='c_add' && t.value){ P.carry.pos.push({id:t.value, w:Math.max(5, 100-P.carry.pos.reduce((s,p)=>s+p.w,0))}); savePort(); await analyze(); render(); return; }
  });
  document.addEventListener('click',async ev=>{
    const tb=ev.target.closest('[data-tab]'); if(tb){ TAB=tb.dataset.tab; store.set('b_tab',TAB); if(TAB==='port'&&!ANALYSIS&&P.pos.length) recompute(); else render(); window.scrollTo({top:0}); return; }
    const st=ev.target.closest('[data-step]'); if(st){ P.step=+st.dataset.step; savePort(); if(P.step>=2&&!ANALYSIS&&P.pos.length) recompute(); else render(); window.scrollTo({top:0}); return; }
    const tm=ev.target.closest('[data-term]'); if(tm){ P.term=+tm.dataset.term; ANALYSIS=null; savePort(); if(P.step>=3&&P.pos.length) recompute(); else render(); return; }
    const ac=ev.target.closest('[data-acct]'); if(ac){ P.account=ac.dataset.acct; savePort(); recompute(); return; }
    const mo=ev.target.closest('[data-mon]'); if(mo){ P.monthly=!P.monthly; savePort(); recompute(); return; }
    const th=ev.target.closest('th[data-s]'); if(th){ const s=th.dataset.s; if(F.sort===s) F.asc=!F.asc; else {F.sort=s; F.asc=(s==='name');} saveF(); render(); return; }
    const ad=ev.target.closest('[data-add]'); if(ad){ const id=ad.dataset.add;
      if(inPort(id)) P.pos=P.pos.filter(p=>p.id!==id);
      else addToPort(id);
      ANALYSIS=null; savePort(); render(); return; }
    const aq=ev.target.closest('[data-addq]'); if(aq){ addToPort(aq.dataset.addq); await analyze(); render(); return; }
    const wd=ev.target.closest('[data-wd]'); if(wd){ const p=P.pos.find(x=>x.id===wd.dataset.wd); if(p){ p.w=Math.max(0, Math.round((p.w+ +wd.dataset.d)*10)/10); if(p.w===0) P.pos=P.pos.filter(x=>x!==p); savePort(); await analyze(); render(); } return; }
    const dl=ev.target.closest('[data-del]'); if(dl){ P.pos=P.pos.filter(p=>p.id!==dl.dataset.del); savePort(); recompute(); return; }
    const cd=ev.target.closest('[data-cdel]'); if(cd){ P.carry.pos=P.carry.pos.filter(p=>p.id!==cd.dataset.cdel); savePort(); await analyze(); render(); return; }
    const pf=ev.target.closest('[data-prof]'); if(pf){ P.profile=pf.dataset.prof; P.params=JSON.parse(JSON.stringify(PROFILES[P.profile])); savePort(); render(); return; }
    const a=ev.target.closest('[data-act]'); if(!a) return;
    const act=a.dataset.act;
    if(act==='reset'){ Object.assign(F,F_DEF); saveF(); render(); }
    if(act==='build'){ a.disabled=true; a.textContent='Собираю…'; try{ await autoBuildChecked(); if(P.carry.on) await carryBuild(); }catch(e){ console.error(e); } P.step=2; savePort(); recompute(); }
    if(act==='carrybuild'){ a.disabled=true; a.textContent='Подбираю…'; try{ await carryBuild(); }catch(e){ console.error(e); } await analyze(); render(); }
    if(act==='spread'){ const left=Math.round((100-P.pos.reduce((s,p)=>s+p.w,0))*10); const n=P.pos.length; if(n&&left>0){ const base=Math.floor(left/n), extra=left-base*n; P.pos.forEach((p,i)=>p.w=Math.round(p.w*10+base+(i<extra?1:0))/10); savePort(); await analyze(); render(); } }
    if(act==='equal'){ const n=P.pos.length; if(n){ const base=Math.floor(1000/n), extra=1000-base*n; P.pos.forEach((p,i)=>p.w=(base+(i<extra?1:0))/10); savePort(); await analyze(); render(); } }
    if(act==='clear'){ P.pos=[]; P.warns=[]; savePort(); ANALYSIS=null; render(); }
    if(act==='save'){ const n=prompt('Название портфеля (без данных клиента):', 'Портфель'); if(n){ const s=jget('b_saved2',{}); s[n]=JSON.parse(JSON.stringify(P)); store.set('b_saved2',JSON.stringify(s)); render(); } }
    if(act==='print'){ const R=$('report'); R.innerHTML=reportHtml();
      // одна страница A4: меряем отчёт в ширину листа и при необходимости уменьшаем масштаб
      R.style.cssText='display:block;position:absolute;left:-10000px;top:0;width:720px'; const h=R.scrollHeight; R.style.cssText='';
      R.style.setProperty('--rz', String(Math.max(0.6, Math.min(1, 940/h))));
      setTimeout(()=>window.print(),50); }
  });
  $('themeBtn').addEventListener('click',()=>{ const dark=tok('--bg')==='#0c111d'; const t=dark?'light':'dark'; document.documentElement.dataset.theme=t; store.set('theme',t); render(); });
  const TG = window.Telegram && window.Telegram.WebApp;
  if(TG && TG.platform && TG.platform!=='unknown'){ try{ TG.ready(); TG.expand(); if(!store.get('theme','') && TG.colorScheme==='dark') document.documentElement.dataset.theme='dark'; }catch(e){} }

  // для автоматических проверок (ничего не меняет в работе страницы)
  window.__BONDS = { P, F, get A(){ return ANALYSIS; }, get U(){ return U; }, get FX(){ return FX; }, get RF(){ return RF; }, get SETTLE(){ return SETTLE; },
    analyze, autoBuildChecked, carryBuild, screen, render, profileCheck, fitProfile, horizonISO, loanAmount, collateralRub, suggestions, PROFILES };

  function applyHash(){
    const h=decodeURIComponent((location.hash||'').slice(1));
    if(h==='PORT'){ TAB='port'; return; }
    const m=h.match(/^q=(.+)$/); if(m){ TAB='screen'; F.q=m[1]; }
  }
  load().then(()=>{
    applyHash(); render(); if(TAB==='port' && P.pos.length) recompute();
    window.addEventListener('hashchange',()=>{ applyHash(); render(); });
    setInterval(async()=>{ try{ await load(); if(TAB==='screen') render(); }catch(e){} }, 5*60*1000);
  }).catch(e=>{ console.error(e); $('app').innerHTML=`<div class="card empty">Не удалось загрузить котировки Мосбиржи (${esc(e.message)}). Обновите страницу через минуту.</div>`; $('upd').textContent=''; });
})();
</script>
</body>
</html>
