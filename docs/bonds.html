<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Облигации · подбор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="bondmath.js"></script>
<script src="bondscore.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#eef1f6; --card:#ffffff; --line:#e6eaf1; --soft:#f4f6fa;
  --ink:#101828; --ink2:#667085; --ink3:#98a2b3;
  --acc:#5b5bf7; --acc2:#8b5cf6; --up:#12b76a; --down:#f04438; --warn:#f79009;
  --s1:#5b5bf7; --s2:#f79009; --s3:#12b76a; --s4:#ee46bc;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0c111d; --card:#161b26; --line:#232a38; --soft:#1d2433;
    --ink:#f5f7fa; --ink2:#a0aabb; --ink3:#6b7587;
    --acc:#7a7aff; --acc2:#a07bff; --up:#32d583; --down:#f97066; --warn:#fdb022;
    --s1:#7a7aff; --s2:#fdb022; --s3:#32d583; --s4:#f670c7; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c111d; --card:#161b26; --line:#232a38; --soft:#1d2433;
  --ink:#f5f7fa; --ink2:#a0aabb; --ink3:#6b7587;
  --acc:#7a7aff; --acc2:#a07bff; --up:#32d583; --down:#f97066; --warn:#fdb022;
  --s1:#7a7aff; --s2:#fdb022; --s3:#32d583; --s4:#f670c7; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.4;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 90px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:26px;font-weight:800;margin:2px 0 0;letter-spacing:-.01em}
.hello{color:var(--ink2);font-size:13px;font-weight:600}
.hello a{color:var(--acc);text-decoration:none}
.upd{color:var(--ink2);font-size:12.5px;font-weight:600;text-align:right}
.icon-btn{border:0;background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);cursor:pointer;font-size:16px}
.top-right{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:8px;margin:4px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:14px;background:var(--card);color:var(--ink2);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.tab.on{background:var(--ink);color:var(--card)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--acc);color:#fff;font-size:12px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;min-width:0;margin-bottom:14px}
h2{font-size:16.5px;font-weight:800;margin:0}
.sub{font-size:12.5px;color:var(--ink2);font-weight:500;margin:2px 0 12px}
.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 12px;align-items:end}
.fld label{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:11px;padding:9px 10px;font:inherit;font-weight:700;font-size:14px}
.fld.big input{font-size:20px;font-weight:800;padding:10px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:0;background:var(--soft);color:var(--ink2);font:inherit;font-weight:700;font-size:13px;padding:8px 11px;border-radius:10px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--card)}
.btn{border:0;background:var(--ink);color:var(--card);font:inherit;font-weight:800;font-size:14px;padding:10px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}
.btn.acc{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tblwrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;color:var(--ink2);font-size:11.5px;text-align:right;padding:7px 7px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th[data-s]{cursor:pointer}
th:first-child,td:first-child{text-align:left}
th.sorted::after{content:" ↓"}th.sorted.asc::after{content:" ↑"}
td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:600}
td.nm{font-weight:700;white-space:normal;min-width:150px}
td.nm small{display:block;color:var(--ink3);font-weight:600;font-size:11px}
tbody tr:hover td{background:var(--soft)}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--ink2);margin-left:4px;vertical-align:1px}
.tag.w{background:rgba(247,144,9,.15);color:var(--warn)}
.tag.d{background:rgba(240,68,56,.12);color:var(--down)}
.tag.g{background:rgba(18,183,106,.12);color:var(--up)}
.rt{display:inline-block;min-width:38px;text-align:center;font-weight:800;font-size:12px;padding:2px 6px;border-radius:7px}
.rt.r0{background:rgba(91,91,247,.14);color:var(--acc)}
.rt.r1{background:rgba(18,183,106,.14);color:var(--up)}
.rt.r2{background:rgba(247,144,9,.16);color:var(--warn)}
.rt.r3{background:rgba(240,68,56,.14);color:var(--down)}
.rt.rn{background:var(--soft);color:var(--ink3)}
.add{border:0;background:var(--soft);color:var(--acc);font:inherit;font-weight:800;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:16px}
.add.on{background:var(--acc);color:#fff}
.qty{width:84px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:5px 7px;font:inherit;font-weight:700;text-align:right}
.del{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.kpi.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:600}
.kpi.hero .l,.kpi.hero .c{color:rgba(255,255,255,.9)}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
.kpi .c{font-size:12px;color:var(--ink2);font-weight:600;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.grid3{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.cv{height:260px;position:relative}
.note{font-size:12px;color:var(--ink3);line-height:1.55}
.warns{margin:0 0 12px;padding:0;list-style:none}
.warns li{background:rgba(247,144,9,.12);color:var(--ink);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:13px;font-weight:600}
.warns li.bad{background:rgba(240,68,56,.12)}
.prof{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.prof button{border:2px solid transparent;background:var(--soft);color:var(--ink);font:inherit;text-align:left;padding:12px;border-radius:14px;cursor:pointer}
.prof button b{display:block;font-size:14px}
.prof button span{display:block;font-size:11.5px;color:var(--ink2);font-weight:600;margin-top:3px;line-height:1.35}
.prof button.on{border-color:var(--acc);background:var(--card)}
details.params{margin-top:10px}
details.params summary{cursor:pointer;font-weight:700;color:var(--acc);font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.filters.pfil{grid-template-columns:1.4fr 1fr 1fr 1fr 1fr}
.filters.p1{grid-template-columns:1.2fr 2fr 1fr}
.fld{min-width:0}
.cur{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.muted{color:var(--ink3)}
.up{color:var(--up)}.down{color:var(--down)}
.empty{padding:34px;text-align:center;color:var(--ink2)}
.loading{padding:40px;text-align:center;color:var(--ink2);font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc)}
#report{display:none}
@media (max-width:980px){.filters{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.prof{grid-template-columns:1fr 1fr}.pgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:980px){.filters.pfil,.filters.p1{grid-template-columns:1fr 1fr}.filters.pfil .big,.filters.p1 .big{grid-column:1/-1}.filters.p1 .fld:nth-child(2){grid-column:1/-1}}
@media (max-width:600px){td.nm{min-width:110px}.wrap{padding:16px 12px 80px}.filters{grid-template-columns:1fr 1fr}.cur{grid-template-columns:1fr 1fr}.pgrid{grid-template-columns:1fr 1fr}h1{font-size:22px}.hide-m{display:none}}
/* печать: только отчёт */
@media print{
  @page{size:A4;margin:10mm 10mm}
  body{background:#fff;color:#000;font-size:11px}
  .wrap>*:not(#report){display:none!important}
  #report{display:block!important;zoom:var(--rz,1)}
  .card,.kpi{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .kpi.hero{background:#fff;color:#000}.kpi.hero .l,.kpi.hero .c{color:#444}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td,th{padding:3px 5px}
  a{color:#000;text-decoration:none}
  .rep .card{padding:10px 12px;margin-bottom:8px}
  .rep .hero{padding:12px 16px;margin-bottom:8px}.rep .hero .big{font-size:18px}.rep .hero .sm{font-size:11px}
  .rep .hero .row3>div{padding:6px 10px}.rep .hero .v{font-size:15px}.rep .hero .l{font-size:10px}
  .rep h2{font-size:13px;margin:0 0 4px}.rep .two{gap:8px}
  .rep table{font-size:10.5px}.rep .note{font-size:10px}
}
.rep h1{font-size:22px}.rep h2{margin-top:6px}
.rep .meta{color:var(--ink2);font-weight:600;margin:4px 0 14px}
.rep table{font-size:11.5px}
.sign{margin-top:18px;font-weight:700}

/* шаги портфеля */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.steps button{border:0;background:var(--card);color:var(--ink2);font:inherit;font-weight:700;font-size:13px;padding:9px 13px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
.steps button b{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:var(--soft);color:var(--ink2);text-align:center;font-size:12px;margin-right:6px}
.steps button.on{background:var(--ink);color:var(--card)}.steps button.on b{background:var(--acc);color:#fff}
.steps button.done b{background:var(--up);color:#fff}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:22px;padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.hero .sm{font-size:14px;font-weight:600;opacity:.92;margin-top:6px}
.hero .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.hero .row3>div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.hero .row3 .l{font-size:12px;opacity:.9;font-weight:600}.hero .row3 .v{font-size:20px;font-weight:800;margin-top:2px}
.hero .vs{display:inline-flex;gap:6px;align-items:center;margin-top:10px;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.shield{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.shield .shn{width:74px;height:84px;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;
  background:linear-gradient(160deg,var(--up),#0e9f6e);clip-path:path('M37 0 L74 12 L74 44 C74 66 56 79 37 84 C18 79 0 66 0 44 L0 12 Z')}
.shield.weak .shn{background:linear-gradient(160deg,#f59e0b,#d97706)}
.shield.none .shn{background:linear-gradient(160deg,#94a3b8,#64748b);font-size:22px}
.shield h2{margin:0 0 4px}.shield .sub{margin:0}
.kx{display:grid;gap:6px;margin:6px 0}.kxr{display:grid;grid-template-columns:80px 1fr 110px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.kxr i{display:block;height:12px;border-radius:7px;background:linear-gradient(90deg,var(--acc),var(--acc2))}.kxr.dep i{background:var(--ink3)}.kxr b{text-align:right;font-variant-numeric:tabular-nums}
.kxd{font-weight:800;font-size:14px;margin-top:2px}
#kx{width:100%;accent-color:var(--acc)}
.salary .sal-big{font-size:28px;font-weight:800;margin:4px 0 10px}.salary .sal-big span{font-size:13px;font-weight:600;color:var(--ink2)}
.sal-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:120px;align-items:end}
.sal-bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.sal-bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--acc2),var(--acc))}
.sal-bars span{font-size:10.5px;font-weight:700;color:var(--ink2)}
.salary{margin-bottom:14px}.bt{margin-bottom:14px}
.prob{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 2px}.prob div{background:var(--soft);border-radius:14px;padding:8px 12px;min-width:120px}.prob b{display:block;font-size:22px;font-weight:800;color:var(--up)}.prob span{font-size:11.5px;font-weight:700;color:var(--ink2)}
.shbars{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.shbars span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.shbars span.ref{background:transparent;border:1px dashed var(--ink3,#94a3b8)}.shbars span.ok{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}.shbars span.no{background:color-mix(in srgb,var(--down) 12%,transparent);color:var(--down)}
@media(max-width:640px){.shield{gap:12px;align-items:start}.shield .shn{width:52px;height:59px;font-size:22px;clip-path:path('M26 0 L52 8 L52 31 C52 46 39 55 26 59 C13 55 0 46 0 31 L0 8 Z')}.shield.none .shn{font-size:15px}}
.termbtns{display:flex;gap:6px;flex-wrap:wrap}
.termbtns button{border:0;background:var(--soft);color:var(--ink2);font:inherit;font-weight:800;font-size:14px;padding:10px 14px;border-radius:11px;cursor:pointer}
.termbtns button.on{background:var(--ink);color:var(--card)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 22px;margin-top:6px}
.sgt{font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:6px;text-transform:none}
.sbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 38px;gap:8px;align-items:center;font-size:12.5px;font-weight:600;margin:4px 0}
.sbar .sk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar .st{position:relative;height:8px;border-radius:5px;background:var(--soft)}
.sbar .st i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.sbar .st b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2);opacity:.55}
.sbar .sv{text-align:right;font-variant-numeric:tabular-nums}
.sbar.over .st i{background:var(--down)}.sbar.over .sv{color:var(--down);font-weight:800}
.nm[data-why]{cursor:pointer}.nm[data-why]:hover{color:var(--acc)}
tr.whyon td{background:var(--soft)}
.whyrow td{padding:0!important;background:var(--soft)}
.why{padding:12px 14px 14px;white-space:normal;position:sticky;left:0;max-width:calc(100vw - 56px)}@media(min-width:900px){.why{max-width:1100px}}
.why .wh{font-weight:800;font-size:14px;margin-bottom:8px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 22px}
.wy{display:grid;grid-template-columns:118px 1fr 28px;gap:6px 10px;align-items:center;font-size:12.5px}
.wy .wl{font-weight:800}.wy .wt{height:7px;border-radius:5px;background:var(--card);overflow:hidden}.wy .wt i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:5px}
.wy .wv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.wy .wx{grid-column:1/-1;color:var(--ink2);font-weight:600;line-height:1.35}
.wf{margin:10px 0 0;padding-left:18px;font-size:12.5px;line-height:1.5;color:var(--ink)}.wf li{margin:2px 0}
.wn{margin-top:8px;font-size:11.5px;color:var(--ink3)}
#xr_text{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:14px;resize:vertical}
.xsum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.xsum .l{font-size:12.5px;color:var(--ink2);font-weight:700}.xsum .v{font-size:26px;font-weight:800;margin:4px 0}.xsum .c{font-size:12.5px;color:var(--ink2);font-weight:600}
.xsum .warn .v{color:var(--down)}.xsum .good .v{color:var(--up)}
@media(max-width:760px){.xsum{grid-template-columns:1fr}}
.pres{position:fixed;inset:0;z-index:1000;background:radial-gradient(120% 90% at 10% 0%,#3b2fd1 0%,#1a1446 45%,#0b0b1e 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,5vw,72px);overflow:auto}
.pres-s{max-width:1100px;width:100%;margin:0 auto;animation:pin .35s ease}
@keyframes pin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sl-k{font-size:clamp(13px,1.6vw,18px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-bottom:14px}
.sl-h{font-size:clamp(32px,6vw,72px);font-weight:800;line-height:1.08;letter-spacing:-.02em}
.sl-acc{background:linear-gradient(90deg,#8ef0c4,#7ab8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sl-s{font-size:clamp(14px,1.8vw,20px);opacity:.8;margin-top:18px;font-weight:600;max-width:900px}.sl-s b{opacity:1;color:#8ef0c4}
.sl-bar{display:grid;grid-template-columns:minmax(110px,22%) 1fr auto auto;gap:14px;align-items:center;margin:14px 0;font-size:clamp(14px,1.9vw,22px);font-weight:700}
.sl-bar i{display:block;height:clamp(14px,2vw,24px);border-radius:12px;background:rgba(255,255,255,.28)}.sl-bar.me i{background:linear-gradient(90deg,#8ef0c4,#7ab8ff)}
.sl-bar b{font-variant-numeric:tabular-nums}.sl-bar em{font-style:normal;opacity:.65;font-size:.8em;min-width:70px;text-align:right}
.sl-cols{display:flex;gap:1.2%;align-items:flex-end;height:clamp(120px,22vh,220px);margin-top:20px}.sl-cols i{flex:1;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#8ef0c4,#7ab8ff)}
.pres-nav{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:clamp(24px,5vh,56px)}

  // сумма по-человечески: «50м», «1,5 млрд», «300 тыс», «50 000 000»; число без единиц меньше 1000 — в миллионах
  function parseAmount(s){

  // ---------------- загрузка данных Мосбиржи

  async function board(b, only='securities,marketdata,marketdata_yields'){

  const valid = d => d && /^\d{4}-\d\d-\d\d$/.test(d) && !d.startsWith('0000');
  function kindOf(s){
    const t=s.BONDTYPE||'';

  function buildRow(x, fxai, cnyBoard){
    const s=x.s, m=x.m, y=x.y, sec=s.SECID;

    const kind = kindOf(s);

    const rating = ofz ? 'ГОС' : (meta[0] || '');
    const price = (m.OFFER>0 && m.OFFER) || m.LAST || m.WAPRICE || y.PRICE || s.PREVWAPRICE || s.PREVPRICE || null;
    const today = SETTLE || s.SETTLEDATE;
    let off = null;
    if(y.YIELDDATETYPE==='OFFER' && valid(y.YIELDDATE)) off=y.YIELDDATE;
    else for(const d of [s.OFFERDATE,s.PUTOPTIONDATE,s.BUYBACKDATE]) if(valid(d) && d>today && (!off||d<off)) off=d;
    if(off && valid(s.MATDATE) && off>=s.MATDATE) off=null;
    const end = off || (valid(s.MATDATE)?s.MATDATE:null);
    const days = end ? BM.days(today,end) : null, years = days!=null ? days/365 : null;

    // НКД валютной бумаги: рублёвый НКД из TQCB / курс ЦБ (на TQOD НКД евробумаг — в долларах, не в евро);
    // запасной вариант — НКД режима в валюте самой бумаги (TQOY — юани, TQOD — доллары)
    const ai = cur==='RUB' ? (s.ACCRUEDINT||0) : (FX[cur] && s.ACCRUEDINT!=null ? s.ACCRUEDINT/FX[cur] : (fxai[sec] && fxai[sec].cur===cur ? fxai[sec].v : null));
    if(kind==='disc' && price && years>0) ytm = Math.pow(100/price, 1/years)-1;
    // биржа считает доходность по цене последней сделки, а купить можно по цене предложения (её и показываем):
    // пересчёт через модифицированную дюрацию, чтобы доходность соответствовала цене покупки
    else if(ytm!=null && kind!=='float' && y.PRICE>0 && price && Math.abs(price-y.PRICE)>1e-9 && y.DURATION>0){
      const Dm=Math.max(y.DURATION/365, (years||0)*0.3), a0=(ai>0?ai/face*100:0); ytm = (1+ytm)*Math.pow((y.PRICE+a0)/(price+a0), 1/Dm) - 1; }   // (1+y)^−D: точно для бескупонной, хорошо и при больших сдвигах
    let cpn = s.COUPONPERCENT;
    // «фиксированный» купон без ставки, а биржа показывает доходность около нуля — купон ещё не объявлен (по сути плавающий)
    if(kind!=='float' && kind!=='disc' && cpn==null && ytm!=null && ytm<0.01 && price>50 && years>0){

    if(kind==='float' && price && years>0){
      let c = cpn;
      if(c==null && s.COUPONVALUE && s.COUPONPERIOD) c = s.COUPONVALUE/face*365/s.COUPONPERIOD*100;
      if(c!=null && c>0){ const per=(s.COUPONPERIOD||91)/365, g=c/100*per;

      else if(ofz && y.EFFECTIVEYIELD>1){ ytm=y.EFFECTIVEYIELD/100; est=true; }      // ОФЗ-ПК: оценка биржи (сверена)

      sub: /СУБ/.test((s.SECNAME||'')+' '+(s.SHORTNAME||'')), cnyBoard: !!cnyBoard[sec],

  async function load(){

  // ---------------- подбор
  function passBase(r){ return !['linker','struct','conv'].includes(r.kind) && r.ytm!=null && r.years>0.02 && r.price>0; }
  function screen(){
    const minS = F.minR==='any' ? 999 : rScore(F.minR);
    const q = F.q.trim().toLowerCase();
    const yMin=num(F.yMin), yMax=num(F.yMax), mMin=num(F.mMin), mMax=num(F.mMax), liq=num(F.liq);
    const list = U.filter(r=>{
      if(!passBase(r)) return false;
      if(r.sub||r.mbs) return false;                                   // субординированные и секьюритизация — никогда
      if(F.em) return r.em===F.em;                                     // выбран эмитент — все его выпуски
      if(q) return (r.name+' '+r.id+' '+r.isin+' '+(r.emName||'')).toLowerCase().includes(q);
      if(F.cur!=='all' && r.cur!==F.cur) return false;
      if(F.kind==='ofz' && !r.ofz) return false;
      if(F.kind==='corp' && r.ofz) return false;
      if(rScore(r.rating)>minS) return false;
      if(F.ctype==='fixed' && !['fixed','amort','disc'].includes(r.kind)) return false;
      if(F.ctype==='float' && r.kind!=='float') return false;
      if(F.ctype==='noamort' && r.kind==='amort') return false;
      if(F.ctype==='monthly' && !(r.freq>=12)) return false;
      if(F.offer==='no' && r.off) return false;
      if(yMin!=null && r.ytm*100<yMin) return false;
      if(yMax!=null && r.ytm*100>yMax) return false;
      if(mMin!=null && r.years<mMin) return false;
      if(mMax!=null && r.years>mMax) return false;
      if(liq!=null && liq>0 && !r.ofz && r.tv<liq*1e6) return false;
      if(F.sec!=='all' && r.sector!==F.sec) return false;
      return true;
    });
    BS.composite(list);                                   // сводная оценка среди отобранных
    let view=list;
    if(!q && !F.em){ const best={}; for(const r of list){ const k=r.ofz?r.id:r.em; if(!best[k]||(r.cs??-1)>(best[k].cs??-1)) best[k]=r; }
      view=list.filter(r=>best[r.ofz?r.id:r.em]===r); }                 // по одному лучшему выпуску на эмитента
    return view.sort((a,b)=>{
      const k={y:'ytm',dur:'dur',yrs:'days',tv:'tv',r:'rating',price:'price',score:'score',cpn:'cpn',cs:'cs'}[F.sort]||'ytm';
      let x=a[k], y=b[k];
      if(k==='score'){ x = a.flag ? -1e9 : (x ?? -1e6); y = b.flag ? -1e9 : (y ?? -1e6); }
      if(k==='rating'){ x=rScore(x); y=rScore(y); }
      if(x==null) return 1; if(y==null) return -1;
      return F.asc ? x-y : y-x;
    });
  }
  // вероятность дефолта за 3 года по рейтингу — «теоретическая» шкала Эксперт РА (наблюдения 2001–2024), %
  const PD3 = {AAA:0.989,'AA+':1.374,AA:1.693,'AA-':2.083,'A+':2.561,A:3.145,'A-':3.858,'BBB+':4.724,BBB:5.772,'BBB-':7.037,

  const relWord = r => { const s=rScore(r.rating); return r.ofz?'государство (ОФЗ)':s<=1?'максимальная надёжность на рынке':s<=4?'очень высокая надёжность':s<=7?'высокая надёжность':s<=10?'умеренная надёжность':s<99?'спекулятивный уровень':'рейтинга нет'; };
  let WHY=null;
  function whyHtml(r, at, where='в списке'){

      `Купон ${r.cpn!=null?nf(r.cpn,2)+'%':r.kind==='float'?'плавающий':'—'}${r.freq?', '+freqName(r.freq):''}${r.kind==='amort'?' · номинал возвращается частями (амортизация)':''}`,

      r.sub?'Субординированная: при проблемах банка может быть списана раньше обычных долгов.':'',

    ].filter(Boolean);
    return `<div class="why"><div class="wh">Почему оценка <b>${r.flag?'—':r.cs}</b> из 100</div>
      <div class="wgrid">
      ${bar('Доходность', P_.y, `${pc(r.ytm)} к цене покупки — выше, чем у ${Math.round(P_.y*100)}% ${typ} ${where}`)}
      ${bar('Переплата к норме', P_.p, r.prem!=null?`${sg(r.prem*100,2,' п.п.')} к норме: похожие бумаги (${esc(r.rating)}, срок ≈ ${nf(r.dur,1)} г., сравнивали с ${r.peers} выпусками) дают ${pc(r.fair)}`:'нет похожих бумаг для сравнения')}
      ${bar('Надёжность', P_.q, `${esc(r.rating||'без рейтинга')} — ${relWord(r)}${r.ofz?'':`; исторически дефолт ≈ ${nf(pd*100,pd<0.01?2:1)}% в год у компаний с таким рейтингом (Эксперт РА, 2001–2024)`}`)}
      ${bar('Ликвидность', P_.l, r.tv?`оборот ${nf(r.tv/1e6,1)} млн ₽ в день — больше, чем у ${Math.round(P_.l*100)}% бумаг ${where}`:'сделок почти нет — купить и продать сложно')}
      </div><ul class="wf">${facts.map(f=>`<li>${f}</li>`).join('')}</ul>
      <div class="wn">Оценка = доходность 35% + переплата к норме 25% + надёжность 25% + ликвидность 15%; каждая часть — место бумаги среди отобранных (0 — худшая, 100 — лучшая).</div></div>`;
  }
  const csTitle = r => r.csParts ? `из 100: доходность ${Math.round(r.csParts.y*100)} · переплата к норме ${Math.round(r.csParts.p*100)} · надёжность ${Math.round(r.csParts.q*100)} · ликвидность ${Math.round(r.csParts.l*100)}` : 'метка «риск» или нет данных';

        <div class="fld"><label>Доходность до, %</label>${inp('yMax','')}</div>
        <div class="fld"><label>Срок от, лет</label>${inp('mMin','напр. 0,5')}</div>
        <div class="fld"><label>Срок до, лет</label>${inp('mMax','напр. 1,5')}</div>
        <div class="fld"><label>Оборот от, млн ₽/день</label>${inp('liq','')}</div>
        <div class="fld"><label>&nbsp;</label><button class="btn ghost" data-act="reset">Сбросить</button></div>
      </div></details></div>
      <details class="card mapcard" id="mapdet" ${UI.map?'open':''}><summary><h2>Карта рынка</h2><span class="muted">${Math.min(list.length,800)} выпусков · срок × доходность</span></summary>
        <div class="sub" style="margin-top:8px">каждая точка — выпуск из списка: цвет — рейтинг; выше своей «стаи» — платят больше за тот же риск. Нажмите на точку — бумага добавится в портфель (◯ — уже в портфеле)</div>
        <div class="maplegend">${MAPB.map(([k,n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')}</div>
        <div class="cv map"><canvas id="mapChart"></canvas></div></details>
      <div class="card"><div class="sub" style="margin-top:0">найдено ${list.length}${list.length>250?', показаны первые 250':''} · сверху — лучшие по сумме показателей; <span class="tag d">риск</span> — внизу</div>
      <div class="tblwrap"><table><thead><tr>${th('name','Выпуск')}${th('cs','Оценка')}${th('r','Рейтинг')}${th('y','Доходн.')}${th('score','Премия, п.п.')}<th class="hide-m" title="доходность после НДФЛ 13%">После НДФЛ</th>${th('cpn','Купон')}${th('price','Цена, %')}${th('dur','Дюр., лет','hide-m')}${th('yrs','Погаш./оферта')}${th('tv','Оборот, млн ₽','hide-m')}<th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="12" class="empty">ничего не найдено — ослабьте фильтры</td></tr>'}</tbody></table></div></div>`;
  }

  // ---------------- портфель: общие расчёты
  const addMonths = (iso, m) => { const d=new Date(iso+'T00:00:00Z'); const day=d.getUTCDate(); d.setUTCMonth(d.getUTCMonth()+m); if(d.getUTCDate()<day) d.setUTCDate(0); return d.toISOString().slice(0,10); };
  const addDays = (iso, n) => BM.iso(BM.toMs(iso)+n*864e5);
  const horizonISO = () => addMonths(SETTLE, P.term);
  const termName = () => (TERMS.find(t=>t[0]===P.term)||[0,P.term+' мес'])[1];
  const dirtyRub = r => (r.price/100*r.face + (r.ai||0)) * (FX[r.cur]||NaN);
  const qtyFor = (r, w, base=P.amount) => { const u=dirtyRub(r)*r.lot; return u>0 ? Math.floor(w/100*base/u)*r.lot : 0; };
  // окно сроков под срок клиента: бумага гасится (или оферта) не раньше 40% срока и не позже конца срока + месяц;
  // короткие ВДО — от 1,5 месяцев до 1,5 года (дальше деньги реинвестируются); relax — без нижней границы (мало бумаг)
  function inWindow(r, pp, relax){
    const H=horizonISO(); let lo=addDays(SETTLE, relax?30:Math.max(30, Math.round(P.term*30.4*0.4))), hi=addDays(H,31);
    if(pp && pp.maxYears){ lo=addDays(SETTLE,45); const h2=addDays(SETTLE, Math.round(pp.maxYears*365)); if(h2<hi) hi=h2; }
    return r.end && r.end>=lo && r.end<=hi;
  }
  function liqOk(r, need, pp){ if(r.ofz) return true; const v=r.tv; return v>0 && v*pp.liq>=need; }

  // ---------------- автосборка (доли в %)
  let EXCL=new Set();
  function eligible(r, pp, cur, relax){
    if(!passBase(r) || r.cur!==cur || r.mbs || r.sub || r.flag) return false;
    if(EXCL.has(r.id) || EXCL.has('em:'+r.em)) return false;
    if(!r.ofz && (P.exSec||[]).includes(r.sector)) return false;                 // «без девелопмента», «без банков»…
    if(pp.ofzOnly) return r.ofz && (r.kind==='fixed' || (r.kind==='float' && pp.floaterMax>0)) && inWindow(r, pp, relax);
    if(r.kind==='float' && (r.ofz || !(pp.floaterMax>0))) return false;     // ОФЗ — только с фикс. купоном
    if(rScore(r.rating)>rScore(pp.minRating)) return false;
    if(pp.maxRating && rScore(r.rating)<rScore(pp.maxRating)) return false;   // короткие ВДО: не выше A−
    if(r.dur==null || r.dur>pp.durMax) return false;
    if(pp.priceMin ? r.price<pp.priceMin : (r.price<70 && !r.ofz)) return false;
    if(pp.issueMin && r.issue!=null && r.issue<pp.issueMin) return false;
    return inWindow(r, pp, relax);
  }
  // чистая сборка: не трогает P.pos; pins — закреплённые бумаги (остаются с той же долей)
  function buildPos(pp, opts={}){
    const A=P.amount, warns=[];
    const curSrc = opts.cur || P.cur;
    const curShare = pp.ofzOnly ? {RUB:100,CNY:0,USD:0,EUR:0} : Object.fromEntries(CURS.map(([c])=>[c, Math.max(0,num(curSrc[c])||0)]));
    if(pp.ofzOnly && !opts.cur && CURS.some(([c])=>c!=='RUB' && (num(curSrc[c])||0)>0)) warns.push('«Только ОФЗ» — рублёвый портфель: валютная часть не используется');
    if(!Object.values(curShare).some(v=>v>0)){ curShare.RUB=100; warns.push('доли валют не указаны — портфель собран в рублях'); }
    const tot = Object.values(curShare).reduce((a,b)=>a+b,0);
    const pos=[], used=new Set(), bandW={}, emW={}, secW={}, pinCur={}; let floatW=0; const secMax=(pp.sectorMax??100)/100;
    for(const p of (opts.pins||[])){ const r=BYID[p.id]; if(!r||!(p.w>0)) continue; const w=p.w/100;
      pos.push({id:p.id, w:p.w, pin:true}); used.add(r.id); emW[r.em]=(emW[r.em]||0)+w; if(!r.ofz) secW[r.sector]=(secW[r.sector]||0)+w;
      const band=rBand(r.rating); bandW[band]=(bandW[band]||0)+w; if(r.kind==='float') floatW+=w; pinCur[r.cur]=(pinCur[r.cur]||0)+w; }
    const sc = r => (r.cs ?? 0) + (PAY() && r.freq>=12 ? 100 : 0);   // сводная оценка; ежемесячные — вперёд, если цель «выплаты»
    for(const [c] of CURS){
      const share = Math.max(0, curShare[c]/tot - (pinCur[c]||0)); if(share<=0.0005) continue;
      if(c!=='RUB' && !FX[c]){ warns.push(`нет курса ${c} — валютная часть пропущена`); continue; }
      if(pp.ofzOnly){                                   // лесенка ОФЗ: сроки равномерно до конца срока клиента, до 20% на выпуск
        let pool=BS.composite(U.filter(r=>eligible(r,pp,c) && !used.has(r.id)));
        const need=Math.max(pp.minIssuers||5, Math.ceil(share*100/pp.issuerMax-1e-9));
        if(pool.length<need) pool=BS.composite(U.filter(r=>eligible(r,pp,c,true) && !used.has(r.id)));
        // коротких ОФЗ мало — добавляем выпуски чуть длиннее срока (в конце срока продаются по рынку), чтобы не превышать 20% на выпуск
        let ext=0;
        for(const d of [183,365,730]){ if(pool.length>=need) break; ext=d;
          pool=BS.composite(U.filter(r=>r.ofz && r.cur===c && passBase(r) && !used.has(r.id) && (r.kind==='fixed'||(r.kind==='float'&&pp.floaterMax>0)) && r.end>=addDays(SETTLE,30) && r.end<=addDays(horizonISO(),31+d))); }
        if(ext) warns.push(`ОФЗ, которые гасятся до конца срока, — меньше ${need}: добавлены выпуски на ${ext<365?'полгода':ext<730?'год':'2 года'} длиннее — в конце срока они продаются по рынку`);
        const byEnd=pool.slice().sort((a,b)=>a.end<b.end?-1:1), got=[];
        if(byEnd.length){ const t0=BM.toMs(byEnd[0].end), t1=BM.toMs(byEnd[byEnd.length-1].end), k=Math.min(need, byEnd.length);
          for(let i=0;i<k;i++){ const a=t0+(t1-t0)*i/k, b=t0+(t1-t0)*(i+1)/k+(i===k-1?1:0);
            const cand=byEnd.filter(r=>{ const t=BM.toMs(r.end); return t>=a && t<b && !got.includes(r); }).sort((x,y)=>sc(y)-sc(x));
            if(cand[0]) got.push(cand[0]); }
          for(const r of pool.slice().sort((x,y)=>sc(y)-sc(x))){ if(got.length>=k) break; if(!got.includes(r)) got.push(r); } }
        if(!got.length){ warns.push(`не нашлось ОФЗ под срок ${termName()}`); continue; }
        if(got.length<5) warns.push(`под срок ${termName()} нашлось только ${got.length} ${got.length===1?'выпуск':'выпуска'} ОФЗ — доля на выпуск больше 20%`);
        got.sort((a,b)=>a.end<b.end?-1:1).forEach(r=>{ pos.push({id:r.id, w:share/got.length*100}); used.add(r.id); });
        continue;
      }
      const pool = BS.composite(U.filter(r=>eligible(r,pp,c)));
      const ofzShare = c==='RUB' ? Math.max(0, curShare[c]/tot*Math.min(100,pp.ofzMin)/100 - (pinCur.RUB?pos.filter(p=>p.pin&&BYID[p.id].ofz).reduce((s_,p)=>s_+p.w/100,0):0)) : 0;
      const pick = (list, w, n, isOfz) => {
        const best={}; for(const r of list){ if(used.has(r.id)) continue; const k=isOfz?r.id:r.em; if(!isOfz && emW[r.em]>=pp.issuerMax/100-1e-9) continue; if(!best[k]||sc(r)>sc(best[k])) best[k]=r; }
        const cand=Object.values(best).sort((a,b)=>sc(b)-sc(a));
        const out=[], per=w/n;
        for(const r of cand){
          if(out.length>=n) break;
          if(pp.liq>0 && !liqOk(r, per*A, pp)) continue;
          const band=rBand(r.rating);
          if(pp.bandCap[band]!=null && ((bandW[band]||0)+per)*100 > pp.bandCap[band]+1e-9) continue;
          if(r.kind==='float' && (floatW+per)*100 > pp.floaterMax+1e-9) continue;
          if(!isOfz && ((emW[r.em]||0)+per)*100 > pp.issuerMax+1e-9) continue;
          if(!isOfz && (secW[r.sector]||0)+per > secMax+1e-9) continue;                 // лимит на отрасль
          out.push(r); used.add(r.id); bandW[band]=(bandW[band]||0)+per; emW[r.em]=(emW[r.em]||0)+per; if(!isOfz) secW[r.sector]=(secW[r.sector]||0)+per; if(r.kind==='float') floatW+=per;
        }
        return out;
      };
      if(ofzShare>0){
        const ofzPool=pool.filter(r=>r.ofz);
        const n=Math.max(1,Math.min(3,Math.round(ofzShare*A/5e6)||1));
        const got=pick(ofzPool, ofzShare, n, true);
        if(!got.length) warns.push(`не нашлось ОФЗ с фиксированным купоном под срок ${termName()} — доля ОФЗ не вложена`);
        got.forEach(r=>pos.push({id:r.id, w:ofzShare/got.length*100}));
      }
      const corpShare = share-ofzShare;
      if(corpShare>0.0005){
        const corpPool=pool.filter(r=>!r.ofz || c!=='RUB');
        const n=Math.max(c==='RUB'?pp.minIssuers:Math.min(pp.minIssuers,4), Math.ceil(corpShare*100/pp.issuerMax-1e-9));
        const got=pick(corpPool, corpShare, n, false);
        if(!got.length) warns.push(`${c}: нет бумаг под ограничения профиля и срок ${termName()}`);
        else {
          const w=Math.min(corpShare/got.length, (pp.vdo?Math.max(pp.issuerMax,6):pp.issuerMax)/100);   // ВДО: если эмитентов меньше 25 — до 6% на каждого
          // если нашлось меньше бумаг, чем нужно, доля каждой растёт — снова проверяем лимиты групп рейтинга и флоатеров
          const ws=new Map(got.map(r=>[r, w]));
          const capGroup=(f, cap, prev)=>{ const g=got.filter(f); const sum=g.reduce((a,r)=>a+ws.get(r),0)+prev;
            if(g.length && sum*100>cap+1e-9){ const k=Math.max(0,(cap/100-prev))/(sum-prev); g.forEach(r=>ws.set(r, ws.get(r)*k)); } };
          // уже распределённое (ОФЗ, закреплённые и другие валюты) — по итоговым долям
          const done=f=>pos.reduce((a,p)=>{ const r=BYID[p.id]; return a+(r&&f(r)?p.w/100:0); },0);
          for(const [b,cap] of Object.entries(pp.bandCap||{})) if(cap!=null) capGroup(r=>rBand(r.rating)===b, cap, done(r=>rBand(r.rating)===b));
          capGroup(r=>r.kind==='float', pp.floaterMax, done(r=>r.kind==='float'));
          for(const sc_ of new Set(got.map(r=>r.sector))) capGroup(r=>r.sector===sc_, (pp.sectorMax??100), done(r=>!r.ofz && r.sector===sc_));
          got.forEach(r=>pos.push({id:r.id, w:ws.get(r)*100}));
          const left=corpShare-[...ws.values()].reduce((a,b)=>a+b,0);
          if(pp.vdo && left>0.001){        // короткие ВДО: что не разложилось по правилам — в короткие ОФЗ как резерв, а не в более рискованные бумаги
            const H_=horizonISO(), res=BS.composite(U.filter(r=>r.ofz && r.cur==='RUB' && r.kind==='fixed' && passBase(r) && !used.has(r.id) && r.end>=addDays(SETTLE,45) && r.end<=addDays(H_,31)));
            let rv=res.sort((a,b)=>(b.cs||0)-(a.cs||0)).slice(0, left>0.2?3:left>0.08?2:1);
            if(!rv.length) rv=BS.composite(U.filter(r=>r.ofz && r.cur==='RUB' && r.kind==='fixed' && passBase(r) && !used.has(r.id) && r.end>=addDays(SETTLE,45))).sort((a,b)=>a.end<b.end?-1:1).slice(0,1);
            if(rv.length){ rv.forEach(r=>{ pos.push({id:r.id, w:left/rv.length*100}); used.add(r.id); });
              warns.push(`ВДО по правилам нашлись у ${got.length} эмитентов — по ${nf(Math.min(w,0.06)*100,1)}% на каждого; оставшиеся ${nf(left*100,1)}% — в коротких ОФЗ как резерв`); continue; }
          }
          if(left>0.001) warns.push(`${c}: подошло эмитентов — ${got.length} из ${n}, ${nf(left*100,1)}% не распределено (лимиты профиля: до ${pp.issuerMax}% на эмитента${Object.keys(pp.bandCap||{}).length?', по группам рейтинга':''}${pp.sectorMax<100?', до '+pp.sectorMax+'% на отрасль':''}${(P.exSec||[]).length?', без отраслей: '+P.exSec.join(', '):''}). Добавьте бумаги в «Составе» или ослабьте ограничения.`);
        }
      }
    }
    if(pp.vdo && P.term>18) warns.push(`короткие ВДО гасятся в течение 1,5 года — на остаток срока ${termName()} расчёт реинвестирует деньги под доходность портфеля; это допущение, фактическую ставку покажет рынок`);
    pos.forEach(p=>{ if(!p.pin) p.w=Math.floor(p.w*10+1e-6)/10; });          // вниз до 0,1 п.п. — сумма долей не превышает 100%
    return {pos, warns};
  }
  // сборка с проверкой эмитентов по Мосбирже: дефолт — эмитент исключается, «только для квалов» — если клиент не квал,
  // техдефолт в истории — исключается в «Коротких ВДО» (в остальных профилях только отмечается)
  async function buildChecked(pp, pins, cur){
    EXCL=new Set(); const dropped=[]; let res=null;
    for(let i=0;i<5;i++){
      res=buildPos(pp, {pins, cur});
      await Promise.all(res.pos.map(p=>bondization(p.id).catch(()=>null)));
      const bad=res.pos.filter(p=>!p.pin).map(p=>[p.id,BZ[p.id]]).filter(([id,b])=>b && (b.def||(!P.qual&&b.qual)||(pp.vdo&&b.tdef)));
      if(!bad.length) break;
      for(const [id,b] of bad){ const r=BYID[id]; if(b.def||b.tdef) EXCL.add('em:'+r.em); else EXCL.add(id);
        dropped.push(`${r.name} (${b.def?'дефолт':b.tdef?'техдефолт в истории':'только для квалов'})`); }
    }
    if(dropped.length) res.warns=[...res.warns, 'исключены при сборке: '+dropped.join(', ')];
    EXCL=new Set(); return res;
  }
  async function autoBuildChecked(){
    const res=await buildChecked(P.params, P.pos.filter(p=>p.pin));
    P.pos=res.pos; P.warns=res.warns; savePort();
  }

  // ---------------- точный разбор
  const BZ = {};
  async function bondization(id){
    if(BZ[id]) return BZ[id];
    const j=await fetch(`${ISS}securities/${id}/bondization.json?iss.meta=off&limit=unlimited`).then(r=>r.json());
    const am=obj(j.amortizations);
    const res={coupons:obj(j.coupons).map(c=>({date:c.coupondate,start:c.startdate,value:c.value,pct:c.valueprc})),
      amorts:am.map(a=>({date:a.amortdate,value:a.value})), initialFace:(am[0]||{}).initialfacevalue, offers:obj(j.offers||{columns:[],data:[]})};
    try{ const dj=await fetch(`${ISS}securities/${id}.json?iss.meta=off&iss.only=description`).then(r=>r.json());
      const desc=Object.fromEntries(dj.description.data.map(r=>[r[0],r[2]]));
      res.qual = desc.ISQUALIFIEDINVESTORS==='1'; res.def = desc.HASDEFAULT==='1'; res.tdef = desc.HASTECHNICALDEFAULT==='1'; }catch(e){}
    return BZ[id]=res;
  }
  // ставка для неизвестных будущих купонов: известная ставка, иначе — по НКД текущего купона (новые флоатеры), иначе — оценка smart-lab
  function estCpn(r, bz){
    if(r.cpn!=null && r.cpn>0) return r.cpn;
    const cur=(bz.coupons||[]).find(c=>c.start && c.start<SETTLE && c.date>=SETTLE);
    if(cur && r.ai>0){ const d=BM.days(cur.start, SETTLE); if(d>=7) return r.ai/r.face*365/d*100; }
    return r.slY || null;
  }
  const bondObj = (r, bz) => ({face:r.face, initialFace:bz.initialFace||r.face, couponPct:estCpn(r,bz), matdate:r.mat, offerdate:r.off, offerPrice:100, coupons:bz.coupons, amorts:bz.amorts});
  async function makeRows(list, base, lev){
    const items = list.map(p=>({p, r:BYID[p.id]})).filter(x=>x.r && x.p.w>0);
    await Promise.all(items.map(async x=>{ x.bz = await bondization(x.r.id); }));
    const rows=[], positions=[];
    for(const {p,r,bz} of items){
      const qty = qtyFor(r, p.w, base);
      let b = bondObj(r,bz), a = BM.analyze(b, SETTLE, r.price, r.ai);
      // колл-опцион эмитента при цене выше номинала: считаем к худшей дате (доходность к колл-опциону, если она ниже)
      if(r.call && r.price>100 && a.ytm!=null){ const b2={...b, offerdate:r.call}, a2=BM.analyze(b2, SETTLE, r.price, r.ai);
        if(a2.ytm!=null && a2.ytm<a.ytm){ b=b2; a={...a2, toCall:true}; } }
      const fx = FX[r.cur]||NaN;
      const cost = (r.price/100*r.face + (a.accrued??r.ai??0))*qty*fx;
      rows.push({p,r,bz,a,fx,qty,cost});
      if(a.ytm!=null && qty>0) positions.push({id:r.id, qty, bond:b, flows:a.flows, clean:r.price, accrued:a.accrued, fx, ytm:a.ytm, floater:r.kind==='float', lev:!!lev});
    }
    // в расчёт идут только бумаги с рассчитанной доходностью; остальные показываются с пометкой «нет данных»
    const total = rows.filter(x=>x.a.ytm!=null && x.qty>0).reduce((s,x)=>s+x.cost,0);
    return {rows, positions, total, skipped: rows.filter(x=>x.a.ytm==null).map(x=>x.r.name)};
  }

  // ---------------- соответствие профилю
  function profileCheck(rows, total0, pp, riskOnly){
    const v=[]; if(!total0) return v;
    const total=Math.max(total0, P.amount);            // доли — от суммы клиента
    const share=f=>rows.filter(f).reduce((s,x)=>s+x.cost,0)/total*100;
    if(pp.ofzOnly){                                    // «Только ОФЗ»: только госбумаги, до 20% на выпуск
      const non=rows.filter(x=>!x.r.ofz); if(non.length) v.push(`не ОФЗ: ${non.map(x=>x.r.name).join(', ')}`);
      if(!riskOnly) rows.filter(x=>x.r.ofz && x.cost/total*100>pp.issuerMax+0.5).forEach(x=>v.push(`${x.r.name}: ${nf(x.cost/total*100,1)}% — больше ${pp.issuerMax}% на выпуск`));
      return v; }
    if(pp.maxRating){ const hi=rows.filter(x=>!x.r.ofz && rScore(x.r.rating)<rScore(pp.maxRating)); if(hi.length && !riskOnly) v.push(`надёжнее A− (не ВДО): ${hi.map(x=>x.r.name).join(', ')}`); }
    if(pp.maxYears){ const lg=rows.filter(x=>!x.r.ofz && x.a.end && BM.days(SETTLE,x.a.end)/365>pp.maxYears+0.05); if(lg.length) v.push(`срок больше ${nf(pp.maxYears,1)} года: ${lg.map(x=>x.r.name).join(', ')}`); }
    const ofz=share(x=>x.r.ofz && x.r.cur==='RUB');
    const rubShare=share(x=>x.r.cur==='RUB');
    if(pp.ofzMin>0 && ofz+0.5 < pp.ofzMin*rubShare/100) v.push(`ОФЗ ${nf(ofz,0)}% — нужно от ${nf(pp.ofzMin*rubShare/100,0)}%`);
    const low=rows.filter(x=>!x.r.ofz && rScore(x.r.rating)>rScore(pp.minRating));
    if(low.length) v.push(`рейтинг ниже ${pp.minRating}: ${low.map(x=>x.r.name).join(', ')}`);
    const em={}; rows.forEach(x=>{ if(!x.r.ofz) em[x.r.emName||x.r.em]=(em[x.r.emName||x.r.em]||0)+x.cost/total*100; });
    const emCap = pp.vdo ? Math.max(pp.issuerMax,6) : pp.issuerMax;      // короткие ВДО: при нехватке эмитентов — до 6% (остаток — в ОФЗ)
    if(!riskOnly) for(const [k,s] of Object.entries(em)) if(s>emCap+0.5) v.push(`${k}: ${nf(s,1)}% — больше ${emCap}% на эмитента`);
    const fl=share(x=>x.r.kind==='float'); if(fl>pp.floaterMax+0.5) v.push(`флоатеры ${nf(fl,0)}% — лимит ${pp.floaterMax}%`);
    const long=rows.filter(x=>x.r.kind!=='float' && !(pp.vdo && x.r.ofz) && (x.a.macaulay||0)>pp.durMax+0.05);
    if(long.length) v.push(`дюрация больше ${pp.durMax} лет: ${long.map(x=>x.r.name).join(', ')}`);
    for(const [b,cap] of Object.entries(pp.bandCap||{})){ const s=share(x=>rBand(x.r.rating)===b); if(cap!=null && s>cap+0.5) v.push(`группа ${b} ${nf(s,0)}% — лимит ${cap}%`); }
    if(!riskOnly && pp.sectorMax<100){ const sc={}; rows.forEach(x=>{ if(!x.r.ofz) sc[x.r.sector]=(sc[x.r.sector]||0)+x.cost/total*100; });
      for(const [k,w] of Object.entries(sc)) if(w>pp.sectorMax+0.5) v.push(`отрасль «${k}» ${nf(w,0)}% — лимит ${pp.sectorMax}%`); }
    const nIss=Object.keys(em).length; const corpW=share(x=>!x.r.ofz);
    if(!riskOnly && !pp.vdo && corpW>0 && nIss<Math.min(pp.minIssuers, Math.ceil(corpW/pp.issuerMax))) v.push(`эмитентов ${nIss} — для профиля нужно от ${Math.min(pp.minIssuers, Math.ceil(corpW/pp.issuerMax))}`);
    return v;
  }
  // уровень риска портфеля: самый консервативный профиль, чьи требования к надёжности выполнены (ОФЗ, рейтинг, флоатеры, дюрация);
  // диверсификация (доля на эмитента, число эмитентов) проверяется отдельно и показывается списком
  function fitProfile(rows, total){
    for(const k of ['ofz','cons','mod','inc']) if(!profileCheck(rows,total,PROFILES[k],true).length) return k;
    return null;
  }

  // ---------------- сравнение
  const lastS = k => { const s=DATA&&DATA.series&&DATA.series[k]; return s&&s.data.length ? s.data[s.data.length-1][1] : null; };
  function maxKeyOn1st(y){
    const s=DATA&&DATA.series&&DATA.series.KEY; if(!s) return null; let mx=null;
    for(let m=1;m<=12;m++){ const iso=`${y}-${String(m).padStart(2,'0')}-01`; let v=null; for(const [d,x] of s.data){ if(d<=iso) v=x; else break; }
      if(iso>s.data[s.data.length-1][0]) break; if(v!=null) mx=Math.max(mx??v,v); }
    return mx;
  }
  function curveAt(years){
    const c=DATA&&DATA.curves&&DATA.curves['сегодня']; if(!c) return lastS('RGBI_Y');
    const p=c.points.slice().sort((a,b)=>a[0]-b[0]);
    if(years<=p[0][0]) return p[0][1]; if(years>=p[p.length-1][0]) return p[p.length-1][1];
    for(let i=1;i<p.length;i++) if(years<=p[i][0]){ const [x0,y0]=p[i-1],[x1,y1]=p[i]; return y0+(y1-y0)*(years-x0)/(x1-x0); }
  }
  // ---------------- займ в юанях: RUSFAR CNY + надбавка по объёму счёта; лимит = 80% ОФЗ и валютных облигаций (дисконт 20%)
  const carrySpread = () => P.amount>=800e6 ? 2 : P.amount>=200e6 ? 3 : 4;
  const carryTier = () => P.amount>=800e6 ? 'счёт от 800 млн' : P.amount>=200e6 ? 'счёт 200–800 млн' : 'счёт до 200 млн';
  const loanRateSimple = () => RF ? RF.v + carrySpread() : null;
  const effOf = x => Math.pow(1+x/100/365,365)-1;
  function collateralRub(){ return P.pos.reduce((s,p)=>{ const r=BYID[p.id]; return r && (r.ofz||r.cur!=='RUB') ? s+dirtyRub(r)*qtyFor(r,p.w) : s; },0); }
  const loanLimit = () => 0.8*collateralRub();
  const loanAmount = () => loanLimit()*Math.min(100,Math.max(0,P.carry.ltv))/100;
  const cnyPool = () => U.filter(r=>r.cur==='CNY' && passBase(r) && !r.mbs).sort((a,b)=>(b.cnyBoard-a.cnyBoard)||((b.score??-99)-(a.score??-99)));
  async function carryBuild(){
    const pp=P.params, L=loanAmount(), warns=[], excl=new Set(), dropped=[];
    P.carry.pos=[];
    if(!(L>0)){ P.carry.warns=['в портфеле нет ОФЗ и валютных облигаций — займ взять не под что']; savePort(); return; }
    const lrEff = loanRateSimple()!=null ? effOf(loanRateSimple()) : 0;
    for(let it=0; it<4; it++){
      const pool=cnyPool().filter(r=>!r.sub && !r.flag && r.kind!=='float' && !excl.has(r.id) && !excl.has('em:'+r.em)
        && rScore(r.rating)<=rScore(pp.minRating) && r.dur!=null && r.price>=70 && inWindow(r) && r.ytm>lrEff);
      BS.composite(pool);
      const sc=r=>(r.cnyBoard?100:0)+(r.cs??0);      // сначала — с режимом торгов за юани, дальше по сводной оценке
      const best={}; for(const r of pool){ const k=r.ofz?r.id:r.em; if(!best[k]||sc(r)>sc(best[k])) best[k]=r; }
      const cand=Object.values(best).sort((a,b)=>sc(b)-sc(a));
      const n=Math.min(cand.length, Math.max(3, Math.ceil(L/((pp.issuerMax/100)*(P.amount+L))-1e-9)));
      P.carry.pos=cand.slice(0,n).map(r=>({id:r.id, w:Math.floor(1000/n)/10}));
      await Promise.all(P.carry.pos.map(p=>bondization(p.id).catch(()=>null)));
      const bad=P.carry.pos.filter(p=>{ const b=BZ[p.id]; return b && (b.def||(P.qual===false&&b.qual)); });
      if(!bad.length) break;
      for(const p of bad){ const b=BZ[p.id], r=BYID[p.id]; if(b.def) excl.add('em:'+r.em); else excl.add(p.id); dropped.push(r.name); }
    }
    if(!P.carry.pos.length) warns.push(`не нашлось юаневых облигаций под срок ${termName()} с доходностью выше ставки займа — добавьте вручную`);
    if(dropped.length) warns.push('исключены: '+dropped.join(', '));
    P.carry.warns=warns; savePort();
  }

  // ---------------- полный расчёт
  // полный расчёт портфеля pos; light — без стресс-сценариев по эмитентам и сдвигов ставок (для «Сравнения»)
  async function computeA(pos, o={}){
    if(!pos.length) return null;
    const H=horizonISO(), settle=SETTLE;
    const {rows, positions, total, skipped} = await makeRows(pos, P.amount, false);
    if(!positions.length) return {empty:true, rows, total};
    const py = BM.portfolioYield(positions, settle);
    const reinv = py ? Math.max(0, py.ytm) : 0.15;              // реинвестиция не ниже 0%
    const acc = P.account==='iis3'?'iis3':'std';
    // цель «ежемесячные выплаты»: купоны выводятся клиенту, погашения реинвестируются под доходность портфеля
    const opt = extra => Object.assign({settle, horizon:H, reinvest:reinv, withdraw:!!PAY(), reform:P.reform}, extra||{});
    const main = BM.simulate(positions, opt({account:acc}));
    // ежемесячно на руки (если купоны выводятся): купоны за первые 12 мес. (или срок), после НДФЛ
    const mN=Math.min(12,P.term), cut=addMonths(settle,mN);
    const cps=main.calendar.filter(c=>c.date<=cut).reduce((s,c)=>s+c.coupon,0);
    const nkd=positions.reduce((s,p)=>s+p.accrued*p.qty*p.fx,0);
    const monthly=(acc==='std'? (cps-0.13*Math.max(0,cps-nkd)) : cps)/mN;
    // вклад: ставка топ-10 без капитализации, проценты раз в год, переоформление по ставке, которую закладывает кривая ОФЗ
    const depRate = (P.depRate!=null ? P.depRate : (lastS('DEP')||12))/100;
    const curve = DATA&&DATA.curves&&DATA.curves['сегодня'] ? DATA.curves['сегодня'].points : null;
    const depPath = BM.depositPath(depRate, curve, P.term/12);
    const nowY = new Date(BM.toMs(settle)).getUTCFullYear(), keyNow = lastS('KEY')||0;
    const exempt = y => { const ky = P.reform && y>=BM.REFORM_YEAR ? y-1 : y; const k=(ky<=nowY?maxKeyOn1st(ky):null) ?? keyNow; return k/100*1e6; };
    const depR = BM.depositNet(total, {settle, horizon:H, rates:depPath, payout:PAY()?'monthly':'end', reform:P.reform, exempt});
    const dep = depR.profit;
    const ofzY = (curve && BM.parYield(curve, P.term/12, 2)) || (curveAt(P.term/12)||13)/100;   // ОФЗ по номиналу на срок клиента
    const ofzR = BM.parBondNet(total, ofzY, 2, settle, H, acc, !PAY(), P.reform), ofz = ofzR.profit;
    // запас прочности: сколько крупнейших корпоративных эмитентов могут не заплатить (возврат 25% вложенного, без процентов),
    // чтобы портфель всё ещё обгонял вклад. Отказ — сразу после покупки (худший случай), убыток налог не уменьшает.
    const REC=0.25, credit=rows.filter(x=>!x.r.ofz && x.a.ytm!=null && x.qty>0);
    const emCost={}; credit.forEach(x=>{ const k=x.r.em; emCost[k]=(emCost[k]||{cost:0,ids:[],name:x.r.emName||x.r.name}); emCost[k].cost+=x.cost; emCost[k].ids.push(x.r.id); });
    const ems=Object.values(emCost).sort((a,b)=>b.cost-a.cost);
    const stressRun=k=>{ const drop=new Set(ems.slice(0,k).flatMap(e=>e.ids)); const rest=positions.filter(p=>!drop.has(p.id));
      const lost=ems.slice(0,k).reduce((s,e)=>s+e.cost,0); const fin=rest.length?BM.simulate(rest, opt({account:acc})).final:0; return fin+REC*lost-total; };
    const stress={rec:REC, n:ems.length, ems:ems.slice(0,3).map(e=>({name:e.name, share:e.cost/total})), runs:[]};
    if(!o.light) for(let k=1;k<=Math.min(ems.length,20);k++){ const pr=stressRun(k); stress.runs.push({k, profit:pr}); if(pr<0) break; }
    stress.safe=stress.runs.filter(x=>x.profit>=dep).length;       // сколько дефолтов выдерживает, обгоняя вклад
    stress.plus=stress.runs.filter(x=>x.profit>=0).length;         // … оставаясь в плюсе (больше вложенного)
    // вероятность обогнать вклад: 10 000 симуляций дефолтов эмитентов (вероятности — по рейтингу, Эксперт РА; возврат 25%)
    { const T=main.years, base=main.profit, n=10000;
      const emRisk=Object.values(emCost).map(e=>{ const rs=rows.filter(x=>e.ids.includes(x.r.id));
        const pd=Math.max(...rs.map(x=>pdYear(x.r))); return {cost:e.cost, h:-Math.log(1-Math.min(0.999,pd)), share:e.cost/total}; });
      let seed=20261016; const rnd=()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
      let beat=0, plus=0, worstK=0; const res=new Float64Array(n);
      for(let i=0;i<n;i++){ let pr=base, k=0;
        for(const e of emRisk){ const t=-Math.log(1-rnd())/e.h; if(t<T){ k++; pr -= e.cost*(1-REC) + base*e.share*(1-t/T); } }
        res[i]=pr; if(pr>=dep) beat++; if(pr>=0) plus++; if(k>worstK) worstK=k; }
      const sorted=Array.from(res).sort((a,b)=>a-b);
      stress.mc={n, beat:beat/n, plus:plus/n, p5:sorted[Math.floor(n*0.05)], median:sorted[Math.floor(n/2)],
        expDefaults:emRisk.reduce((a,e)=>a+(1-Math.exp(-e.h*T)),0)}; }
    const shifts=o.light?[]:[-0.02,-0.01,0.01,0.02].map(dy=>{
      let v0=0, v1=0;
      for(const ps of positions){ const w=ps.qty*ps.fx, P0=BM.pv(ps.flows, ps.ytm)*w;
        const P1 = ps.floater ? P0*Math.pow((1+ps.ytm)/(1+ps.ytm+dy), (ps.flows.find(f=>f.kind==='c')||{t:0.25}).t) : BM.pv(ps.flows, ps.ytm+dy)*w;
        v0+=P0; v1+=P1; }
      return {dy, nowRub:v1-v0, now:v1/v0-1, end:BM.simulate(positions, opt({account:acc, shift:dy}))};
    });
    let mac=0, mod=0;
    for(const x of rows){ if(x.a.ytm==null||!x.cost) continue; const w=x.cost/total;
      if(x.r.kind==='float'){ const nx=x.a.flows.find(f=>f.kind==='c'); const t=nx?nx.t:0.25; mac+=w*t; mod+=w*t/(1+x.a.ytm); }
      else { mac+=w*x.a.macaulay; mod+=w*x.a.modified; } }
    const by = f => { const o={}; rows.forEach(x=>{ const k=f(x); o[k]=(o[k]||0)+x.cost; }); return o; };
    const yrsTo = x => x.a.end ? BM.days(settle, x.a.end)/365 : 99;
    const struct = { cur: by(x=>x.r.cur), band: by(x=>rBand(x.r.rating)), kind: by(x=>x.r.ofz?'ОФЗ':(x.r.kind==='float'?'Флоатеры':'Корп. фикс.')),
      sector: by(x=>x.r.sector||'Прочее'),
      term: by(x=>{ const y=yrsTo(x); return y<=1?'до 1 года':y<=2?'1–2 года':y<=3?'2–3 года':y<=5?'3–5 лет':'больше 5 лет'; }) };
    const avgR = rows.reduce((s,x)=>s+x.cost*Math.min(20,rScore(x.r.rating)),0)/(total||1);
    // займ в юанях
    let carry=null;
    if(o.carry && P.carry.on && P.carry.pos.length && FX.CNY){
      const L=loanAmount();
      const c = await makeRows(P.carry.pos, L, true);
      const lr=loanRateSimple();
      carry={...c, L, lr, eff: lr!=null?effOf(lr):null, spread:carrySpread(), limit:loanLimit(), collateral:collateralRub(), py:BM.portfolioYield(c.positions, settle)};
      if(carry.eff!=null && c.positions.length){
        const simL=extra=>BM.simulate([...positions,...c.positions], opt(Object.assign({account:acc, loanRate:carry.eff}, extra)));
        carry.res=simL(); carry.scen=[0.01,0.02,0.03].map(d=>({d, res:simL({loanShift:d})}));
        const gap=x=>simL({loanRate:effOf(x)}).annual - main.annual; let lo=0, hi=60;
        if(gap(lo)<=0) carry.be=null; else if(gap(hi)>0) carry.be=hi; else { for(let i=0;i<50;i++){ const m=(lo+hi)/2; if(gap(m)>0) lo=m; else hi=m; } carry.be=(lo+hi)/2; }
      }
    }
    // живой отчёт: портфель по ссылке из PDF — как он живёт с момента расчёта (те же количества бумаг)
    let track=null;
    if(o.track && TRACK && TRACK.q && TRACK.d && TRACK.d<SETTLE){
      let now=0, recv=0, gone=0;
      for(const [id,qty] of TRACK.q){ const r=BYID[id]; let bz=null; try{ bz=await bondization(id); }catch(e){}
        const fx=r?(FX[r.cur]||1):1, d0=TRACK.d;
        if(bz){ recv+=((bz.coupons||[]).filter(c=>c.date>d0&&c.date<=SETTLE&&c.value>0).reduce((s_,c)=>s_+c.value,0)
                     +(bz.amorts||[]).filter(a=>a.date>d0&&a.date<=SETTLE&&a.value>0).reduce((s_,a)=>s_+a.value,0))*qty*fx; }
        if(r) now+=(r.price/100*r.face+(r.ai||0))*qty*fx; else gone++; }
      track={d0:TRACK.d, v0:TRACK.v, now, recv, total:now+recv, ret:(now+recv)/TRACK.v-1, gone};
    }
    const emMax = Math.max(0, ...Object.values(emCost).map(e=>e.cost/total));
    return {rows, positions, total, skipped, py, main, monthly, dep, track, depR, depPath, depRate, ofz, ofzR, ofzY, shifts, stress, exempt, acc, reinv, keyNow, mac, mod, struct, avgR, emMax, settle, H, carry,
                left: 100 - pos.reduce((s,p)=>s+(p.w||0),0), cash: P.amount-total};
  }
  async function analyze(){ ANALYSIS = P.pos.length ? await computeA(P.pos, {carry:true, track:true}) : null; }

  // ---------------- общий интерфейс: шторки, всплывающие сообщения, «Вернуть», вибрация, кнопка «Назад» Telegram
  const WIDE = () => matchMedia('(min-width:1200px)').matches;
  const DESK = () => matchMedia('(min-width:760px)').matches;
  const hap = (k='light') => { try{ const h=IN_TG&&TG.HapticFeedback; if(!h) return;
    if(k==='ok'||k==='warn') h.notificationOccurred(k==='ok'?'success':'warning'); else if(k==='sel') h.selectionChanged(); else h.impactOccurred(k); }catch(e){} };
  function openSheet(html, cls=''){
    let r=$('sheetroot'); if(!r){ r=document.createElement('div'); r.id='sheetroot'; document.body.appendChild(r); }
    r.innerHTML=`<div class="sh-bg" data-act="shclose"></div><div class="sheet ${cls}" id="sheet" role="dialog"><div class="sh-grip"></div><button class="sh-x" data-act="shclose" aria-label="закрыть">✕</button><div class="sh-b" id="shb">${html}</div></div>`;
    void r.offsetWidth; r.classList.add('on'); document.body.classList.add('noscroll'); syncBack();
  }
  const sheetOpen = () => { const r=$('sheetroot'); return !!(r && r.classList.contains('on')); };
  function closeSheet(){ const r=$('sheetroot'); if(!sheetOpen()) return false; r.classList.remove('on'); document.body.classList.remove('noscroll');
    setTimeout(()=>{ if(!r.classList.contains('on')) r.innerHTML=''; },230); syncBack(); return true; }
  // свайп шторки вниз — закрыть
  let shY=null, shDy=0;
  document.addEventListener('touchstart',ev=>{ const s=ev.target.closest&&ev.target.closest('#sheet'); if(!s) return; const b=$('shb'); if(b && b.scrollTop>0 && !ev.target.closest('.sh-grip')) return; shY=ev.touches[0].clientY; shDy=0; },{passive:true});
  document.addEventListener('touchmove',ev=>{ if(shY==null) return; shDy=Math.max(0, ev.touches[0].clientY-shY); const s=$('sheet'); if(s) s.style.transform=shDy?`translateY(${shDy}px)`:''; },{passive:true});
  document.addEventListener('touchend',()=>{ if(shY==null) return; const s=$('sheet'); if(s) s.style.transform=''; if(shDy>90) closeSheet(); shY=null; },{passive:true});
  let TOAST_T=null, UNDO=null;
  function toast(msg, withUndo){
    let t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
    t.innerHTML=`<span>${msg}</span>${withUndo?'<button data-act="undo">Вернуть</button>':''}`; void t.offsetWidth; t.classList.add('on');
    clearTimeout(TOAST_T); TOAST_T=setTimeout(()=>{ t.classList.remove('on'); }, withUndo?6500:2600);
  }
  const snapP = () => JSON.parse(JSON.stringify({amount:P.amount,term:P.term,profile:P.profile,params:P.params,cur:P.cur,account:P.account,monthly:P.monthly,reform:P.reform,qual:P.qual,pos:P.pos,carry:P.carry,warns:P.warns,exSec:P.exSec,depRate:P.depRate}));
  const remember = () => { UNDO=snapP(); };
  async function undo(){ if(!UNDO) return; Object.assign(P, UNDO); UNDO=null; const t=$('toast'); if(t) t.classList.remove('on'); savePort(); hap('sel'); await recompute(); }
  const profName = (k=P.profile) => PROFILES[k] ? PROFILES[k].name : 'свой профиль';
  function pushRecent(){
    if(CLIENT || !P.pos.length) return;
    const s=jget('b_recent',[]); const label=`${mshort(P.amount).replace(' ₽','')} · ${termName()} · ${profName()}${P.account==='iis3'?' · ИИС-3':''}`;
    store.set('b_recent', JSON.stringify([{t:Date.now(), label, p:snapP()}, ...s.filter(x=>x.label!==label)].slice(0,5)));

  // ---------------- «Новый клиент»: всё с нуля; прошлый расчёт можно продолжить одной кнопкой

  // доход вклада с ежемесячной выплатой процентов за срок клиента — для режима «знаю нужный доход в месяц»

  function compareTabHtml(){

      <div class="tiles">${SCENS.map(([k,ic,t,d])=>`<button class="tile" data-scen="${k}"><i>${ic}</i><b>${t}</b><span>${d}</span></button>`).join('')}</div></div>`;

      ${UI.scen==='inc'?`<div class="card incbox"><div class="fld big"><label>Сколько клиент хочет получать на руки в месяц, ₽</label><input id="c_inc" value="${Math.round(UI.cinc).toLocaleString('ru-RU')}" inputmode="decimal"></div></div>`:''}
      ${UI.scen!=='dep'?`<div class="exs"><button class="xchip ${UI.cdep?'on':''}" data-act="cdep">${UI.cdep?'✓ ':''}🏦 Сравнить с вкладом${UI.cdep?' '+nf(depNow(),2)+'%':''}</button>${cmpInfo}</div>`:''}
      <div id="cmpcards">${cmpCardsHtml()}</div>`;
  }
  // ---------------- «Портфель» — один экран
  let PREV=null, DELTA=null;          // прошлый вариант — чтобы подсветить, что изменилось
  const sec = (key, title, aside, body, defOpen, cls='') => { const open = UI.sec[key]!=null ? UI.sec[key] : defOpen;
    return `<details class="card sec ${cls}" data-sec="${key}" ${open?'open':''}><summary><h2>${title}</h2><span class="aside">${aside||''}</span></summary><div class="secb">${body}</div></details>`; };
  const cu = (v, from, fmt='m') => `<span class="cu" data-v="${v}" data-f="${from!=null&&isFinite(from)?from:v}" data-fmt="${fmt}">${fmt==='p'?pc(v):mshort(v)}</span>`;
  function heroHtml(A, compact){
    const R=A.main, T=A.total, fin=T+R.profit, pv=compact?null:PREV;
    const line = PAY()

    return `<div class="hero ${!compact&&DELTA?'flash':''}"><div class="big">${line}</div>${chip}${dl}<div class="sm">после НДФЛ${P.account==='iis3'?(R.iisTax>0?` (ИИС-3: без налога до 30 млн ₽ дохода, с превышения — ${mshort(R.iisTax)})`:' (ИИС-3 — без налога при соблюдении срока, до 30 млн ₽ дохода)'):''} · до ${fmtD(A.H)} · ${P.reform?'с учётом налоговой реформы 2027':'по действующим ставкам НДФЛ'}</div>
      <div class="row3"><div><div class="l">Доход после налога</div><div class="v">${compact?mshort(R.profit):cu(R.profit,pv&&pv.profit)}</div></div>
      <div><div class="l">Годовых после налога${PAY()?" (простых)":""}</div><div class="v">${compact?pc(R.annual):cu(R.annual,pv&&pv.annual,'p')}</div></div>
      <div><div class="l">${PAY()?'В месяц на руки':'Доходность до налога'}</div><div class="v">${PAY()?mshort(A.monthly):pc(A.py&&A.py.ytm)}</div></div></div>
      ${compact||CLIENT?'':`<div class="hacts"><button class="btn white" data-act="present">▶ Показать клиенту</button><button class="btn wghost" data-act="pv" data-pv="report">Отчёт</button><button class="btn wghost" data-act="moresheet">Ещё…</button></div>`}</div>`;
  }
  const infLast = () => { const s_=DATA&&DATA.series&&DATA.series.INFL; return s_&&s_.data.length ? s_.data[s_.data.length-1] : null; };
  const infDate = () => { const x=infLast(); return x ? new Date(x[0]+'T00:00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'}) : ''; };
  function compareHtml(A, compact){

    return `<div class="card ${!compact&&DELTA?'flash':''}"><div class="h2row"><h2>Сравнение на ${termName()}</h2>${compact?'':info('cmpn','Как считается сравнение',note)}</div><div class="sub">на руки после НДФЛ, сумма ${mshort(T)}${compact||CLIENT?'':` · <button class="lnk" data-pill="dep">ставка вклада ${nf(A.depRate*100,2)}% ✎</button>`}</div>
      <div class="tblwrap ${compact?'':'only-d'}"><table><thead><tr><th>Вариант</th><th>Получите</th><th>Доход</th><th>Годовых${PAY()?' (простых)':''}</th>${INF!=null?'<th title="на сколько деньги растут быстрее цен">Сверх инфляции</th>':''}</tr></thead><tbody>${rows.map(([n,p,me])=>
        `<tr><td class="nm">${me?'<b>'+n+'</b>':n}${p===best?' 🏆':''}</td><td class="num">${mshort(T+p)}</td><td class="num">${mshort(p)}</td><td class="num">${pc(ann(p))}</td>${INF!=null?`<td class="num ${ann(p)>INF?'up':'down'}">${sg(((1+ann(p))/(1+INF)-1)*100,2,'%')}</td>`:''}</tr>`).join('')}</tbody></table></div>
      ${compact?'':`<div class="only-m cml">${rows.map(([n,p,me])=>`<div class="cmr ${me?'me':''}"><div class="cmn">${n}${p===best?' 🏆':''}</div><div class="cmv"><b>${mshort(T+p)}</b><span>доход ${mshort(p)} · ${pc(ann(p))} годовых${INF!=null?` · <i class="${ann(p)>INF?'up':'down'}">${sg(((1+ann(p))/(1+INF)-1)*100,1,'%')} к инфляции</i>`:''}</span></div></div>`).join('')}</div>`}</div>`;
  }
  // деньги по месяцам: ближайший год на руки (после НДФЛ) или весь срок (купоны и погашения, до налога)
  const MN3=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  function salaryData(A){ const months=Math.min(12, P.term), m={};
    for(const c of A.main.calendar){ if(!c.coupon) continue; const k=c.date.slice(0,7); m[k]=(m[k]||0)+c.coupon*(A.acc==='std'?0.87:1); }
    const ks=[]; for(let i=0;i<months;i++) ks.push(addMonths(A.settle,i+1).slice(0,7));
    const vals=ks.map(k=>m[k]||0); return {months, ks, vals, avg:vals.reduce((a,b)=>a+b,0)/months}; }
  function moneyHtml(A){
    const S=salaryData(A), cf=cashflowMonths(A,60), sumC=cf.slice(0,12).reduce((s,x)=>s+x.c,0);

      ? `<div class="sal-big">≈ ${mshort(S.avg)} <span>в месяц на руки${A.acc==='std'?' (после 13% НДФЛ)':' — на ИИС-3 остаются на счёте'}</span></div>
        <div class="sal-bars" style="grid-template-columns:repeat(${S.months},1fr)">${S.vals.map((v,i)=>`<div title="${mshort(v)}"><i style="height:${Math.max(2,v/mx*100)}%"></i><span>${MN3[+S.ks[i].slice(5)-1]}</span></div>`).join('')}</div>
        <div class="note" style="margin-top:6px">${z?`В ${z} ${z===1?'месяц':z<5?'месяца':'месяцев'} купонов нет — для ровного дохода добавьте бумаги с ежемесячным купоном.`:'Купоны приходят каждый месяц.'}</div>`
      : `<div class="sub" style="margin:0 0 6px">купоны и погашения по месяцам до конца срока, до налога · за 12 мес. купонов ${mshort(sumC)}</div><div class="cv"><canvas id="cfChart"></canvas></div>`;
    return `<div class="card money ${DELTA?'flash':''}"><div class="h2row"><h2>Деньги по месяцам</h2>${info('money','Деньги по месяцам',`<p>«Ближайший год на руки» — купоны по месяцам после 13% НДФЛ${PAY()?'; они выводятся клиенту':'; в расчёте итога они реинвестируются, но их можно и выводить'}.</p><p>«Весь срок» — купоны и погашения (в том числе оферты и амортизация) до налога, до конца срока.</p>`)}</div>${tg}${body}</div>`;
  }
  // структура портфеля: отрасли, рейтинги, сроки, валюты, тип купона
  const BAND_ORDER=['ГОС','AAA','AA','A','BBB','BB','B','—'], TERM_ORDER=['до 1 года','1–2 года','2–3 года','3–5 лет','больше 5 лет'];
  function structHtml(A){
    const T=A.total||1, pp=P.params;
    const bars=(title, obj, order, limit)=>{ let e=Object.entries(obj).filter(([,v])=>v>0);
      e = order ? e.sort((a,b)=>(order.indexOf(a[0])+99*(order.indexOf(a[0])<0))-(order.indexOf(b[0])+99*(order.indexOf(b[0])<0))) : e.sort((a,b)=>b[1]-a[1]);
      return `<div class="sgrp"><div class="sgt">${title}</div>${e.map(([k,v])=>{ const pc_=v/T*100, over=limit!=null && k!=='ОФЗ' && pc_>limit+0.5;

    const curN={RUB:'Рубли',CNY:'Юани',USD:'Доллары',EUR:'Евро'};

    return `<div class="sgrid">${bars('Отрасли', A.struct.sector, null, pp.sectorMax<100?pp.sectorMax:null)}${bars('Рейтинг', A.struct.band, BAND_ORDER)}${bars('Срок до погашения / оферты', A.struct.term, TERM_ORDER)}${bars('Валюта', cur)}${bars('Купон', A.struct.kind)}</div>
      ${pp.sectorMax<100?`<div class="note" style="margin-top:6px">вертикальная черта — лимит профиля ${pp.sectorMax}% на отрасль</div>`:''}`;
  }
  // «Запас прочности»: сколько крупнейших эмитентов могут не заплатить, а портфель всё равно обгонит вклад
  const pfP = v => v>=0.99?'более 99%':v<0.005?'менее 1%':nf(v*100,0)+'%';     // без «99,9%»: модель — оценка, а не гарантия
  const defWord = x => { const n=Math.round(x*10)/10; return n%1!==0?'дефолта':(n%10===1&&n%100!==11)?'дефолт':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'дефолта':'дефолтов'; };
  function shieldInner(A, compact){
    const S=A.stress; if(!S) return '';

    if(!S.n) return `<div class="shield"><div class="shn">ОФЗ</div><div>${compact?'<h2>Запас прочности</h2>':''}<div class="sub">Портфель из ОФЗ — риска неплатежа эмитентов нет. Остаётся только риск изменения ставок (см. «Если ставки изменятся»).</div></div></div>`;

      : `Портфель останется в плюсе, даже если ${S.plus===1?'крупнейший эмитент не заплатит':S.plus+' крупнейших '+(S.plus%10>=2&&S.plus%10<=4&&(S.plus<10||S.plus>20)?'эмитента':'эмитентов')+' из '+S.n+' не заплатят'} и вернётся лишь ${pct}% денег.`;
    const vsDep=S.safe>0 ? ` Обгонит вклад — при ${S.safe} ${dfl(S.safe)}.` : (A.main.profit>=A.dep?` Портфель обгоняет вклад, пока платят все; один дефолт съедает преимущество.`:` Вклад уже сейчас выгоднее — повышенной доходности нет, кредитный риск не оплачен.`);

    const M=S.mc;
    const prob=M?`<div class="prob"><div><b>${pfP(M.beat)}</b><span>вероятность обогнать вклад</span></div><div><b>${pfP(M.plus)}</b><span>остаться в плюсе</span></div>${compact?'':`<div><b>${mshort(M.p5)}</b><span>доход в плохом сценарии (хуже — 1 из 20)</span></div>`}</div>`:'';
    return `<div class="shield ${cls}"><div class="shn">${big}</div><div>${compact?'<h2>Запас прочности</h2>':''}<div class="sub">${head}${vsDep}</div>${prob}${bars}</div></div>`;
  }
  function shieldHtml(A, compact){

    const note = S.n ? `<p>Худший случай: эмитент перестаёт платить сразу после покупки, по итогам банкротства возвращается ${nf(S.rec*100,0)}% (обычно 20–40%), убыток налог не уменьшает. Эмитенты — по убыванию доли.</p>${M?`<p>${nf(M.n,0)} симуляций: каждый эмитент может не заплатить с вероятностью по его рейтингу — по статистике дефолтов Эксперт РА 2001–2024 (без рейтинга — как B); в среднем ожидается ${nf(M.expDefaults,M.expDefaults<1?2:1)} дефолта за срок.</p>`:''}` : '';
    return sec('shield', `Запас прочности ${S.n?info('shn','Как считается запас прочности',note):''}`, aside, shieldInner(A,false), false);
  }
  // сценарий ключевой ставки: средняя ключевая за срок → реинвестиция, флоатеры, цена продажи на горизонте и переоформление вклада
  let KEYX=null;
  function keyScen(A, X){
    const d=(X-A.keyNow)/100;
    const r=BM.simulate(A.positions,{settle:A.settle,horizon:A.H,reinvest:A.reinv,withdraw:PAY(),reform:P.reform,account:A.acc,shift:d});
    const path=A.depPath.map((v,i)=>i===0?v:Math.max(0.005,v+d));
    const dp=BM.depositNet(A.total,{settle:A.settle,horizon:A.H,rates:path,payout:PAY()?'monthly':'end',reform:P.reform,exempt:A.exempt});
    return {port:r.profit, dep:dp.profit};
  }
  function keyOutHtml(A){
    const X=KEYX??A.keyNow, k=keyScen(A,X), diff=k.port-k.dep, mx=Math.max(k.port,k.dep,1);
    return `<div class="kx"><div class="kxr"><span>Портфель</span><i style="width:${Math.max(2,k.port/mx*100)}%"></i><b>+${mshort(k.port)}</b></div>
      <div class="kxr dep"><span>Вклад</span><i style="width:${Math.max(2,k.dep/mx*100)}%"></i><b>+${mshort(k.dep)}</b></div>
      <div class="kxd ${diff>=0?'up':'down'}">${diff>=0?'Портфель выгоднее на '+mshort(diff):'Вклад выгоднее на '+mshort(-diff)}</div></div>`;
  }
  function ratesHtml(A){
