    if(act==='clientlink'){ const u=portLink(null,true,true); await loadQR(); let ok=false; try{ await navigator.clipboard.writeText(u); ok=true; }catch(e){}
      openSheet(`<h3>Ссылка для клиента</h3><div class="sub">${ok?'Скопирована — отправьте клиенту в мессенджере. ':''}Откроется упрощённый вид: итог, сравнение, деньги по месяцам, состав и презентация — без редактирования. Цены — на момент открытия; позже по ссылке видно, как живёт портфель.</div>
        <div class="qrbig">${qrSvg(u,4)}</div><textarea class="linkta" readonly>${esc(u)}</textarea>${IN_TG?`<div class="row-actions" style="margin-top:10px"><button class="btn acc" data-act="tgshare">Отправить в Telegram</button></div>`:''}`); }
    if(act==='tgshare'){ const u=portLink(null,true,true); try{ TG.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent('Расчёт портфеля облигаций')); }catch(e){} }
    if(act==='openext'){ const u=portLink('report'); try{ TG.openLink(u); }catch(e){ window.open(u,'_blank'); } }
    if(act==='print'){ await loadQR(); const R=$('report'); R.innerHTML=reportHtml();
      // одна страница A4: меряем отчёт в ширину листа и при необходимости уменьшаем масштаб
      R.style.cssText='display:block;position:absolute;left:-10000px;top:0;width:720px'; const h=R.scrollHeight; R.style.cssText='';
      R.style.setProperty('--rz', String(Math.max(0.6, Math.min(1, 940/h))));
      setTimeout(()=>window.print(),50); }
  });
  document.addEventListener('keydown',ev=>{ if(ev.key==='Escape' && sheetOpen()){ closeSheet(); return; } if(!$('pres')) return; if(ev.key==='ArrowRight'||ev.key===' '){ SLIDE++; presShow(); } else if(ev.key==='ArrowLeft'){ SLIDE--; presShow(); } else if(ev.key==='Escape'){ presClose(); } });
  let tx0=null; document.addEventListener('touchstart',ev=>{ if($('pres')) tx0=ev.touches[0].clientX; },{passive:true});
  document.addEventListener('touchend',ev=>{ if(!$('pres')||tx0==null) return; const dx=ev.changedTouches[0].clientX-tx0; tx0=null; if(Math.abs(dx)>50){ SLIDE+=dx<0?1:-1; presShow(); } },{passive:true});
  $('themeBtn').addEventListener('click',()=>{ const dark=tok('--bg')==='#0c111d'; const t=dark?'light':'dark'; document.documentElement.dataset.theme=t; store.set('theme',t); render(); });
  let WIDE0=WIDE(); window.addEventListener('resize',()=>{ const w=WIDE(); if(w!==WIDE0){ WIDE0=w; if(TAB==='port') render(); } });
  // внутри Telegram: на телефоне — на весь экран, жест «вниз» не сворачивает приложение, «Назад» — на предыдущий экран
  if(IN_TG){ try{ TG.ready(); TG.expand(); if(!store.get('theme','') && TG.colorScheme==='dark') document.documentElement.dataset.theme='dark';
      const v=x=>TG.isVersionAtLeast && TG.isVersionAtLeast(x);
      if(v('7.7') && TG.disableVerticalSwipes) TG.disableVerticalSwipes();
      if(v('8.0') && TG.requestFullscreen && ['ios','android','android_x'].includes(TG.platform)){ TG.requestFullscreen(); document.documentElement.classList.add('tgfs'); }
      if(TG.BackButton){ TG.BackButton.onClick(goBack); }
      if(TG.setHeaderColor) try{ TG.setHeaderColor('bg_color'); }catch(e){} }catch(e){} }

  // для автоматических проверок (ничего не меняет в работе страницы)
  window.__BONDS = { P, F, UI, get A(){ return ANALYSIS; }, get U(){ return U; }, get FX(){ return FX; }, get RF(){ return RF; }, get SETTLE(){ return SETTLE; }, get CMP(){ return CMP; }, get VS(){ return VS; },
    analyze, autoBuildChecked, buildPos, buildChecked, computeA, carryBuild, screen, render, recompute, profileCheck, fitProfile, horizonISO, loanAmount, collateralRub, suggestions, similarFor, parseAmount, PROFILES,
    portLink, readPortLink, slides:()=>slidesFor(ANALYSIS), carrySlides:()=>carrySlides(ANALYSIS), setSettle: d => { SETTLE=d; } };

  // ---------------- портфель в ссылке (?p=…): состав и параметры, без данных клиента; cv=1 — вид «для клиента»
  const b64e = str => btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const b64d = str => decodeURIComponent(escape(atob(str.replace(/-/g,'+').replace(/_/g,'/'))));
  function portLink(view, track, client){
    const o={a:P.amount,t:P.term,pr:P.profile,c:P.cur,ac:P.account,m:P.monthly?1:0,r:P.reform?1:0,q:P.qual===false?0:1,d:P.depRate,
      ps:P.pos.map(p=>p.pin?[p.id,p.w,1]:[p.id,p.w]), x:(P.exSec||[]).length?P.exSec:undefined, cy:P.carry&&P.carry.on?{l:P.carry.ltv,ps:P.carry.pos.map(p=>[p.id,p.w])}:null, dt:SETTLE};
    if(P.profile==='custom') o.pp=P.params;
    if(track && ANALYSIS && !ANALYSIS.empty) o.tr={d:SETTLE, v:Math.round(ANALYSIS.total), q:ANALYSIS.rows.filter(x=>x.qty>0&&x.a.ytm!=null).map(x=>[x.r.id,x.qty])};
    const u=new URL(location.href); u.hash=''; u.search=''; u.searchParams.set('p', b64e(JSON.stringify(o))); if(client) u.searchParams.set('cv','1'); else if(view) u.searchParams.set('s', view);
    return u.toString();
  }
  let TRACK=null, CLIENT_D=null;
  function readPortLink(qs){
    const raw=qs.get('p'); if(!raw) return false;
    try{ const o=JSON.parse(b64d(raw));
      CLIENT = qs.get('cv')==='1';
      Object.assign(P,{amount:+o.a||P.amount, term:+o.t||P.term, profile:o.pr==='agg'?'inc':(o.pr||'mod'), cur:o.c||P.cur, account:o.ac==='iis3'?'iis3':'std', monthly:!!o.m, reform:o.r!==0, qual:o.q!==0,
        depRate:o.d??null, pos:(o.ps||[]).map(([id,w,pin])=>pin?{id,w:+w,pin:true}:{id,w:+w}), exSec:Array.isArray(o.x)?o.x:[], warns:[],
        carry:o.cy?{on:true,ltv:+o.cy.l||100,pos:(o.cy.ps||[]).map(([id,w])=>({id,w:+w})),warns:[]}:{on:false,ltv:100,pos:[],warns:[]}});
      P.params=o.pp||JSON.parse(JSON.stringify(PROFILES[P.profile]||PROFILES.mod));
      TRACK=o.tr||null; CLIENT_D=o.dt||(o.tr&&o.tr.d)||null;
      const s=qs.get('s'); PV = s==='report'||s==='5' ? 'report' : s==='carry'||s==='4' ? 'carry' : 'main';
      savePort(); TAB='port'; return true; }catch(e){ console.error(e); return false; }
  }
  // переходы: ?v=compare|port|xray | ?q=SECID | ?p=… (Telegram дописывает свои данные после «#», поэтому параметры — в «?»); #PORT и #q= — для старых ссылок
  function applyHash(){
    const qs=new URLSearchParams(location.search);
    if(readPortLink(qs)) return true;
    const v=(qs.get('v')||'').toLowerCase(); if(v==='port'){ TAB='port'; return; } if(v==='xray'){ TAB='xray'; return; } if(v==='compare'||v==='calc'){ TAB='compare'; return; } if(v==='screen'){ TAB='screen'; return; }
    if(qs.get('q')){ TAB='screen'; F.q=qs.get('q'); F.em=''; return; }
    const h=decodeURIComponent((location.hash||'').slice(1));
    if(h.startsWith('tgWebApp')) return;
    if(h==='PORT'){ TAB='port'; return; }
    const m=h.match(/^q=(.+)$/); if(m){ TAB='screen'; F.q=m[1]; F.em=''; }
  }
  load().then(()=>{
    const fromLink=applyHash();
    // прошло больше 4 часов — значит, новая встреча: начинаем с нуля (прошлый расчёт — кнопкой «↩ Продолжить»)
    const last=+store.get('b_last','0');
    if(!fromLink && !CLIENT && last && Date.now()-last>4*3600e3 && (P.pos.length || UI.scen)){ newClient(true); if(!new URLSearchParams(location.search).get('v')){ TAB='compare'; store.set('b_tab2',TAB); } }
    touch();
    render(); if(TAB==='port' && P.pos.length) recompute();
    window.addEventListener('hashchange',()=>{ applyHash(); render(); });
    setInterval(async()=>{ try{ await load(); if(TAB==='screen') render(); }catch(e){} }, 5*60*1000);
  }).catch(e=>{ console.error(e); $('app').innerHTML=`<div class="card empty">Не удалось загрузить котировки Мосбиржи (${esc(e.message)}). Обновите страницу через минуту.</div>`; $('upd').textContent=''; });
})();
</script>
