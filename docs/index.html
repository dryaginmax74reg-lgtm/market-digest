<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рынки сегодня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="bondmath.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#eef1f6; --card:#ffffff; --line:#e6eaf1; --soft:#f4f6fa;
  --ink:#101828; --ink2:#667085; --ink3:#98a2b3;
  --acc:#5b5bf7; --acc2:#8b5cf6; --up:#12b76a; --down:#f04438;
  --s1:#5b5bf7; --s2:#f79009; --s3:#12b76a; --s4:#ee46bc;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --nav:#101828; --navink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0c111d; --card:#161b26; --line:#232a38; --soft:#1d2433;
    --ink:#f5f7fa; --ink2:#a0aabb; --ink3:#6b7587;
    --acc:#7a7aff; --acc2:#a07bff; --up:#32d583; --down:#f97066;
    --s1:#7a7aff; --s2:#fdb022; --s3:#32d583; --s4:#f670c7;
    --shadow:0 1px 2px rgba(0,0,0,.3); --nav:#1d2433; --navink:#f5f7fa;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c111d; --card:#161b26; --line:#232a38; --soft:#1d2433;
  --ink:#f5f7fa; --ink2:#a0aabb; --ink3:#6b7587;
  --acc:#7a7aff; --acc2:#a07bff; --up:#32d583; --down:#f97066;
  --s1:#7a7aff; --s2:#fdb022; --s3:#32d583; --s4:#f670c7;
  --shadow:0 1px 2px rgba(0,0,0,.3); --nav:#1d2433; --navink:#f5f7fa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 110px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hello{color:var(--ink2);font-size:14px;font-weight:500}
h1{font-size:28px;font-weight:800;margin:2px 0 0;letter-spacing:-.01em}
.upd{color:var(--ink2);font-size:13px;font-weight:500}
.icon-btn{border:0;background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);cursor:pointer;font-size:16px}
.top-right{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:8px;margin:4px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:14px;background:var(--card);color:var(--ink2);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.tab.on{background:var(--ink);color:var(--card)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card.focus{outline:2px solid var(--acc);outline-offset:-2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.tile{cursor:pointer;transition:transform .12s ease}
.tile:hover{transform:translateY(-2px)}
.tile.sel{outline:2px solid var(--acc);outline-offset:-2px}
.tile .l{font-size:13px;color:var(--ink2);font-weight:600}
.tile .v{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.01em;line-height:1.1}
.tile .c{font-size:13px;margin-top:4px;color:var(--ink2);font-weight:600}
.tile .sp{height:46px;margin-top:10px;position:relative}
.tile.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.tile.hero.sel{outline-color:#fff}
.tile.hero .l,.tile.hero .c,.tile.hero .c span{color:rgba(255,255,255,.9)!important}
.up{color:var(--up)}.down{color:var(--down)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;align-items:start}
.big .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.big .l{font-size:14px;color:var(--ink2);font-weight:600}
.big .v{font-size:32px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
.big .c{font-size:13px;color:var(--ink2);font-weight:600;margin-top:2px}
.big .cv{height:320px;margin-top:12px;position:relative}
.rng{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:12px}
.rng button{border:0;background:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--ink2);padding:6px 10px;border-radius:9px;cursor:pointer}
.rng button.on{background:var(--ink);color:var(--card)}
h2{font-size:17px;font-weight:800;margin:0}
.sub{font-size:12.5px;color:var(--ink2);font-weight:500;margin:2px 0 12px}
.bars .row{padding:10px 0;border-bottom:1px solid var(--line)}
.bars .row:last-child{border:0}
.bars .top{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.bars .row.hl .top span:first-child{font-weight:800}
.bars .track{height:8px;border-radius:4px;background:var(--soft);margin-top:7px;overflow:hidden;position:relative}
.bars .track i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--acc)}
.bars .track i.neg{background:var(--down)}
.bars .row.hl .track i{background:var(--s2)}
.cv2{height:250px;position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--ink2);font-size:12px;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th:first-child,td:first-child{text-align:left}
th.sorted::after{content:" ↓"}th.sorted.asc::after{content:" ↑"}
td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:600}
td:first-child{font-weight:700;white-space:normal}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--soft)}
tr:last-child td{border:0}
.ts{width:96px;height:28px;position:relative;display:inline-block;vertical-align:middle}
.grp td{background:none!important;color:var(--ink3);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-top:16px;cursor:default}
.note{font-size:12px;color:var(--ink3);margin-top:22px;text-align:center}
.bnav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--nav);color:var(--navink);border-radius:20px;display:none;justify-content:space-around;padding:9px 4px;z-index:10;box-shadow:0 8px 30px rgba(16,24,40,.25)}
.bnav button{border:0;background:none;color:inherit;font:inherit;font-size:10.5px;font-weight:700;opacity:.55;text-align:center;cursor:pointer;padding:2px 1px;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnav button.on{opacity:1}.bnav i{display:block;font-style:normal;font-size:18px;line-height:1.3}
.empty{padding:40px;text-align:center;color:var(--ink2)}
/* сегодня: выпуск дайджеста */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.seg button{border:0;background:var(--card);color:var(--ink2);font:inherit;font-weight:800;font-size:14px;padding:10px 14px;border-radius:14px;cursor:pointer;box-shadow:var(--shadow)}
.seg button.on{background:var(--ink);color:var(--card)}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.dg .card{font-size:14.5px;line-height:1.55}
.dg .card pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0 0;overflow-x:auto;white-space:pre}
.dg .card blockquote{margin:10px 0 0;padding:0;border:0}
.dg .card a{color:var(--acc);text-decoration:none;font-weight:600}
.dg .card i{color:var(--ink2)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 12px;color:var(--ink2);font-size:13px;font-weight:600}
.stale{background:color-mix(in srgb,var(--s2) 14%,var(--card));border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.stale button,.btnx{border:0;background:var(--ink);color:var(--card);font:inherit;font-weight:800;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer}
.plc{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.plc .card{display:flex;flex-direction:column;gap:6px}
.plc .nm{font-weight:800;font-size:16px}
.plc .rt{display:flex;gap:5px;flex-wrap:wrap}.plc .rt span{font-size:11.5px;font-weight:800;background:var(--soft);border-radius:8px;padding:3px 7px;color:var(--ink2)}
.plc .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}.plc .kv b{color:var(--ink2);font-weight:600}
.plc .when{font-weight:800;font-size:13px;color:var(--acc)}.plc .when.past{color:var(--ink3)}
.plc .nt{font-size:12.5px;color:var(--ink2)}
/* калькулятор */
.cmodes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 16px}
.cmodes button{border:0;text-align:left;background:var(--soft);color:var(--ink);font:inherit;padding:12px 14px;border-radius:16px;cursor:pointer}
.cmodes button b{display:block;font-size:15px;font-weight:800}.cmodes button span{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:2px}
.cmodes button.on{background:var(--ink);color:var(--card)}.cmodes button.on span{color:var(--card);opacity:.75}
.cset{margin-top:14px}.cset summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--ink2)}
.rates-ed{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.rates-ed label{font-size:12px;color:var(--ink2);font-weight:700}.rates-ed input{width:100%;margin-top:4px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-weight:800;font-size:15px}
.cres .clead{font-size:16px;font-weight:700;margin-bottom:10px}.cres .clead2{font-size:15px;font-weight:600;margin-top:12px}
.lose-big{font-size:34px;font-weight:800;color:var(--down);margin:2px 0 10px}.lose-big span{display:block;font-size:13px;font-weight:600;color:var(--ink2)}
.cbar{display:grid;grid-template-columns:minmax(150px,1.1fr) 2fr minmax(120px,auto);gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cbar:last-of-type{border-bottom:0}
.cbar .cn{font-weight:800}.cbar .cn small,.beat .cn small{display:block;font-weight:600;color:var(--ink3);font-size:12px}
.cbar .ct{height:12px;border-radius:7px;background:var(--soft);overflow:hidden}.cbar .ct i{display:block;height:100%;border-radius:7px;background:var(--ink3)}
.cbar.best .ct i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.cbar .cv{text-align:right;font-weight:800;font-size:18px}.cbar .cv small{display:block;font-size:12px;font-weight:600;color:var(--ink2)}
.cbar .win{font-size:11px;font-weight:800;color:var(--card);background:var(--up);border-radius:6px;padding:2px 6px;margin-left:4px;vertical-align:middle}
.beat{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.beat .cn{font-weight:800}.beat .bv{text-align:right;font-weight:800;font-size:22px}.beat .bv small{display:block;font-size:12px;font-weight:600;color:var(--ink2);max-width:260px}
@media (max-width:640px){.cmodes{grid-template-columns:1fr}.rates-ed{grid-template-columns:1fr 1fr}.cbar{grid-template-columns:1fr auto;gap:6px 10px}.cbar .ct{grid-column:1/-1;order:3}.cbar .cv{font-size:16px}.beat .bv{font-size:19px}}
.calc-in{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:end}
.fld label{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.fld input{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:22px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:0;background:var(--soft);color:var(--ink2);font:inherit;font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--card)}
.tax{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--ink2);font-weight:600}
.res{margin-top:6px}
.rrow{display:grid;grid-template-columns:1.6fr .8fr 1fr 1fr 1fr 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border:0}
.rrow.head{font-size:12px;color:var(--ink2);font-weight:600;padding-top:0}
.rrow .nm{font-weight:800}.rrow .nm small{display:block;font-weight:500;color:var(--ink3);font-size:11.5px}
.rrow input{width:72px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:6px 8px;font:inherit;font-weight:700;text-align:right}
.rrow .r{text-align:right;font-weight:700}
.rrow .best{color:var(--up)}
.rrow.wide{grid-template-columns:1.6fr .8fr 1fr 1fr 1fr 1fr 1fr}
.calc-note{font-size:12px;color:var(--ink3);margin-top:12px;line-height:1.5}
.calc-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.calc-sum .card{padding:14px 16px}
.calc-sum .l{font-size:12.5px;color:var(--ink2);font-weight:600}
.calc-sum .v{font-size:22px;font-weight:800;margin-top:4px}
.calc-sum .c{font-size:12.5px;color:var(--ink2);font-weight:600;margin-top:2px}
@media (max-width:860px){.calc-sum{grid-template-columns:1fr 1fr}}
@media (max-width:640px){
  .calc-in{grid-template-columns:1fr}
  .rrow,.rrow.wide{grid-template-columns:1fr 1fr;gap:4px 10px}
  .rrow.head{display:none}
  .rrow .nm{grid-column:1/-1}
  .rrow .r::before{content:attr(data-l);display:block;font-size:11px;color:var(--ink3);font-weight:600}
  .rrow .r{text-align:left}
}
.gap{height:14px}
@media (max-width:860px){
  .tiles{grid-template-columns:1fr 1fr}
  .grid2,.grid2b{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{padding:16px 14px 110px}
  h1{font-size:24px}
  .tabs{display:none}.bnav{display:flex}
  .tile .v{font-size:23px}
  .card{padding:16px;border-radius:20px}
  .big .cv{height:240px}.big .v{font-size:27px}
  .hide-m{display:none}
  .ts{width:64px}
  .top-right .upd{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="hello" id="hello">Доброе утро</div><h1>Рынки сегодня</h1></div>
    <div class="top-right"><div class="upd num" id="upd">загрузка…</div><button class="icon-btn" id="themeBtn" title="Светлая / тёмная тема">◐</button></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="app"><div class="card empty">Загружаю данные…</div></div>
  <div class="note" id="note">Источники: Банк России, Московская биржа, Yahoo Finance · обновляется каждое утро · справочная информация, не инвестиционная рекомендация</div>
</div>
<nav class="bnav" id="bnav"></nav>
<script>
(function(){
  const USER_NAME = 'Максим';           // имя в приветствии; можно оставить пустым ''
  const TABS = [
    {id:'today', name:'Сегодня', icon:'☀'},
    {id:'overview', name:'Обзор', icon:'◎'},
    {id:'rates', name:'Ставки', icon:'%'},
    {id:'bonds', name:'Облигации', icon:'◫'},
    {id:'fx', name:'Валюты', icon:'₽'},
    {id:'markets', name:'Рынки', icon:'↗'},
    {id:'calc', name:'Расчёт', icon:'∑'},
  ];
  const TAB_SERIES = {
    rates:['KEY','DEP','RUSFARCNY','RUONIA'],
    bonds:['RGBITR','RUCBTRNS','RGBI_Y','CORP_Y'],
    fx:['USD','CNY','EUR'],
    markets:['IMOEX','BRENT','GOLD','BTC','UST10'],
  };
  const SHORT = {KEY:'Ключевая ставка',DEP:'Вклады, топ-10',RUONIA:'RUONIA',RUSFAR:'RUSFAR O/N',RUSFARCNY:'RUSFAR CNY',
    RGBITR:'ОФЗ с купонами',RUCBTRNS:'Корп. облигации',RGBI_Y:'Доходность ОФЗ',CORP_Y:'Доходность корп.',
    USD:'Доллар, ₽',EUR:'Евро, ₽',CNY:'Юань, ₽',IMOEX:'Индекс Мосбиржи',BRENT:'Нефть Brent, $',GOLD:'Золото, $',BTC:'Bitcoin, $',UST10:'UST 10Y'};
  const STEP = new Set(['KEY','DEP']);
  const FONT = 'Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  Chart.defaults.font.family = FONT;
  const RANGES = [['1m','1М'],['3m','3М'],['ytd','YTD'],['1y','1Г'],['3y','3Г']];

  const $ = id => document.getElementById(id);
  const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const nf = (v,d=2) => v==null||isNaN(v) ? '—' : (v+(v>=0?1e-9:-1e-9)).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
  const sg = (v,d=1,s='%') => v==null||isNaN(v) ? '—' : (v>0?'+':v<0?'−':'')+nf(Math.abs(v),d)+s;
  const cls = v => v>0?'up':v<0?'down':'';
  const clsK = (k,v) => isRate(k) ? '' : cls(v);   // ставки: без «хорошо/плохо», нейтральный цвет
  const D = s => new Date(s+'T00:00:00').getTime();
  const fmtD = t => new Date(t).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});
  const store = {get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

  let DATA=null, TAB=store.get('tab','overview'), RANGE=store.get('range','ytd'), SEL=store.get('sel','IMOEX');
  let charts=[], sortKey='group', sortAsc=false, FOCUS=null, DIG=null, DSEG=store.get('dseg','details');
  const t0 = store.get('theme',''); if(t0) document.documentElement.dataset.theme=t0;

  const hr=new Date().getHours();
  $('hello').textContent=(hr<5?'Доброй ночи':hr<12?'Доброе утро':hr<18?'Добрый день':'Добрый вечер')+(USER_NAME?', '+USER_NAME:'');

  // ---------- данные
  const has = k => !!(DATA.series[k] && DATA.series[k].data.length);
  const isRate = k => (DATA.series[k]||{}).unit==='%';
  const lastDate = () => D(DATA.updated.slice(0,10));
  const pts = k => DATA.series[k].data.map(([d,v])=>[D(d),v]);
  function startOf(r){ const d=new Date(lastDate());
    if(r==='ytd') return new Date(d.getFullYear()-1,11,31).getTime();
    const m={'1m':1,'3m':3,'1y':12,'3y':36}[r]; d.setMonth(d.getMonth()-m); return d.getTime(); }
  function slice(k,r=RANGE){ const p=pts(k); const from=startOf(r);
    const i=p.findIndex(x=>x[0]>from); if(i<0) return p.slice(-1); return p.slice(Math.max(0,i-1)); }
  const last = k => { const p=DATA.series[k].data; return p[p.length-1][1]; };
  function valueAt(k,t){ let v=null; for(const [d,x] of pts(k)){ if(d<=t) v=x; else break; } return v; }
  function chg(k,from){ const b=valueAt(k,from), l=last(k); if(b==null) return null; return isRate(k)? l-b : (l/b-1)*100; }
  const chgR = (k,r=RANGE) => chg(k,startOf(r));
  const chgDays = (k,days) => chg(k,lastDate()-days*864e5);
  function chg1d(k){ const p=DATA.series[k].data; if(p.length<2) return null; const a=p[p.length-2][1], b=p[p.length-1][1]; return isRate(k)? b-a : (b/a-1)*100; }

  // ---------- калькулятор: что получит клиент после НДФЛ (налог считается только с этих инвестиций)
  // Правила по году получения дохода:
  //   2026 — действующие: инвестдоход 13% до 2,4 млн ₽, 15% сверху; вклады: необлагаемо 1 млн × макс. ключевая на 1-е числа месяцев года
  //   2027+ — законопроект № 617-9 (если примут): шкала 13/15/18/20/22% (2,4 / 5 / 20 / 50 млн);
  //           вклады: необлагаемо 1 млн × макс. ключевая ПРОШЛОГО года; банки удерживают налог
  const REFORM_YEAR = 2027;
  const CALC = {amount: Number(store.get('calc_amount','100000000')), months: Number(store.get('calc_months','12')),
                tax: true, reform: store.get('calc_reform','1')==='1', reinv: store.get('calc_reinv','reinv'), rates:null};
  const REINV = [['pay','Выплачивать'],['reinv','Реинвестировать'],['iis','ИИС-3']];
  const TERMS = [[3,'3 мес'],[6,'6 мес'],[12,'1 год'],[24,'2 года'],[36,'3 года']];
  function curveAt(years){
    const c=(DATA.curves||{})['сегодня']; if(!c) return has('RGBI_Y')?last('RGBI_Y'):null;
    const p=c.points.slice().sort((a,b)=>a[0]-b[0]);
    if(years<=p[0][0]) return p[0][1]; if(years>=p[p.length-1][0]) return p[p.length-1][1];
    for(let i=1;i<p.length;i++) if(years<=p[i][0]){ const [x0,y0]=p[i-1],[x1,y1]=p[i]; return y0+(y1-y0)*(years-x0)/(x1-x0); }
  }
  function maxKeyOn1st(y){
    if(!has('KEY')) return null; let mx=null;
    for(let m=0;m<12;m++){ const t=new Date(y,m,1).getTime(); if(t>lastDate()) break; const v=valueAt('KEY',t); if(v!=null) mx=Math.max(mx??v,v); }
    return mx;
  }
  const keyNow = () => has('KEY') ? last('KEY') : 0;
  // необлагаемый процент по вкладам за год y
  function depExempt(y, reform){
    const nowY=new Date(lastDate()).getFullYear();
    let k;
    if(reform && y>=REFORM_YEAR) k = (y-1<=nowY ? maxKeyOn1st(y-1) : null) ?? keyNow();   // ставка прошлого года
    else k = (y<=nowY ? maxKeyOn1st(y) : null) ?? keyNow();                              // ставка этого года (будущее — по текущей)
    return (k||0)/100*1e6;
  }
  function tax1315(b){ b=Math.max(0,b); return Math.min(b,2.4e6)*0.13+Math.max(0,b-2.4e6)*0.15; }
  function taxScale(b){
    b=Math.max(0,b); const br=[[2.4e6,.13],[5e6,.15],[20e6,.18],[50e6,.20],[Infinity,.22]]; let t=0,lo=0;
    for(const [hi,r] of br){ if(b>lo) t+=(Math.min(b,hi)-lo)*r; lo=hi; } return t;
  }
  function yearTax(y, base, reform){ return (reform && y>=REFORM_YEAR) ? taxScale(base) : tax1315(base); }
  // доля срока в каждом календарном году
  function splitYears(months){
    const start=new Date(lastDate()), end=new Date(start); end.setMonth(end.getMonth()+months);
    const total=end-start, out=[]; let cur=new Date(start);
    while(cur<end){ const ny=new Date(cur.getFullYear()+1,0,1); const seg=Math.min(ny,end)-cur; out.push([cur.getFullYear(), seg/total]); cur=ny; }
    return {parts:out, endYear:new Date(end-1).getFullYear()};
  }
  function taxFor(kind, inc, months, reform){
    if(!CALC.tax) return 0;
    const {parts,endYear}=splitYears(months);
    if(kind==='mmf') return yearTax(endYear, inc, reform);                    // фонд: налог при продаже
    return parts.reduce((s,[y,f])=>s+yearTax(y, inc*f-(kind==='dep'?depExempt(y,reform):0), reform),0);
  }
  function defaultRatesFor(months){ const keep=CALC.months; CALC.months=months; const r=defaultRates(); CALC.months=keep; return r; }
  function defaultRates(){
    const t=CALC.months/12;
    const cv=(DATA.curves||{})['сегодня'], par=cv&&window.BondMath&&BondMath.parYield ? BondMath.parYield(cv.points, t, 2) : null;
    return { dep: has('DEP')?last('DEP'):12, ofz: par!=null ? Math.round(par*1e4)/100 : (curveAt(t) ?? 13), corp: has('CORP_Y')?last('CORP_Y'):16,
             mmf: has('RUONIA')?Math.max(0,last('RUONIA')-0.4):12 };
  }
  // облигация по номиналу с эффективной доходностью y, f купонов в год, на срок months;
  // купоны: 'pay' — выплачиваются (лежат без дохода), 'reinv' — реинвестируются после 13% НДФЛ, 'iis' — целиком, без налога
  function bondSim(A, y, f, months, mode, reform){
    const st=new Date(lastDate()), end=new Date(st); end.setMonth(end.getMonth()+months);
    const U=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
    const flows=[]; let prev=U(st);
    for(let k=1;;k++){
      const d=new Date(st); d.setMonth(d.getMonth()+Math.round(12/f*k)); const ms=Math.min(U(d),U(end));
      const amt=1000*(Math.pow(1+y,(ms-prev)/864e5/365)-1);
      flows.push({ms,amt,kind:'c',date:BondMath.iso(ms)}); prev=ms;
      if(ms>=U(end)) break;
    }
    flows.push({ms:U(end),amt:1000,kind:'a',date:BondMath.iso(U(end))});
    const pos=[{id:'b',qty:A/1000,bond:{face:1000},flows,clean:100,accrued:0,fx:1,ytm:y}];
    const run=acc=>BondMath.simulate(pos,{settle:BondMath.iso(U(st)),horizon:BondMath.iso(U(end)),account:acc,reinvest:mode==='pay'?0:y,reform});
    if(!CALC.tax){ const g=run('none').final-A; return {inc:g, tax:0}; }
    if(mode==='iis'){ const r=run('iis3'); return {inc:r.final-A+r.taxPaid, tax:r.taxPaid}; }   // ИИС-3: без налога до 30 млн ₽ дохода
    const r=run('std');                       // доход, реально полученный при удержании налога, и фактический налог
    return {inc:r.final-A+r.taxPaid, tax:r.taxPaid};
  }
  const money = v => (Math.round(v)).toLocaleString('ru-RU')+' ₽';
  const moneyShort = v => Math.abs(v)>=1e6 ? nf(v/1e6, Math.abs(v)>=1e8?0:2)+' млн ₽' : money(v);
  function calcResults(){ return calcFor(CALC.amount, CALC.months, CALC.rates, CALC.reinv); }
  function calcFor(A, m, R, mode){
    const t=m/12, iis=mode==='iis';
    const sub = {pay:'купоны выплачиваются', reinv:'купоны реинвестируются после 13% НДФЛ', iis:'на ИИС-3: купоны реинвестируются целиком, без НДФЛ (до 30 млн ₽ дохода)'}[mode];
    const rows=[
      ['dep','Вклад', 'макс. ставка топ-10 банков (ЦБ, без капитализации); '+(mode==='pay'?'проценты ежемесячно':'проценты раз в год')+(t>1?', дальше переоформление: если кривая ОФЗ ждёт снижения ставок — ниже, рост не закладывается':''), null],
      ['mmf','Фонд денежного рынка','≈ RUONIA минус комиссия 0,4%; налог при продаже'+(iis?' (на ИИС-3 — без налога до 30 млн ₽ дохода)':''), A*(Math.pow(1+R.mmf/100/365,365*t)-1)],

    ].map(([k,n,s,inc,f])=>{

        const st=new Date(lastDate()), H=new Date(st); H.setMonth(H.getMonth()+m);

        const a=run(false), b=run(true); inc=a.gross; taxNow=CALC.tax?a.tax:0; taxRef=CALC.tax?b.tax:0;
      } else if(f){
        const y=R[k]/100;
        const a=bondSim(A,y,f,m,mode,false), b=bondSim(A,y,f,m,mode,true);
        inc=a.inc; taxNow=a.tax; taxRef=b.tax;
      } else if(k==='mmf' && iis){ const ey=splitYears(m).endYear, over=Math.max(0,inc-30e6); taxNow=CALC.tax?yearTax(ey,over,false):0; taxRef=CALC.tax?yearTax(ey,over,true):0; }   // ИИС-3: без налога до 30 млн ₽ дохода
      else { taxNow=taxFor(k,inc,m,false); taxRef=taxFor(k,inc,m,true); }
      const tax=CALC.reform?taxRef:taxNow, net=inc-tax;
      return {k,n,s,inc,tax,taxNow,taxRef,net,ann:(Math.pow(1+net/A,1/t)-1)*100};
    });
    rows.forEach(r=>r.vs=r.net-rows[0].net);
    return {rows,t};
  }
  // ---------- калькулятор для встречи: три вопроса клиента
  const CMODES=[['get','Сколько получу','на руки с суммы за срок'],['lose','Сколько теряет на вкладе','вклад клиента против облигаций'],['need','Сколько вложить','чтобы получать доход каждый месяц'],['beat','Какой вклад догонит','при какой ставке вклад сравняется с облигациями']];

      : `<div class="fld"><label>Срок</label><div class="chips">${TERMS.map(([m,n])=>`<button data-m="${m}" class="${m===CALC.months?'on':''}">${n}</button>`).join('')}</div></div>`;
    return `<div class="card" id="card_CALC" style="margin-bottom:14px"><h2>Калькулятор для встречи</h2>
      <div class="sub">быстрые ответы на три частых вопроса клиента — всё после НДФЛ, по сегодняшним ставкам</div>
      <div class="cmodes">${CMODES.map(([k,n,d])=>`<button data-cmode="${k}" class="${M===k?'on':''}"><b>${n}</b><span>${d}</span></button>`).join('')}</div>
      <div class="calc-in">${amt}${term}</div>${myDep?`<div class="calc-in" style="margin-top:12px">${myDep}<div></div></div>`:''}
      ${M==='get'?`<div class="fld" style="margin-top:14px"><label>Доход по облигациям</label><div class="chips" id="c_reinv">${REINV.map(([k,n])=>`<button data-reinv="${k}" class="${k===CALC.reinv?'on':''}">${n}</button>`).join('')}</div></div>`:''}
      <details class="cset"><summary>Ставки и налоги (можно изменить)</summary>
        <div class="rates-ed">${['dep','mmf','ofz','corp'].map(k=>`<label>${NAMES[k]}, %<input data-rate="${k}" value="${nf(CALC.rates[k],2)}" inputmode="decimal"></label>`).join('')}</div>
        <label class="tax"><input type="checkbox" id="c_tax" ${CALC.tax?'checked':''}> учитывать НДФЛ</label>
        <label class="tax"><input type="checkbox" id="c_reform" ${CALC.reform?'checked':''}> доход с 2027 года — по налоговой реформе (13–22%, законопроект № 617-9)</label>
        <div class="calc-note">Вклад — максимальная ставка топ-10 банков (ЦБ), ОФЗ — доходность по кривой на этот срок, корп. облигации — доходность индекса Мосбиржи, фонд денежного рынка — RUONIA минус 0,4% комиссии.</div>
      </details></div>
      <div id="c_out"></div>`;
  }
  function calcUpdate(){
    const M=CALC.mode, out=$('c_out'); if(!out) return;
    if(M==='get') out.innerHTML=calcGet();
    else if(M==='lose') out.innerHTML=calcLose();
    else if(M==='need') out.innerHTML=calcNeed();
    else out.innerHTML=calcBeat();
  }
  // 1) сколько получит с суммы
  function calcGet(){
    const {rows}=calcResults(), dep=rows[0], best=rows.reduce((a,b)=>b.net>a.net?b:a), mx=Math.max(...rows.map(r=>r.net),1);
    const term=(TERMS.find(t=>t[0]===CALC.months)||[0,''])[1];
    const lead = best.k==='dep' ? `Сейчас выгоднее всего вклад.` :
      `${NAMES[best.k]} дадут на <b>${moneyShort(best.net-dep.net)}</b> больше вклада за ${term}.`;
    return `<div class="card cres"><div class="clead">С ${moneyShort(CALC.amount)} за ${term} клиент получит на руки:</div>
      ${rows.map(r=>`<div class="cbar ${r===best?'best':''}"><div class="cn">${ICON[r.k]} ${NAMES[r.k]}${r===best?' <span class="win">выгоднее всего</span>':''}<small>${nf(CALC.rates[r.k],2)}% до налога · ${nf(r.ann,2)}% годовых на руки</small></div>
        <div class="ct"><i style="width:${Math.max(2,r.net/mx*100)}%"></i></div><div class="cv num">${moneyShort(r.net)}<small>${r.k==='dep'?'налог '+moneyShort(r.tax):(r.vs>=0?'+':'−')+moneyShort(Math.abs(r.vs))+' к вкладу'}</small></div></div>`).join('')}
      <div class="clead2">${lead}</div>
      <div class="calc-note">${({pay:'Купоны выплачиваются клиенту, проценты по вкладу — ежемесячно.',reinv:'Купоны реинвестируются (брокер удерживает 13%, в конце года — пересчёт по шкале); вклад переоформляется с процентами раз в год.',iis:'ИИС-3: купоны реинвестируются целиком без налога (до 30 млн ₽ дохода, при сроке ИИС от 5 лет); вклад — с налогом.'})[CALC.reinv]}
        Налог по вкладу — с суммы сверх необлагаемой (1 млн × макс. ключевая ставка). Облигации — держим до погашения; колебания цены, комиссии и другие доходы клиента не учтены.</div></div>`;
  }
  // 1б) сколько клиент недополучает на своём вкладе
  function calcLose(){
    const A=CALC.amount, m=CALC.months, my=CALC.myDep!=null?CALC.myDep:CALC.rates.dep, term=(TERMS.find(t=>t[0]===m)||[0,''])[1], yrs=m/12;
    const rows=calcFor(A,m,{...CALC.rates, dep:my},'reinv').rows, dep=rows.find(r=>r.k==='dep');
    const alt=rows.filter(r=>r.k!=='dep'&&r.k!=='mmf'), best=alt.reduce((a,b)=>b.net>a.net?b:a);
    const lose=best.net-dep.net;
    if(lose<=0) return `<div class="card cres"><div class="clead">Вклад клиента под ${nf(my,2)}% сейчас не уступает облигациям за ${term} — хорошая ставка.</div></div>`;
    return `<div class="card cres lose"><div class="clead">Вклад ${moneyShort(A)} под ${nf(my,2)}% за ${term}:</div>
      <div class="lose-big">−${moneyShort(lose)}<span>клиент недополучает по сравнению с ${best.k==='ofz'?'ОФЗ':'корп. облигациями'}${yrs>1?` — это ${moneyShort(lose/yrs)} в год`:''}, ≈ ${moneyShort(lose/m)} в месяц</span></div>
      ${[dep,...alt].map(r=>`<div class="cbar ${r===best?'best':''}"><div class="cn">${ICON[r.k]} ${r.k==='dep'?'Вклад клиента':NAMES[r.k]}<small>${nf(r.k==='dep'?my:CALC.rates[r.k],2)}% до налога</small></div>
        <div class="ct"><i style="width:${Math.max(2,r.net/Math.max(...[dep,...alt].map(x=>x.net))*100)}%"></i></div><div class="cv num">${moneyShort(r.net)}<small>${r.k==='dep'?'на руки':'+'+moneyShort(r.net-dep.net)+' к вкладу'}</small></div></div>`).join('')}
      <div class="calc-note">Всё после НДФЛ; купоны реинвестируются, проценты по вкладу — раз в год без капитализации, с необлагаемой суммой. Ставки облигаций — сегодняшние (ОФЗ — по кривой на этот срок, корп. — индекс Мосбиржи).</div></div>`;
  }
  // 2) сколько вложить, чтобы получать X в месяц на руки (1 год, выплаты ежемесячно)
  function calcNeed(){
    const T=CALC.target; if(!(T>0)) return `<div class="card empty">Укажите желаемый доход в месяц.</div>`;
    const need=k=>{ const f=A=>calcFor(A,12,CALC.rates,'pay').rows.find(r=>r.k===k).net/12>=T; return bisect(f,0,T*12/0.005); };
    const ks=['dep','ofz','corp'], res=ks.map(k=>({k,A:need(k)})), dep=res[0], mx=Math.max(...res.map(r=>r.A));
    const best=res.reduce((a,b)=>b.A<a.A?b:a);
    return `<div class="card cres"><div class="clead">Чтобы получать <b>${moneyShort(T)}</b> в месяц на руки (после НДФЛ), нужно вложить:</div>
      ${res.map(r=>`<div class="cbar ${r===best?'best':''}"><div class="cn">${ICON[r.k]} ${NAMES[r.k]}${r===best?' <span class="win">меньше всего денег</span>':''}<small>${nf(CALC.rates[r.k],2)}% до налога</small></div>
        <div class="ct"><i style="width:${r.A/mx*100}%"></i></div><div class="cv num">${moneyShort(r.A)}<small>${r.k==='dep'?'база':((dep.A-r.A)>=0?'на '+moneyShort(dep.A-r.A)+' меньше вклада':'на '+moneyShort(r.A-dep.A)+' больше вклада')}</small></div></div>`).join('')}
      <div class="clead2">${best.k==='dep'?'Сейчас вклад требует меньше всего денег.':`В ${best.k==='ofz'?'ОФЗ':'корп. облигациях'} нужно на <b>${moneyShort(dep.A-best.A)}</b> меньше, чем во вкладе — и доход тот же.`}</div>
      <div class="calc-note">Срок — год, купоны и проценты выплачиваются клиенту (ОФЗ платят купон раз в полгода — сумма в месяц здесь средняя), налог — по шкале с учётом необлагаемой суммы по вкладам. Чем больше сумма, тем выше ставка НДФЛ (15% с дохода больше 2,4 млн ₽ в год${CALC.reform?', по реформе — до 22%':''}), поэтому зависимость не линейная.</div></div>`;
  }
  // 3) при какой ставке вклад догонит облигации
  function calcBeat(){
    const A=CALC.amount, m=CALC.months, term=(TERMS.find(t=>t[0]===m)||[0,''])[1];
    const net=(R,k)=>calcFor(A,m,R,CALC.reinv==='iis'?'iis':CALC.reinv).rows.find(r=>r.k===k).net;
    const be=k=>{ const goal=net(CALC.rates,k); return bisect(r=>net({...CALC.rates,dep:r},'dep')>=goal, 0, 80); };
    const rows=['ofz','corp','mmf'].map(k=>({k,r:be(k)}));
    const cur=CALC.rates.dep;
    return `<div class="card cres"><div class="clead">Клиент говорит «у меня вклад лучше»? Вклад на ${moneyShort(A)} и ${term} должен давать, чтобы сравняться:</div>
      ${rows.map(x=>`<div class="beat"><div class="cn">${ICON[x.k]} ${({ofz:'чтобы догнать ОФЗ',corp:'чтобы догнать корп. облигации',mmf:'чтобы догнать фонд денежного рынка'})[x.k]} <small>${nf(CALC.rates[x.k],2)}% до налога</small></div>
        <div class="bv num ${x.r>cur?'up':''}">${nf(x.r,2)}%<small>${x.r>cur?`на ${nf(x.r-cur,2)} п.п. выше лучших ставок (${nf(cur,2)}%)`:`ниже лучших ставок (${nf(cur,2)}%) — здесь вклад выигрывает`}</small></div></div>`).join('')}
      <div class="calc-note">Ставка вклада — без капитализации, как в индикаторе ЦБ; учитывает необлагаемую сумму процентов по вкладам. Облигации — ${({pay:'купоны выплачиваются',reinv:'купоны реинвестируются',iis:'на ИИС-3, без налога до 30 млн ₽ дохода'})[CALC.reinv]}.</div></div>`;
  }
  function calcBind(){
    const amt=$('c_amount'), tg=$('c_target');
    if(amt){ amt.addEventListener('input',ev=>{ const v=Number(ev.target.value.replace(/[^0-9]/g,''))||0; CALC.amount=v; store.set('calc_amount',String(v)); calcUpdate(); });
      amt.addEventListener('blur',ev=>{ ev.target.value=CALC.amount.toLocaleString('ru-RU'); }); }
    const md=$('c_mydep'); if(md) md.addEventListener('input',ev=>{ const v=parseFloat(ev.target.value.replace(',','.')); CALC.myDep=isNaN(v)?null:v; store.set('calc_mydep',isNaN(v)?'':String(v)); calcUpdate(); });
    if(tg){ tg.addEventListener('input',ev=>{ const v=Number(ev.target.value.replace(/[^0-9]/g,''))||0; CALC.target=v; store.set('calc_target',String(v)); calcUpdate(); });
      tg.addEventListener('blur',ev=>{ ev.target.value=CALC.target.toLocaleString('ru-RU'); }); }
    $('c_tax').addEventListener('change',ev=>{ CALC.tax=ev.target.checked; calcUpdate(); });
    $('c_reform').addEventListener('change',ev=>{ CALC.reform=ev.target.checked; store.set('calc_reform',CALC.reform?'1':'0'); calcUpdate(); });
    $('card_CALC').addEventListener('click',ev=>{
      const md=ev.target.closest('[data-cmode]'); if(md){ CALC.mode=md.dataset.cmode; store.set('calc_mode',CALC.mode); render(); return; }
      const rv=ev.target.closest('button[data-reinv]'); if(rv){ CALC.reinv=rv.dataset.reinv; store.set('calc_reinv',CALC.reinv); render(); return; }
      const b=ev.target.closest('.chips button[data-m]'); if(!b) return;
      CALC.months=Number(b.dataset.m); store.set('calc_months',String(CALC.months)); CALC.rates.ofz=defaultRatesFor(CALC.months).ofz; render(); });
    $('card_CALC').addEventListener('change',ev=>{ const i=ev.target.closest('input[data-rate]'); if(!i) return;
      const v=parseFloat(i.value.replace(',','.')); if(!isNaN(v)) CALC.rates[i.dataset.rate]=v; calcUpdate(); });
  }

  // ---------- «Сегодня»: то, что раньше приходило текстом под карточкой (docs/digest.json)
  const SEGS=[['details','📋 Подробно'],['news','📰 Новости'],['money','💰 Денежные события'],['placements','🆕 Размещения']];
  function mskToday(){ return new Date(Date.now()+3*3600e3).toISOString().slice(0,10); }
  async function loadDigest(force){
    try{ DIG=await fetch('digest.json?'+Date.now()).then(r=>{ if(!r.ok) throw 0; return r.json(); }); }catch(e){ DIG={missing:true}; }
    if(TAB==='today') render();
  }
  const ddmmIso = iso => iso ? iso.slice(8,10)+'.'+iso.slice(5,7) : '';
  function placementsHtml(P){
    if(!P) return `<div class="card empty">Источник размещений (bonds-lab.ru) сегодня не ответил.</div>`;
    const t=mskToday();
    if(!P.items.length) return `<div class="card empty">На ближайшие ${P.days} дней новых размещений нет${P.source_last?` — последние данные источника: сбор до ${ddmmIso(P.source_last)}`:''}.</div>`;
    const esc=x=>String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    return `<div class="plc">${P.items.map(p=>{ const past=p.book && p.book<t;
      return `<div class="card"><div class="when ${past?'past':''}">${p.book?(past?'сбор заявок прошёл '+ddmmIso(p.book):'сбор заявок до '+ddmmIso(p.book)):''}${p.place?' · размещение '+ddmmIso(p.place):''}</div>
        <div class="nm">${esc(p.name)}</div><div class="rt">${(p.ratings||[]).slice(0,3).map(r=>`<span>${esc(r)}</span>`).join('')||'<span>без рейтинга</span>'}</div>
        <div class="kv"><b>Купон</b><span>${esc(p.coupon&&!/позднее/i.test(p.coupon)?p.coupon:'уточняется')}${p.period?' · выплата раз в '+esc(p.period):''}</span><b>Объём</b><span>${esc(p.volume||'—')}</span>${p.maturity?`<b>Погашение</b><span>${esc(p.maturity)}</span>`:''}</div>
        ${p.note?`<div class="nt">${esc(p.note.slice(0,160))}</div>`:''}<a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--acc);font-weight:700;font-size:13px;text-decoration:none">подробнее на bonds-lab ↗</a></div>`; }).join('')}</div>
      <div class="note">Первичные размещения на ${P.days} дней вперёд — сбор заявок или дата размещения · источник bonds-lab.ru</div>`;
  }
  function todayHtml(){
    const seg=`<div class="seg">${SEGS.map(([k,n])=>`<button data-dseg="${k}" class="${DSEG===k?'on':''}">${n}</button>`).join('')}</div>`;
    if(!DIG) return seg+`<div class="card empty">Загружаю выпуск…</div>`;
    if(DIG.missing) return seg+`<div class="card empty">Выпуск появится после следующего утреннего дайджеста.</div>`;
    const d=new Date(DIG.date+'T00:00:00');
    const head=`<div class="dhead"><span>Выпуск ${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}, ${DIG.updated.slice(11)} МСК</span><button class="btnx" data-act="dreload">Обновить</button></div>`;
    const stale = DIG.date<mskToday() && new Date(Date.now()+3*3600e3).getUTCHours()<12
      ? `<div class="stale"><span>Свежий выпуск ещё публикуется — обычно это занимает 1–2 минуты после дайджеста.</span><button data-act="dreload">Обновить</button></div>` : '';
    let body;
    if(DSEG==='placements') body=placementsHtml(DIG.placements);
    else if(DSEG==='details') body=`<div class="dg">${DIG.details.map(b=>`<div class="card">${b.replace(/\n/g,'<br>').replace(/<pre>([\s\S]*?)<\/pre>/g,(m,x)=>'<pre>'+x.replace(/<br>/g,'\n')+'</pre>')}</div>`).join('')}</div>`;
    else { const h=DIG[DSEG]||''; body=`<div class="dg"><div class="card">${h.replace(/\n/g,'<br>')}</div></div>`; }
    return seg+stale+head+body;
  }

  // ---------- вкладки
  function render(){
    kill();
    document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
    let html='';
    if(TAB==='calc'){
      $('app').innerHTML=calcHtml(); calcUpdate(); calcBind(); return;
    }
    if(TAB==='today'){ $('app').innerHTML=todayHtml(); if(!DIG) loadDigest(); return; }
    if(TAB==='overview'){
      html = tilesRow(['KEY','DEP','USD','IMOEX'],true)
        + `<div class="grid2">${bigCard()}${perfCard()}</div>`
        + tableCard(null)
        + `<div class="grid2b">${ratesCard()}${curveCard()}</div>`;
    } else {
      const ks=TAB_SERIES[TAB].filter(has);
      if(!ks.includes(SEL)) SEL=ks[0];
      html = tilesRow(ks.slice(0,4),TAB==='rates') + bigCard() + `<div class="gap"></div>`;
      if(ks.length>4) html += tilesRow(ks.slice(4),false);
      if(TAB==='rates') html += `<div class="grid2b">${ratesCard()}${perfCard()}</div>`;
      if(TAB==='bonds') html += `<div class="grid2b">${curveCard()}${perfCard()}</div>`;
      html += tableCard(ks,'Таблица');
    }
    $('app').innerHTML=html;
    document.querySelectorAll('.tile').forEach(t=>spark($('sp_'+t.dataset.k),t.dataset.k,t.classList.contains('hero')?'#ffffff':null));
    if($('big')) bigChart($('big'),SEL);
    document.querySelectorAll('tbody tr[data-k]').forEach(tr=>spark($('ts_'+tr.dataset.k),tr.dataset.k));
    if($('ratesCmp')) multiChart($('ratesCmp'),[['KEY','Ключевая',1],['DEP','Вклады топ-10',1],['RGBI_Y','ОФЗ',0],['CORP_Y','Корп.',0]]
      .filter(([k])=>has(k)).map(([k,l,st])=>({label:l,step:st,data:slice(k).map(([x,y])=>({x,y}))})));
    if($('curve')) multiChart($('curve'),Object.entries(DATA.curves||{}).map(([lab,c])=>({label:`${lab} (${fmtD(D(c.date))})`,data:c.points.map(([x,y])=>({x,y}))})),false);
  }

  // ---------- события
  document.addEventListener('click',e=>{
    const ds=e.target.closest('[data-dseg]'); if(ds){ DSEG=ds.dataset.dseg; store.set('dseg',DSEG); render(); window.scrollTo({top:0}); return; }
    const dr=e.target.closest('[data-act="dreload"]'); if(dr){ DIG=null; render(); loadDigest(); return; }
    const tabBtn=e.target.closest('[data-tab]'); if(tabBtn){ TAB=tabBtn.dataset.tab; FOCUS=null; store.set('tab',TAB); render(); window.scrollTo({top:0}); return; }
    const r=e.target.closest('.rng button'); if(r){ RANGE=r.dataset.r; store.set('range',RANGE); render(); return; }
    const th=e.target.closest('th[data-s]'); if(th){ const s=th.dataset.s; if(sortKey===s && s!=='group') sortAsc=!sortAsc; else {sortKey=s; sortAsc=false;} render(); return; }
    const sel=e.target.closest('.tile[data-k], tbody tr[data-k]');
    if(sel){ SEL=sel.dataset.k; FOCUS=null; store.set('sel',SEL); render(); const b=$('bigCard'); if(b) b.scrollIntoView({behavior:'smooth',block:'center'}); }
  });
  $('themeBtn').addEventListener('click',()=>{
    const dark=tok('--bg')==='#0c111d'; const t=dark?'light':'dark';
    document.documentElement.dataset.theme=t; store.set('theme',t); if(DATA) render();
  });
  $('tabs').innerHTML=TABS.map(t=>`<button class="tab" data-tab="${t.id}">${t.name}</button>`).join('')+
    `<a class="tab" href="bonds.html" style="text-decoration:none;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff">Подбор облигаций ↗</a>`;
  $('bnav').innerHTML=TABS.map(t=>`<button data-tab="${t.id}"><i>${t.icon}</i>${t.name}</button>`).join('');

  // ---------- переход по кнопке из Telegram: #IMOEX, #USD, #CURVE, #RATES, #PERF ...
  // кнопки из Telegram: ?v=details|news|money|placements|overview|calc|rates|CNY|CURVE… (якорь «#» Telegram затирает своими данными)
  function applyHash(){
    const qv=(new URLSearchParams(location.search).get('v')||'');
    const hv=(location.hash||'').replace('#',''); 
    let h=(qv || (hv.startsWith('tgWebApp')?'':hv)); if(!h||!DATA) return false;
    const lv=h.toLowerCase();
    if(SEGS.some(([k])=>k===lv)){ TAB='today'; DSEG=lv; render(); return true; }
    if(TABS.some(t=>t.id===lv) && !TAB_SERIES[lv]?.includes?.(h.toUpperCase())){ TAB=lv; render(); return true; }
    h=h.toUpperCase();
    const special={CURVE:['bonds','card_CURVE'],RATES:['rates','card_RATES'],PERF:['overview','card_PERF'],CALC:['calc','card_CALC']};
    let target;
    if(special[h]){ TAB=special[h][0]; FOCUS=h; target=special[h][1]; }
    else if(has(h)){ SEL=h; FOCUS=h; TAB=Object.keys(TAB_SERIES).find(t=>TAB_SERIES[t].includes(h))||'overview'; target='bigCard'; }
    else return false;
    render(); setTimeout(()=>{const el=$(target); if(el) el.scrollIntoView({block:'center'});},80);
    return true;
  }
  window.addEventListener('hashchange',applyHash);

  // ---------- внутри Telegram (кнопка «Дашборд» открывает страницу прямо в чате)
  const TG = window.Telegram && window.Telegram.WebApp;
  if(TG && TG.initData!==undefined && TG.platform && TG.platform!=='unknown'){
    try{ TG.ready(); TG.expand(); if(!store.get('theme','') && TG.colorScheme==='dark') document.documentElement.dataset.theme='dark'; }catch(e){}
  }

  fetch('data.json?'+Date.now()).then(r=>r.json()).then(j=>{
    DATA=j;
    const [d,t]=j.updated.split(' ');
    $('upd').textContent='Обновлено '+new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+', '+t+' МСК';
    $('note').textContent='Обновлено '+new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+', '+t+' МСК · '+$('note').textContent;
    if(!applyHash()) render();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(!FOCUS) render(); else applyHash(); });
  }).catch(()=>{ $('app').innerHTML='<div class="card empty">Данные ещё не готовы: они появятся после первого запуска дайджеста.</div>'; $('upd').textContent=''; });
})();
</script>
</body>
</html>
