:root{
  color-scheme: light;
  --bg:#f4f0e8; --card:#fcfaf6; --line:#e5ded1; --soft:#efe9de;
  --ink:#16202b; --ink2:#5d6670; --ink3:#8f969d;
  --acc:#1b2f45; --acc2:#1b2f45; --act:#8f6e3c; --act-ink:#fff; --navy:#1b2f45; --navy2:#26405c; --mint:#9fe0c4;
  --up:#2d6a4f; --down:#a3392b; --warn:#9a5a12;
  --s1:#1b2f45; --s2:#8f6e3c; --s3:#2d6a4f; --s4:#b98a3c;
  --shadow:none; --lift:0 12px 36px rgba(22,32,43,.16);
  --nav:#1b2f45; --navink:#ffffff;
  --disp:Literata,Georgia,serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0f151c; --card:#171f28; --line:#26313d; --soft:#1e2833;
    --ink:#ece7de; --ink2:#a7adb3; --ink3:#737b83;
    --acc:#a9c1db; --acc2:#a9c1db; --act:#b48d55; --navy:#1b2f45; --navy2:#26405c; --mint:#9fe0c4;
    --up:#6cbf94; --down:#e07a6b; --warn:#d9a05b;
    --s1:#a9c1db; --s2:#b48d55; --s3:#6cbf94; --s4:#d9b26a; --lift:0 12px 36px rgba(0,0,0,.5); --nav:#171f28; --navink:#ece7de;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f151c; --card:#171f28; --line:#26313d; --soft:#1e2833;
    --ink:#ece7de; --ink2:#a7adb3; --ink3:#737b83;
    --acc:#a9c1db; --acc2:#a9c1db; --act:#b48d55; --navy:#1b2f45; --navy2:#26405c; --mint:#9fe0c4;
    --up:#6cbf94; --down:#e07a6b; --warn:#d9a05b;
    --s1:#a9c1db; --s2:#b48d55; --s3:#6cbf94; --s4:#d9b26a; --lift:0 12px 36px rgba(0,0,0,.5); --nav:#171f28; --navink:#ece7de;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 110px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hello{color:var(--ink2);font-size:14px;font-weight:500}
h1{font-size:28px;font-weight:800;margin:2px 0 0;letter-spacing:-.01em}
.upd{color:var(--ink2);font-size:13px;font-weight:500}
.icon-btn{border:0;background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);cursor:pointer;font-size:16px}
.top-right{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:8px;margin:4px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:14px;background:var(--card);color:var(--ink2);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.tab.on{background:var(--ink);color:var(--card)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card.focus{outline:2px solid var(--acc);outline-offset:-2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.tile{cursor:pointer;transition:transform .12s ease}
.tile:hover{transform:translateY(-2px)}
.tile.sel{outline:2px solid var(--acc);outline-offset:-2px}
.tile .l{font-size:13px;color:var(--ink2);font-weight:600}
.tile .v{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.01em;line-height:1.1}
.tile .c{font-size:13px;margin-top:4px;color:var(--ink2);font-weight:600}
.tile .sp{height:46px;margin-top:10px;position:relative}
.tile.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.tile.hero.sel{outline-color:#fff}
.tile.hero .l,.tile.hero .c,.tile.hero .c span{color:rgba(255,255,255,.9)!important}
.up{color:var(--up)}.down{color:var(--down)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;align-items:start}
.big .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.big .l{font-size:14px;color:var(--ink2);font-weight:600}
.big .v{font-size:32px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
.big .c{font-size:13px;color:var(--ink2);font-weight:600;margin-top:2px}
.big .cv{height:320px;margin-top:12px;position:relative}
.rng{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:12px}
.rng button{border:0;background:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--ink2);padding:6px 10px;border-radius:9px;cursor:pointer}
.rng button.on{background:var(--ink);color:var(--card)}
h2{font-size:17px;font-weight:800;margin:0}
.sub{font-size:12.5px;color:var(--ink2);font-weight:500;margin:2px 0 12px}
.bars .row{padding:10px 0;border-bottom:1px solid var(--line)}
.bars .row:last-child{border:0}
.bars .top{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.bars .row.hl .top span:first-child{font-weight:800}
.bars .track{height:8px;border-radius:4px;background:var(--soft);margin-top:7px;overflow:hidden;position:relative}
.bars .track i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--acc)}
.bars .track i.neg{background:var(--down)}
.bars .row.hl .track i{background:var(--s2)}
.cv2{height:250px;position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--ink2);font-size:12px;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th:first-child,td:first-child{text-align:left}
th.sorted::after{content:" ↓"}th.sorted.asc::after{content:" ↑"}
td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:600}
td:first-child{font-weight:700;white-space:normal}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--soft)}
tr:last-child td{border:0}
.ts{width:96px;height:28px;position:relative;display:inline-block;vertical-align:middle}
.grp td{background:none!important;color:var(--ink3);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-top:16px;cursor:default}
.note{font-size:12px;color:var(--ink3);margin-top:22px;text-align:center}
.bnav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--nav);color:var(--navink);border-radius:20px;display:none;justify-content:space-around;padding:9px 4px;z-index:10;box-shadow:0 8px 30px rgba(16,24,40,.25)}
.bnav button{border:0;background:none;color:inherit;font:inherit;font-size:10.5px;font-weight:700;opacity:.55;text-align:center;cursor:pointer;padding:2px 1px;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnav button.on{opacity:1}.bnav i{display:block;font-style:normal;font-size:18px;line-height:1.3}
.empty{padding:40px;text-align:center;color:var(--ink2)}
/* сегодня: выпуск дайджеста */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.seg button{border:0;background:var(--card);color:var(--ink2);font:inherit;font-weight:800;font-size:14px;padding:10px 14px;border-radius:14px;cursor:pointer;box-shadow:var(--shadow)}
.seg button.on{background:var(--ink);color:var(--card)}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.dg .card{font-size:14.5px;line-height:1.55}
.dg .card pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0 0;overflow-x:auto;white-space:pre}
.dg .card blockquote{margin:10px 0 0;padding:0;border:0}
.dg .card a{color:var(--acc);text-decoration:none;font-weight:600}
.dg .card i{color:var(--ink2)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 12px;color:var(--ink2);font-size:13px;font-weight:600}
.stale{background:color-mix(in srgb,var(--s2) 14%,var(--card));border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.stale button,.btnx{border:0;background:var(--ink);color:var(--card);font:inherit;font-weight:800;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer}
.plc{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.plc .card{display:flex;flex-direction:column;gap:6px}
.plc .nm{font-weight:800;font-size:16px}
.plc .rt{display:flex;gap:5px;flex-wrap:wrap}.plc .rt span{font-size:11.5px;font-weight:800;background:var(--soft);border-radius:8px;padding:3px 7px;color:var(--ink2)}
.plc .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}.plc .kv b{color:var(--ink2);font-weight:600}
.plc .when{font-weight:800;font-size:13px;color:var(--acc)}.plc .when.past{color:var(--ink3)}
.plc .nt{font-size:12.5px;color:var(--ink2)}
/* калькулятор */
.cmodes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 16px}
.cmodes button{border:0;text-align:left;background:var(--soft);color:var(--ink);font:inherit;padding:12px 14px;border-radius:16px;cursor:pointer}
.cmodes button b{display:block;font-size:15px;font-weight:800}.cmodes button span{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:2px}
.cmodes button.on{background:var(--ink);color:var(--card)}.cmodes button.on span{color:var(--card);opacity:.75}
.cset{margin-top:14px}.cset summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--ink2)}
.rates-ed{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.rates-ed label{font-size:12px;color:var(--ink2);font-weight:700}.rates-ed input{width:100%;margin-top:4px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-weight:800;font-size:15px}
.cres .clead{font-size:16px;font-weight:700;margin-bottom:10px}.cres .clead2{font-size:15px;font-weight:600;margin-top:12px}
.lose-big{font-size:34px;font-weight:800;color:var(--down);margin:2px 0 10px}.lose-big span{display:block;font-size:13px;font-weight:600;color:var(--ink2)}
.cbar{display:grid;grid-template-columns:minmax(150px,1.1fr) 2fr minmax(120px,auto);gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cbar:last-of-type{border-bottom:0}
.cbar .cn{font-weight:800}.cbar .cn small,.beat .cn small{display:block;font-weight:600;color:var(--ink3);font-size:12px}
.cbar .ct{height:12px;border-radius:7px;background:var(--soft);overflow:hidden}.cbar .ct i{display:block;height:100%;border-radius:7px;background:var(--ink3)}
.cbar.best .ct i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.cbar .cv{text-align:right;font-weight:800;font-size:18px}.cbar .cv small{display:block;font-size:12px;font-weight:600;color:var(--ink2)}
.cbar .win{font-size:11px;font-weight:800;color:var(--card);background:var(--up);border-radius:6px;padding:2px 6px;margin-left:4px;vertical-align:middle}
.beat{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.beat .cn{font-weight:800}.beat .bv{text-align:right;font-weight:800;font-size:22px}.beat .bv small{display:block;font-size:12px;font-weight:600;color:var(--ink2);max-width:260px}
@media (max-width:640px){.cmodes{grid-template-columns:1fr}.rates-ed{grid-template-columns:1fr 1fr}.cbar{grid-template-columns:1fr auto;gap:6px 10px}.cbar .ct{grid-column:1/-1;order:3}.cbar .cv{font-size:16px}.beat .bv{font-size:19px}}
.calc-in{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:end}
.fld label{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.fld input{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:22px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:0;background:var(--soft);color:var(--ink2);font:inherit;font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--card)}
.tax{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--ink2);font-weight:600}
.res{margin-top:6px}
.rrow{display:grid;grid-template-columns:1.6fr .8fr 1fr 1fr 1fr 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border:0}
.rrow.head{font-size:12px;color:var(--ink2);font-weight:600;padding-top:0}
.rrow .nm{font-weight:800}.rrow .nm small{display:block;font-weight:500;color:var(--ink3);font-size:11.5px}
.rrow input{width:72px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:6px 8px;font:inherit;font-weight:700;text-align:right}
.rrow .r{text-align:right;font-weight:700}
.rrow .best{color:var(--up)}
.rrow.wide{grid-template-columns:1.6fr .8fr 1fr 1fr 1fr 1fr 1fr}
.calc-note{font-size:12px;color:var(--ink3);margin-top:12px;line-height:1.5}
.calc-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.calc-sum .card{padding:14px 16px}
.calc-sum .l{font-size:12.5px;color:var(--ink2);font-weight:600}
.calc-sum .v{font-size:22px;font-weight:800;margin-top:4px}
.calc-sum .c{font-size:12.5px;color:var(--ink2);font-weight:600;margin-top:2px}
@media (max-width:860px){.calc-sum{grid-template-columns:1fr 1fr}}
@media (max-width:640px){
  .calc-in{grid-template-columns:1fr}
  .rrow,.rrow.wide{grid-template-columns:1fr 1fr;gap:4px 10px}
  .rrow.head{display:none}
  .rrow .nm{grid-column:1/-1}
  .rrow .r::before{content:attr(data-l);display:block;font-size:11px;color:var(--ink3);font-weight:600}
  .rrow .r{text-align:left}
}
.gap{height:14px}
@media (max-width:860px){
  .tiles{grid-template-columns:1fr 1fr}
  .grid2,.grid2b{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{padding:16px 14px 110px}
  h1{font-size:24px}
  .tabs{display:none}.bnav{display:flex}
  .tile .v{font-size:23px}
  .card{padding:16px;border-radius:20px}
  .big .cv{height:240px}.big .v{font-size:27px}
  .hide-m{display:none}
  .ts{width:64px}
  .top-right .upd{display:none}
}
.ych summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ych summary::-webkit-details-marker{display:none}.ych summary span{font-size:12.5px;color:var(--ink2);font-weight:600}
.ych summary::after{content:"▸";color:var(--ink3)}.ych[open] summary::after{transform:rotate(90deg)}
.ycg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.ycl{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px}.ycl b{color:var(--ink);margin-left:4px}.ycl span{margin-left:6px;font-size:12px}
.ycv{height:170px;position:relative}
.ycl .muted{color:var(--ink3)}

/* ===== «Кабинет» (как на странице облигаций): бумажный фон, Onest для текста, Literata для чисел и заголовков ===== */
body{font-family:Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);font-weight:500;letter-spacing:-.01em}
.card,.tile,.icon-btn,.tab,.seg button{box-shadow:none}
.tab.on{background:var(--navy)!important;color:#fff!important}
.tile.hero{background:var(--navy);color:#fff}
.tile .v,.big .v{font-family:var(--disp);font-weight:500;letter-spacing:-.02em}
.cbar.best .ct i{background:var(--act)}
.grp td{text-transform:none;letter-spacing:0;font-size:12.5px}
.bnav{box-shadow:var(--lift)}
.btn.acc,.acc-btn{background:var(--act);color:#fff}
.tabs .tab[data-tab=calc]{background:var(--act);color:#fff}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
/* полоса недели */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 8px}
.wk button{border:0;background:var(--card);color:var(--ink);font:inherit;border-radius:14px;padding:8px 2px 9px;cursor:pointer;text-align:center;min-width:0}
.wk button small{display:block;font-size:11px;color:var(--ink2);font-weight:600;text-transform:lowercase}
.wk button b{display:block;font:500 19px var(--disp);margin:1px 0 4px}
.wk button.off{opacity:.45}.wk button.on{background:var(--navy);color:#fff}.wk button.on small{color:#c9d3de}
.wk .dots{display:flex;gap:3px;justify-content:center;min-height:7px}
.wk .dots i{width:7px;height:7px;border-radius:50%}
:is(.wk,.wkl) .cbr{background:#2f6db0}:is(.wk,.wkl) .div{background:#b48d55}:is(.wk,.wkl) .book{background:#2d6a4f}:is(.wk,.wkl) .auc{background:#8f969d}:is(.wk,.wkl) .macro{background:#c8b99a}
.wkl{background:var(--card);border-radius:16px;padding:6px 14px;margin:0 0 14px;font-size:14px}
.wkl div{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.wkl div:last-child{border:0}.wkl i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.wkl .muted{color:var(--ink2);padding:10px 0}
/* тепловая карта акций */
.hm{position:relative;height:420px;border-radius:14px;overflow:hidden;background:var(--soft)}
.hm .c{position:absolute;box-sizing:border-box;border:1.5px solid var(--card);padding:5px 6px;overflow:hidden;color:#fff;font-size:12px;line-height:1.15;cursor:default}
.hm .c b{display:block;font-weight:700}.hm .c span{opacity:.95}
.hm .sec{position:absolute;box-sizing:border-box;border:2px solid var(--card);pointer-events:none}
.hm .sec em{position:absolute;left:5px;right:4px;top:1px;font-style:normal;font-size:10px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmleg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}.hmleg .inst{margin-left:auto}
.hmleg .sc{display:flex;gap:2px}.hmleg .sc i{width:22px;height:8px;border-radius:2px}
@media (max-width:640px){.hm{height:520px}.hm .c{font-size:10.5px;padding:3px 4px}}

/* ===== «Мои цифры», истории «Утро за 30 секунд», режим встречи ===== */
.mine{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding-bottom:2px}
.mine::-webkit-scrollbar{display:none}
.mine button{flex:0 0 auto;border:0;background:var(--card);color:var(--ink);font:inherit;border-radius:16px;padding:10px 14px;text-align:left;cursor:pointer;min-width:118px}
.mine button small{display:block;font-size:11.5px;color:var(--ink2);font-weight:600}
.mine button b{display:block;font:500 20px var(--disp);margin-top:2px;letter-spacing:-.01em}
.mine button em{font-style:normal;font-size:12px;font-weight:600}
.mine .ed{min-width:auto;background:var(--soft);color:var(--ink2);font-weight:700;font-size:13px;display:flex;align-items:center}
.hdbtn{border:0;background:var(--card);color:var(--ink);height:38px;border-radius:12px;padding:0 13px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.hdbtn.go{background:var(--navy);color:#fff}
.ov{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.ov[hidden]{display:none}
.ovx{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:3;border:0;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.08);color:inherit;font-size:16px;cursor:pointer}
/* истории */
.st{color:var(--ink)}
.st .bars{display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top)) 60px 0 14px}
.st .bars i{flex:1;height:3px;border-radius:2px;background:color-mix(in srgb,var(--ink) 18%,transparent);overflow:hidden;position:relative}
.st .bars i b{position:absolute;inset:0;width:0;background:var(--ink)}
.st .bars i.done b{width:100%}
.st .bars i.cur b{animation:stbar 7s linear forwards}
.st.paused .bars i.cur b{animation-play-state:paused}
@keyframes stbar{from{width:0}to{width:100%}}
.st .scr{flex:1;overflow:auto;padding:22px 22px 40px;max-width:640px;width:100%;margin:0 auto}
.st .k{font-size:13px;color:var(--ink2);font-weight:600;letter-spacing:.02em}
.st h2{font:500 30px/1.15 var(--disp);margin:6px 0 18px}
.st .li{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:16px}
.st .li:last-child{border:0}.st .li b{font:500 20px var(--disp);white-space:nowrap}
.st .li small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.st .tx{font-size:17px;line-height:1.5;padding:9px 0;border-bottom:1px solid var(--line)}
.st .tx:last-child{border:0}
.st .lvl{border-radius:24px;padding:22px 20px;margin-bottom:16px}
.st .lvl .w{font:500 40px/1.05 var(--disp);display:flex;align-items:center;gap:12px}
.st .lvl .w i{width:16px;height:16px;border-radius:50%;background:currentColor;display:inline-block}
.st .lvl ul{margin:12px 0 0;padding-left:20px;font-size:16px;line-height:1.5;color:var(--ink)}
.st .l0{background:color-mix(in srgb,var(--up) 14%,var(--card));color:var(--up)}
.st .l1{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}
.st .l2{background:color-mix(in srgb,var(--down) 15%,var(--card));color:var(--down)}
.st .big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st .big3 div{background:var(--card);border-radius:18px;padding:12px}
.st .big3 small{display:block;font-size:12px;color:var(--ink2);font-weight:600}
.st .big3 b{font:500 22px var(--disp)}
.st .qa{background:var(--card);border-radius:20px;padding:18px;font-size:17px;line-height:1.5}
.st .qa b{display:block;font:500 21px/1.25 var(--disp);margin-bottom:8px}
.st .tap{position:absolute;top:60px;bottom:0;width:32%;z-index:2}
.st .tap.l{left:0}.st .tap.r{right:0}
.st .foot{padding:0 22px calc(18px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;position:relative;z-index:3}
.st .foot button{border:0;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:11px 16px;border-radius:14px;cursor:pointer}
.st svg.sl{width:84px;height:26px;vertical-align:middle;margin-left:8px}
/* режим встречи */
.mt{overflow:auto}
.mt .in{max-width:1100px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 40px;width:100%}
.mt h1{font:500 30px var(--disp);margin:0 0 4px}.mt .dt{color:var(--ink2);font-size:14px;margin-bottom:18px}
.mt .g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mt .c{background:var(--card);border-radius:22px;padding:18px}
.mt .c small{display:block;font-size:13.5px;color:var(--ink2);font-weight:600}
.mt .c b{display:block;font:500 40px/1.1 var(--disp);margin-top:6px;letter-spacing:-.02em}
.mt .c em{font-style:normal;font-size:13px;color:var(--ink2)}
.mt .c.n{background:var(--navy);color:#fff}.mt .c.n small,.mt .c.n em{color:#c9d3de}
.mt .w2{grid-column:span 2}.mt .w4{grid-column:1/-1}
.mt .cmp{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:baseline;font-size:17px;margin-top:10px}
.mt .cmp b{font:500 24px var(--disp);display:inline;margin:0;text-align:right}
.mt .cv{height:280px;position:relative;margin-top:8px}
@media (max-width:860px){.mt .g{grid-template-columns:1fr 1fr}.mt .c b{font-size:32px}.mt .cmp{font-size:15px}.mt .cmp b{font-size:19px;white-space:nowrap}}
.mine-ed{position:fixed;inset:auto 0 0 0;z-index:110;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--lift);max-height:80vh;overflow:auto}
.mine-ed h3{font:500 20px var(--disp);margin:0 0 4px}.mine-ed .sub{margin-bottom:10px}
.mine-ed label{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-weight:600}
.mine-ed label input{width:20px;height:20px;accent-color:var(--navy)}
.mine-ed .row{display:flex;gap:8px;margin-top:12px}
.mine-ed .row button{flex:1;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;cursor:pointer;background:var(--soft);color:var(--ink)}
.mine-ed .row button.go{background:var(--navy);color:#fff}
.inst{border:0;background:none;color:var(--acc);font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:underline}

<body>
<div class="wrap">
  <header>
    <div><div class="hello" id="hello">Доброе утро</div><h1>Рынки сегодня</h1></div>
    <div class="top-right"><div class="upd num" id="upd">загрузка…</div><button class="hdbtn go" id="storyBtn" title="Утро за 30 секунд">▶ Утро</button><button class="hdbtn" id="meetBtn" title="Экран для клиента на встрече">Встреча</button><button class="icon-btn" id="themeBtn" title="Светлая / тёмная тема">◐</button></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="app"><div class="card empty">Загружаю данные…</div></div>
  <div class="note" id="note">Источники: Банк России, Московская биржа, Yahoo Finance · обновляется каждое утро · справочная информация, не инвестиционная рекомендация</div>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="ov st" id="story" hidden></div>
<div class="ov mt" id="meet" hidden></div>
<div id="mineEd" hidden></div>
<script>
(function(){
  const USER_NAME = 'Максим';           // имя в приветствии; можно оставить пустым ''
  const TABS = [
    {id:'today', name:'Сегодня', icon:'☀'},
    {id:'overview', name:'Обзор', icon:'◎'},
    {id:'rates', name:'Ставки', icon:'%'},
    {id:'bonds', name:'Облигации', icon:'◫'},
    {id:'fx', name:'Валюты', icon:'₽'},
    {id:'markets', name:'Рынки', icon:'↗'},
    {id:'calc', name:'Подбор ↗', icon:'⚖'},     // одна дверь на страницу облигаций (Старт: сравнение с вкладом, подбор, портфель)
  ];
  const TAB_SERIES = {
    rates:['KEY','DEP','RUSFARCNY','RUONIA'],
    bonds:['RGBITR','RUCBTRNS','RGBI_Y','CORP_Y'],
    fx:['USD','CNY','EUR'],
    markets:['IMOEX','BRENT','GOLD','BTC','UST10'],
  };
  const SHORT = {KEY:'Ключевая ставка',DEP:'Вклады, топ-10',RUONIA:'RUONIA',RUSFAR:'RUSFAR O/N',RUSFARCNY:'RUSFAR CNY',
    RGBITR:'ОФЗ с купонами',RUCBTRNS:'Корп. облигации',RGBI_Y:'Доходность ОФЗ',CORP_Y:'Доходность корп.',
    USD:'Доллар, ₽',EUR:'Евро, ₽',CNY:'Юань, ₽',IMOEX:'Индекс Мосбиржи',BRENT:'Нефть Brent, $',GOLD:'Золото, $',BTC:'Bitcoin, $',UST10:'UST 10Y'};
  const STEP = new Set(['KEY','DEP']);
  const FONT = 'Onest, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  Chart.defaults.font.family = FONT;
  const RANGES = [['1m','1М'],['3m','3М'],['ytd','YTD'],['1y','1Г'],['3y','3Г']];

  const $ = id => document.getElementById(id);
  const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const nf = (v,d=2) => v==null||isNaN(v) ? '—' : (v+(v>=0?1e-9:-1e-9)).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
  const sg = (v,d=1,s='%') => v==null||isNaN(v) ? '—' : (v>0?'+':v<0?'−':'')+nf(Math.abs(v),d)+s;
  const cls = v => v>0?'up':v<0?'down':'';
  const clsK = (k,v) => isRate(k) ? '' : cls(v);   // ставки: без «хорошо/плохо», нейтральный цвет
  const D = s => new Date(s+'T00:00:00').getTime();
  const fmtD = t => new Date(t).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});
  const store = {get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

  let DATA=null, TAB=store.get('tab','overview'), RANGE=store.get('range','ytd'), SEL=store.get('sel','IMOEX');
  let charts=[], sortKey='group', sortAsc=false, FOCUS=null, DIG=null, DSEG=store.get('dseg','details');
  const t0 = store.get('theme',''); if(t0) document.documentElement.dataset.theme=t0;

  const hr=new Date().getHours();
  $('hello').textContent=(hr<5?'Доброй ночи':hr<12?'Доброе утро':hr<18?'Добрый день':'Добрый вечер')+(USER_NAME?', '+USER_NAME:'');

  // ---------- данные
  const has = k => !!(DATA.series[k] && DATA.series[k].data.length);
  const isRate = k => (DATA.series[k]||{}).unit==='%';
  const lastDate = () => D(DATA.updated.slice(0,10));
  const pts = k => DATA.series[k].data.map(([d,v])=>[D(d),v]);
  function startOf(r){ const d=new Date(lastDate());
    if(r==='ytd') return new Date(d.getFullYear()-1,11,31).getTime();
    const m={'1m':1,'3m':3,'1y':12,'3y':36}[r]; d.setMonth(d.getMonth()-m); return d.getTime(); }
  function slice(k,r=RANGE){ const p=pts(k); const from=startOf(r);
    const i=p.findIndex(x=>x[0]>from); if(i<0) return p.slice(-1); return p.slice(Math.max(0,i-1)); }
  const last = k => { const p=DATA.series[k].data; return p[p.length-1][1]; };
  function valueAt(k,t){ let v=null; for(const [d,x] of pts(k)){ if(d<=t) v=x; else break; } return v; }
  function chg(k,from){ const b=valueAt(k,from), l=last(k); if(b==null) return null; return isRate(k)? l-b : (l/b-1)*100; }
  const chgR = (k,r=RANGE) => chg(k,startOf(r));
  const chgDays = (k,days) => chg(k,lastDate()-days*864e5);
  function chg1d(k){ const p=DATA.series[k].data; if(p.length<2) return null; const a=p[p.length-2][1], b=p[p.length-1][1]; return isRate(k)? b-a : (b/a-1)*100; }
  function depAccrual(r=RANGE){ if(!has('DEP')) return null; const p=pts('DEP'), from=startOf(r), to=lastDate(); let acc=1;
    for(let i=0;i<p.length;i++){ const a=Math.max(p[i][0],from), b=Math.min(i+1<p.length?p[i+1][0]:to,to); if(b>a) acc*=1+p[i][1]/100*(b-a)/(365*864e5); }
    return (acc-1)*100; }
  const fmtVal = k => { const v=last(k); return isRate(k)? nf(v,2)+'%' : nf(v, v>1000?0:2); };
  const fmtChg = (k,c) => sg(c, isRate(k)?2:1, isRate(k)?' п.п.':'%');
  const rangeName = () => ({'1m':'за месяц','3m':'за 3 месяца','ytd':'с начала года','1y':'за год','3y':'за 3 года'})[RANGE];

  // ---------- графики
  function kill(){ charts.forEach(c=>c.destroy()); charts=[]; }
  function hex(c){ c=c.trim(); return c.length===4 ? '#'+[...c.slice(1)].map(x=>x+x).join('') : c; }
  function grad(ctx,color,h){ const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,hex(color)+'38'); g.addColorStop(1,hex(color)+'00'); return g; }
  function spark(canvas,k,color){
    if(!canvas) return;
    const p=slice(k); const up=p[p.length-1][1]>=p[0][1];
    const col=hex(color || (isRate(k)?tok('--acc'):(up?tok('--up'):tok('--down'))));
    charts.push(new Chart(canvas,{type:'line',data:{datasets:[{data:p.map(([x,y])=>({x,y})),borderColor:col,borderWidth:1.8,pointRadius:0,
      fill:true,backgroundColor:grad(canvas.getContext('2d'),col,60),tension:STEP.has(k)?0:.3,stepped:STEP.has(k)?'before':false}]},
      options:{responsive:true,maintainAspectRatio:false,animation:false,parsing:false,events:[],
        plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{type:'linear',display:false,min:p[0][0],max:p[p.length-1][0]},y:{display:false}}}}));
  }
  function axisOpts(unit,time=true){
    const ink2=tok('--ink2'), grid=tok('--line'), font={family:FONT,weight:'600',size:11};
    return {responsive:true,maintainAspectRatio:false,animation:false,parsing:false,normalized:true,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:tok('--card'),titleColor:tok('--ink'),bodyColor:tok('--ink'),borderColor:grid,borderWidth:1,
        padding:10,cornerRadius:12,titleFont:{family:FONT,weight:'700'},bodyFont:{family:FONT,weight:'600'},boxPadding:4,
        callbacks:{title:it=>it.length?(time?fmtD(it[0].parsed.x):('срок '+it[0].parsed.x+' л')):'',
                   label:c=>' '+(c.dataset.label?c.dataset.label+': ':'')+nf(c.parsed.y,2)+(unit==='%'?'%':unit&&unit!=='пт'?' '+unit:'')}}},
      scales:{x:{type:'linear',min:time?startOf(RANGE):undefined,max:time?lastDate():undefined,grid:{display:false},border:{display:false},
                 ticks:{color:ink2,maxTicksLimit:6,font,callback:v=>time?fmtD(v).slice(0,5):v+' л'}},
              y:{position:'right',grid:{color:grid},border:{display:false},ticks:{color:ink2,maxTicksLimit:5,font,callback:v=>nf(v,Math.abs(v)<50?1:0)}}}};
  }
  function bigChart(canvas,k){
    const p=slice(k), up=p[p.length-1][1]>=p[0][1], col=hex(isRate(k)?tok('--acc'):(up?tok('--up'):tok('--down')));
    charts.push(new Chart(canvas,{type:'line',data:{datasets:[{label:SHORT[k]||k,data:p.map(([x,y])=>({x,y})),borderColor:col,borderWidth:2.2,pointRadius:0,
      pointHoverRadius:5,pointHoverBorderWidth:2,pointHoverBorderColor:tok('--card'),pointHoverBackgroundColor:col,
      fill:true,backgroundColor:grad(canvas.getContext('2d'),col,320),tension:STEP.has(k)?0:.25,stepped:STEP.has(k)?'before':false}]},
      options:axisOpts(DATA.series[k].unit)}));
  }
  function multiChart(canvas,list,time=true,unit='%'){
    const cols=[tok('--s1'),tok('--s2'),tok('--s3'),tok('--s4')];
    const o=axisOpts(unit,time);
    o.plugins.legend={display:true,position:'bottom',labels:{color:tok('--ink2'),usePointStyle:true,pointStyle:'circle',boxWidth:7,boxHeight:7,font:{family:FONT,weight:'600',size:12}}};
    if(!time) o.interaction={mode:'nearest',intersect:false};
    charts.push(new Chart(canvas,{type:'line',data:{datasets:list.map((s,i)=>({label:s.label,data:s.data,borderColor:cols[i],backgroundColor:cols[i],borderWidth:2.2,
      pointRadius:time?0:3,tension:time?0:.3,stepped:s.step?'before':false}))},options:o}));
  }

  // ---------- блоки
  function tile(k,hero){
    const c=chgR(k);
    return `<div class="card tile${hero?' hero':''}${k===SEL?' sel':''}" data-k="${k}"><div class="l">${SHORT[k]||k}</div>`+
      `<div class="v num">${fmtVal(k)}</div><div class="c num"><span class="${clsK(k,c)}">${fmtChg(k,c)}</span> ${rangeName()}</div>`+
      `<div class="sp"><canvas id="sp_${k}"></canvas></div></div>`;
  }
  const tilesRow = (keys,heroFirst) => `<div class="tiles">${keys.filter(has).map((k,i)=>tile(k,heroFirst&&i===0)).join('')}</div>`;
  function bigCard(){

  function squarify(items,x,y,w,h){

    let rest=items.slice(), X=x, Y=y, W=w, H=h;
    while(rest.length){

      let row=[], best=Infinity;
      for(const it of rest){ const r=[...row,it], s=r.reduce((a,b)=>a+b.v,0)/sumR*area, mx=Math.max(...r.map(z=>z.v/sumR*area)), mn=Math.min(...r.map(z=>z.v/sumR*area));

      for(const it of row){ const len=it.v/sumR*area/thick;

    const y=x=>hi-lo<1e-9? h/2 : h-2-(x-lo)/(hi-lo)*(h-4);
    const col=v[v.length-1]>=v[0]?tok('--up'):tok('--down');
    return `<svg class="sl" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${v.map((x,i)=>(i*sx).toFixed(1)+','+y(x).toFixed(1)).join(' ')}"/></svg>`;
  }
  function storyScreens(){
    const S=DIG&&DIG.story; if(!S) return [];
    const L=[], n2=(v,d=2)=>v==null?'—':nf(v,d);
    const d=new Date(S.date+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
    const r=k=>(S.rates||[]).find(x=>x[0]===k);
    const big=[['Ключевая',r('Ключевая ЦБ')],['Вклады',r('Вклады топ-10')],['ОФЗ 3 г',r('ОФЗ 3 г')]].filter(x=>x[1]);
    L.push(`<div class="k">${escH(d)}</div><h2>Утро за 30 секунд</h2><div class="lvl l${S.status.level}"><div class="w"><i></i>${escH(S.status.word)}</div><ul>${(S.status.reasons||[]).map(x=>`<li>${escH(x)}</li>`).join('')}</ul></div>`
      + `<div class="big3">${big.map(([l,x])=>`<div><small>${l}</small><b class="num">${n2(x[1])}%</b></div>`).join('')}</div>`);
    if((S.since||[]).length) L.push(`<div class="k">что изменилось</div><h2>Со вчера</h2>${S.since.map(x=>`<div class="tx">${escH(x)}</div>`).join('')}`);
    if((S.rates||[]).length) L.push(`<div class="k">% годовых</div><h2>Ставки и доходности</h2>${S.rates.map(x=>`<div class="li"><span>${escH(x[0])}</span><b class="num">${n2(x[1])}%</b></div>`).join('')}`);
    if((S.fx||[]).length){ const fb=S.fxbonds||{}, nm={CNY:'юанях',USD:'долларах',EUR:'евро'};
      L.push(`<div class="k">курс ЦБ · за день · 30 дней</div><h2>Валюты</h2>${S.fx.map(x=>{ const k={'Доллар':'USD','Евро':'EUR','Юань':'CNY'}[x[0]]; return `<div class="li"><span>${escH(x[0])}<small class="${cls(x[2])}">${x[2]==null?'':sg(x[2],2)}</small></span><b class="num">${n2(x[1])} ₽${svgSpark(k)}</b></div>`; }).join('')}`
        + Object.entries(fb).map(([c,v])=>`<div class="tx">Облигации в ${nm[c]||c} (AA− и выше): около <b>${nf(v.med*100,1)}%</b> годовых в валюте</div>`).join('')); }
    if((S.markets||[]).length) L.push(`<div class="k">за день</div><h2>Рынки</h2>${S.markets.map(x=>`<div class="li"><span>${escH(x[0])}<small class="${cls(x[2])}">${x[2]==null?'':sg(x[2],2)}</small></span><b class="num">${nf(x[1],x[1]>1000?0:2)}</b></div>`).join('')}`);
    if((S.ratings||[]).length||(S.events||[]).length) L.push(`<div class="k">на этой неделе</div><h2>События и рейтинги</h2>${(S.ratings||[]).map(x=>`<div class="tx">${escH(x)}</div>`).join('')}${(S.events||[]).map(x=>`<div class="tx">🗓 ${escH(x)}</div>`).join('')}`);
    const qa=(S.answers||[])[0];
    if(qa) L.push(`<div class="k">что сказать клиенту</div><h2>Вопрос дня</h2><div class="qa"><b>${escH(qa.q)}</b>${escH(qa.a)}</div>`);
    return L;
  }
  function storyShow(i){
    const el=$('story'); ST.i=Math.max(0,Math.min(i,ST.list.length-1));
    el.innerHTML=`<div class="bars">${ST.list.map((_,j)=>`<i class="${j<ST.i?'done':j===ST.i?'cur':''}"><b></b></i>`).join('')}</div><button class="ovx" data-act="stclose" aria-label="закрыть">✕</button>
      <div class="tap l" data-act="stprev"></div><div class="tap r" data-act="stnext"></div>
      <div class="scr">${ST.list[ST.i]}</div>
      <div class="foot">${ST.i===ST.list.length-1?`<button data-act="stans">Все ответы клиенту</button><button data-act="stclose">Готово</button>`:''}</div>`;
    clearTimeout(ST.timer); ST.timer=setTimeout(()=>{ if(!el.classList.contains('paused')){ if(ST.i<ST.list.length-1) storyShow(ST.i+1); } }, 7000);
  }
  async function storyOpen(){
    if(!DIG) await loadDigest();
    ST.list=storyScreens();
    if(!ST.list.length){ TAB='today'; render(); return; }
    $('story').hidden=false; document.body.style.overflow='hidden'; storyShow(0);
  }
  function ovClose(){ clearTimeout(ST.timer); ['story','meet'].forEach(id=>{ $(id).hidden=true; $(id).innerHTML=''; }); document.body.style.overflow=''; kill(); render(); }
  // пауза удержанием
  document.addEventListener('pointerdown',e=>{ if(e.target.closest('#story .tap')){ $('story').classList.add('paused'); ST.hold=Date.now(); } });
  document.addEventListener('pointerup',()=>{ const el=$('story'); if(el.classList.contains('paused')){ el.classList.remove('paused'); if(Date.now()-(ST.hold||0)>400){ ST.held=true; storyShow(ST.i); } } });
  // ===== режим встречи: только крупные цифры для клиента, без служебного
  function curvePt(t){ const c=(DATA.curves||{})['сегодня']; if(!c) return null; const p=c.points.map(([x,y])=>[+x,y]).sort((a,b)=>a[0]-b[0]);
    for(let i=0;i<p.length-1;i++){ if(p[i][0]<=t&&t<=p[i+1][0]) return p[i][1]+(p[i+1][1]-p[i][1])*(t-p[i][0])/(p[i+1][0]-p[i][0]); } return t<p[0][0]?p[0][1]:p[p.length-1][1]; }
  function meetOpen(){
    if(!DATA) return;
    const v=k=>has(k)?last(k):null, o1=curvePt(1), o3=curvePt(3), o5=curvePt(5), dep=v('DEP'), corp=v('CORP_Y');
    const base=10e6, tsd=x=>x==null?'—':nf(base*x/100/1e3,0)+' тыс. ₽';
    const d=new Date(DATA.updated.slice(0,10)+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
    const c=(l,val,sub,cl='')=>`<div class="c ${cl}"><small>${l}</small><b class="num">${val}</b>${sub?`<em>${sub}</em>`:''}</div>`;
    const el=$('meet'); el.hidden=false; document.body.style.overflow='hidden';
    el.innerHTML=`<button class="ovx" data-act="stclose" aria-label="закрыть">✕</button><div class="in"><h1>Ставки и доходности</h1><div class="dt">на ${d} · Банк России, Московская биржа</div>
      <div class="g">${c('Ключевая ставка ЦБ', v('KEY')==null?'—':nf(v('KEY'))+'%', '', 'n')}${c('Вклады, лучшие ставки топ-10', dep==null?'—':nf(dep)+'%', 'до года')}${c('ОФЗ на 1 год', o1==null?'—':nf(o1)+'%', 'государство')}${c('ОФЗ на 3 года', o3==null?'—':nf(o3)+'%', 'доходность фиксируется')}
        <div class="c w2"><small>10 млн ₽ на год, до налога</small><div class="cmp"><span>Вклад топ-10</span><b class="num">${tsd(dep)}</b><span>ОФЗ на 3 года</span><b class="num">${tsd(o3)}</b>${corp!=null?`<span>Корпоративные облигации, в среднем</span><b class="num">${tsd(corp)}</b>`:''}</div></div>
        <div class="c w2"><small>Курсы ЦБ</small><div class="cmp">${['USD','EUR','CNY'].filter(has).map(k=>`<span>${SHORT[k]}</span><b class="num">${fmtVal(k)} ₽</b>`).join('')}</div></div>
        <div class="c w4"><small>Кривая ОФЗ: доходность по срокам — сейчас и на начало года</small><div class="cv"><canvas id="meetCurve"></canvas></div></div>
      </div></div>`;
    drawMeet();
  }
  function drawMeet(){ const cv=$('meetCurve'); if(!cv || cv.dataset.done) return; cv.dataset.done='1';
    const cs=Object.entries(DATA.curves||{}).filter(([l])=>l!=='год назад');
    if(cs.length) multiChart(cv,cs.map(([lab,cc])=>({label:lab,data:cc.points.map(([x,y])=>({x:+x,y}))})),false); }
  // ===== на главный экран телефона
  let INSTALL=null;
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); INSTALL=e; showInstall(); });
  function showInstall(){ const n=$('note'); if(!n||$('instBtn')) return; const tg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.addToHomeScreen;
    if(!INSTALL && !tg) return; n.insertAdjacentHTML('beforeend',' · <button class="inst" id="instBtn">📲 На главный экран</button>'); }
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

  // ---------- вкладки
  function render(){
    kill();
    const mc=$('meetCurve'); if(mc && !$('meet').hidden){ delete mc.dataset.done; drawMeet(); }
    document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
    let html='';
    if(TAB==='calc'){   // «Быстрое сравнение» — на странице облигаций
      store.set('tab','today'); $('app').innerHTML='<div class="card loading">Открываю подбор облигаций…</div>'; location.href='bonds.html?v=compare'; return;
    }
    if(TAB==='today'){ $('app').innerHTML=todayHtml(); if(!DIG) loadDigest(); else drawYear(); return; }
    if(TAB==='overview'){
      html = tilesRow(MINE.slice(0,4),true) + (MINE.length>4?tilesRow(MINE.slice(4),false):'') + `<div style="margin:-6px 0 12px;text-align:right"><button class="inst" data-act="mineed">Мои цифры: выбрать показатели</button></div>`
        + `<div class="grid2">${bigCard()}${perfCard()}</div>`
        + tableCard(null)
        + `<div class="grid2b">${ratesCard()}${curveCard()}</div>`;
    } else {
      const ks=TAB_SERIES[TAB].filter(has);
      if(!ks.includes(SEL)) SEL=ks[0];
      html = tilesRow(ks.slice(0,4),TAB==='rates') + bigCard() + `<div class="gap"></div>`;
      if(ks.length>4) html += tilesRow(ks.slice(4),false);
      if(TAB==='rates') html += `<div class="grid2b">${ratesCard()}${perfCard()}</div>`;
      if(TAB==='bonds') html += `<div class="grid2b">${curveCard()}${perfCard()}</div>`;
      if(TAB==='markets') html = heatHtml() + html;
      html += tableCard(ks,'Таблица');
    }
    $('app').innerHTML=html;
    document.querySelectorAll('.tile').forEach(t=>spark($('sp_'+t.dataset.k),t.dataset.k,t.classList.contains('hero')?'#ffffff':null));
    if($('big')) bigChart($('big'),SEL);
    document.querySelectorAll('tbody tr[data-k]').forEach(tr=>spark($('ts_'+tr.dataset.k),tr.dataset.k));
    if($('ratesCmp')) multiChart($('ratesCmp'),[['KEY','Ключевая',1],['DEP','Вклады топ-10',1],['RGBI_Y','ОФЗ',0],['CORP_Y','Корп.',0]]
      .filter(([k])=>has(k)).map(([k,l,st])=>({label:l,step:st,data:slice(k).map(([x,y])=>({x,y}))})));
    drawHeat();
    if($('curve')) multiChart($('curve'),Object.entries(DATA.curves||{}).map(([lab,c])=>({label:`${lab} (${fmtD(D(c.date))})`,data:c.points.map(([x,y])=>({x,y}))})),false);
  }

  // ---------- события
  document.addEventListener('click',e=>{
    const act=e.target.closest('[data-act]'); const a=act&&act.dataset.act;
    if(a==='stclose'){ ovClose(); return; }
    if(a==='stnext'){ if(ST.held){ ST.held=false; return; } if(ST.i<ST.list.length-1) storyShow(ST.i+1); else ovClose(); return; }
    if(a==='stprev'){ if(ST.held){ ST.held=false; return; } storyShow(ST.i-1); return; }
    if(a==='stans'){ ovClose(); TAB='today'; DSEG='answers'; store.set('dseg',DSEG); render(); window.scrollTo({top:0}); return; }
    if(a==='mineed'){ mineEditor(); return; }
    if(a==='heatre'){ HM=null; render(); return; }
    const wk=e.target.closest('[data-wk]'); if(wk){ WKSEL=wk.dataset.wk; render(); return; }
    if(a==='mineno'){ $('mineEd').hidden=true; return; }
    if(a==='mineok'){ const ch=[...document.querySelectorAll('#mineEd input:checked')].map(x=>x.value).slice(0,6); if(ch.length){ MINE=ch; store.set('mine',JSON.stringify(MINE)); } $('mineEd').hidden=true; render(); return; }
    const mn=e.target.closest('[data-mine]'); if(mn){ SEL=mn.dataset.mine; store.set('sel',SEL); TAB=Object.keys(TAB_SERIES).find(t=>TAB_SERIES[t].includes(SEL))||'overview'; store.set('tab',TAB); render(); setTimeout(()=>{ const b=$('bigCard'); if(b) b.scrollIntoView({block:'center'}); },60); return; }
    if(e.target.closest('#instBtn')){ const tg=window.Telegram&&Telegram.WebApp; if(INSTALL){ INSTALL.prompt(); INSTALL=null; } else if(tg&&tg.addToHomeScreen){ try{ tg.addToHomeScreen(); }catch(err){} } return; }
    if(e.target.closest('#storyBtn')){ storyOpen(); return; }
    if(e.target.closest('#meetBtn')){ meetOpen(); return; }
    const ds=e.target.closest('[data-dseg]'); if(ds){ DSEG=ds.dataset.dseg; store.set('dseg',DSEG); render(); window.scrollTo({top:0}); return; }
    const dr=e.target.closest('[data-act="dreload"]'); if(dr){ DIG=null; render(); loadDigest(); return; }
    const tabBtn=e.target.closest('[data-tab]'); if(tabBtn){ TAB=tabBtn.dataset.tab; FOCUS=null; store.set('tab',TAB); render(); window.scrollTo({top:0}); return; }
    const r=e.target.closest('.rng button'); if(r){ RANGE=r.dataset.r; store.set('range',RANGE); render(); return; }
    const th=e.target.closest('th[data-s]'); if(th){ const s=th.dataset.s; if(sortKey===s && s!=='group') sortAsc=!sortAsc; else {sortKey=s; sortAsc=false;} render(); return; }
    const sel=e.target.closest('.tile[data-k], tbody tr[data-k]');
    if(sel){ SEL=sel.dataset.k; FOCUS=null; store.set('sel',SEL); render(); const b=$('bigCard'); if(b) b.scrollIntoView({behavior:'smooth',block:'center'}); }
  });
  let RZ=null; window.addEventListener('resize',()=>{ clearTimeout(RZ); RZ=setTimeout(drawHeat,150); });
  document.addEventListener('change',e=>{ if(e.target.closest('#mineEd')){ const ch=document.querySelectorAll('#mineEd input:checked'); if(ch.length>6) e.target.checked=false; } });
  document.addEventListener('keydown',e=>{ if($('story').hidden) return; if(e.key==='ArrowRight') storyShow(ST.i+1); else if(e.key==='ArrowLeft') storyShow(ST.i-1); else if(e.key==='Escape') ovClose(); });
  $('themeBtn').addEventListener('click',()=>{
    const dark=getComputedStyle(document.documentElement).colorScheme.includes('dark'); const t=dark?'light':'dark';
    document.documentElement.dataset.theme=t; store.set('theme',t); if(DATA) render();
  });
  $('tabs').innerHTML=TABS.map(t=>`<button class="tab" data-tab="${t.id}">${t.name}</button>`).join('')+
''; 
  $('bnav').innerHTML=TABS.map(t=>`<button data-tab="${t.id}"><i>${t.icon}</i>${t.name}</button>`).join('');

  // ---------- переход по кнопке из Telegram: #IMOEX, #USD, #CURVE, #RATES, #PERF ...
  // кнопки из Telegram: ?v=details|news|money|placements|overview|calc|rates|CNY|CURVE… (якорь «#» Telegram затирает своими данными)
  function applyHash(){
    const qv=(new URLSearchParams(location.search).get('v')||'');
    const hv=(location.hash||'').replace('#',''); 
    let h=(qv || (hv.startsWith('tgWebApp')?'':hv)); if(!h||!DATA) return false;
    const lv=h.toLowerCase();
    if(lv==='stories'){ TAB='today'; render(); storyOpen(); return true; }
    if(lv==='meet'){ render(); meetOpen(); return true; }
    if(SEGS.some(([k])=>k===lv)){ TAB='today'; DSEG=lv; render(); return true; }
    if(TABS.some(t=>t.id===lv) && !TAB_SERIES[lv]?.includes?.(h.toUpperCase())){ TAB=lv; render(); return true; }
    h=h.toUpperCase();
    const special={CURVE:['bonds','card_CURVE'],RATES:['rates','card_RATES'],PERF:['overview','card_PERF']};
    let target;
    if(special[h]){ TAB=special[h][0]; FOCUS=h; target=special[h][1]; }
    else if(has(h)){ SEL=h; FOCUS=h; TAB=Object.keys(TAB_SERIES).find(t=>TAB_SERIES[t].includes(h))||'overview'; target='bigCard'; }
    else return false;
    render(); setTimeout(()=>{const el=$(target); if(el) el.scrollIntoView({block:'center'});},80);
    return true;
  }
  window.addEventListener('hashchange',applyHash);

  // ---------- внутри Telegram (кнопка «Дашборд» открывает страницу прямо в чате)
  const TG = window.Telegram && window.Telegram.WebApp;
  if(TG && TG.initData!==undefined && TG.platform && TG.platform!=='unknown'){
    try{ TG.ready(); TG.expand(); if(!store.get('theme','') && TG.colorScheme==='dark') document.documentElement.dataset.theme='dark'; }catch(e){}
  }

  fetch('data.json?'+Date.now()).then(r=>r.json()).then(j=>{
    DATA=j;
    const [d,t]=j.updated.split(' ');
    $('upd').textContent='Обновлено '+new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+', '+t+' МСК';
    $('note').textContent='Обновлено '+new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+', '+t+' МСК · '+$('note').textContent;
    if(!applyHash()) render();
    showInstall();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(!FOCUS) render(); else applyHash(); });
  }).catch(()=>{ $('app').innerHTML='<div class="card empty">Данные ещё не готовы: они появятся после первого запуска дайджеста.</div>'; $('upd').textContent=''; });
})();
</script>
</body>
</html>
